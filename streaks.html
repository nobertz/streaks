<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streaks">
<title>Streaks</title>
<link rel="apple-touch-icon" href="https://nobertz.github.io/streaks/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --bg-soft: #111114;
    --surface: #16161a;
    --surface2: #1e1e23;
    --surface3: #26262d;
    --border: #2a2a32;
    --border-soft: #1f1f26;
    --text: #f5f3f0;
    --text-muted: #8a8590;
    --text-dim: #4d4a52;
    --pink: #ff4d7e;
    --pink-soft: #ff6b94;
    --purple: #a855f7;
    --purple-soft: #c084fc;
    --flame-1: #ff4d7e;
    --flame-2: #ff6b6b;
    --flame-3: #a855f7;
    --danger: #e64545;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  input, textarea { -webkit-user-select: text; user-select: text; }

  html { overscroll-behavior: none; overflow-x: hidden; }
  body { overscroll-behavior: none; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-weight: 400;
    min-height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    padding-bottom: 30px;
  }

  /* Subtle ambient glow at top */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 400px;
    background: radial-gradient(circle, rgba(255,77,126,0.08), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* Noise texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.4;
  }

  /* ── HEADER ────────────────────────────────────────── */
  .header {
    padding: calc(56px + env(safe-area-inset-top, 0px)) 22px 16px;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    background: var(--bg);
    z-index: 10;
  }

  /* Status bar (Oct 2026): with viewport-fit=cover the page reaches the top of
     the screen, so the header's background now sits behind the clock and battery.
     The block above the header paints over anything that could still scroll into
     view up there. Bottom insets are deliberately not used anywhere: before
     viewport-fit=cover they were always 0, and using them now would lift the FAB,
     toast, sheets and Streaky by the height of the home bar. */
  .header::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    bottom: 100%;
    height: 400px;
    background: var(--bg);
  }

  /* Holds the place of the fixed header in normal flow. The CSS value is a
     fallback; JS measures the real height and keeps it in sync. */
  #headerSpacer {
    height: calc(180px + env(safe-area-inset-top, 0px));
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .header-right { display: flex; align-items: center; gap: 8px; }

  .date-label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }

  .icon-circle-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .icon-circle-btn:active { color: var(--pink); border-color: var(--pink); transform: scale(0.95); }
  .icon-circle-btn svg { width: 16px; height: 16px; }

  /* ── TABS ──────────────────────────────────────────── */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 3px;
  }

  .tab {
    flex: 1;
    padding: 9px 4px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.25s;
    position: relative;
    letter-spacing: 0.02em;
  }

  .tab.active {
    color: #fff;
    font-weight: 600;
  }
  /* Per-tab gradient colors */
  .tab[data-tab="streaks"].active {
    background: linear-gradient(135deg, #ff4d7e, #a855f7);
    box-shadow: 0 2px 12px rgba(255,77,126,0.3);
  }
  .tab[data-tab="goals"].active {
    background: linear-gradient(135deg, #f97316, #e11d48);
    box-shadow: 0 2px 12px rgba(249,115,22,0.3);
  }
  .tab[data-tab="checklist"].active {
    background: linear-gradient(135deg, #eab308, #f97316);
    box-shadow: 0 2px 12px rgba(234,179,8,0.3);
  }
  .tab[data-tab="bucket"].active {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    box-shadow: 0 2px 12px rgba(59,130,246,0.3);
  }

  /* ── CONTENT ───────────────────────────────────────── */
  .content {
    padding: 22px 18px 24px;
    position: relative;
    z-index: 1;
  }

  .pages-wrap {
    position: relative;
    touch-action: pan-y;
  }

  .page { display: none; }
  .page.active { display: block; animation: pageIn 0.25s ease both; }
  @keyframes pageIn {
    from { opacity: 0; transform: translateX(var(--swipe-from, 0)); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ── SECTION HEADER ───────────────────────────────── */
  .section-block {
    margin-bottom: 26px;
  }
  .section-block:last-of-type { margin-bottom: 14px; }

  .section-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 5px;
    gap: 8px;
  }

  .section-label-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Per-tab section label gradients */
  #page-streaks .section-label {
    background: linear-gradient(135deg, #ff4d7e, #a855f7);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .section-actions { display: flex; gap: 4px; align-items: center; }

  /* ── PROGRESS ─────────────────────────────────────── */

  /* Per-tab progress bar colors */

  /* ── ITEM CARDS (uniform style for all goal types) ── */

  /* Per-tab checkbox colors */

  /* No-checkbox variant for long-term style sections (still uniform font) */

  /* Goal items: left bar + subtle highlight outline */

  /* Folder items override the bar color via CSS variable */

  /* Per-tab gradient left bar via pseudo-element (preserves border-radius) */

  /* ── ADD BUTTON ───────────────────────────────────── */
  .add-btn {
    width: 100%;
    padding: 7px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    letter-spacing: 0.01em;
  }
  .add-btn:active {
    background: rgba(255,77,126,0.05);
    color: var(--pink);
    border-color: var(--pink);
  }

  /* ── EMPTY ────────────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 22px 16px;
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1.5;
    background: var(--surface);
    border: 1px dashed var(--border-soft);
    border-radius: var(--radius-sm);
  }

  /* ── STREAKS TAB ──────────────────────────────────── */
  .streak-card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
    margin-bottom: 7px;
  }

  .streak-card-main {
    padding: 8px 10px 7px 10px;
    cursor: pointer;
  }

  .streak-card-body {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .streak-flame-box {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .streak-left-col {
    display: flex;
    flex-direction: column;
    flex-shrink: 1;
    min-width: 0;
    max-width: 160px;
  }
  .streak-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .streak-count-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .streak-big-number {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }
  .streak-big-label {
    font-size: 11px;
    color: var(--text);
    font-weight: 800;
    margin-top: 1px;
  }

  .streak-dot-section {
    width: 172px;
    flex-shrink: 0;
  }
  .streak-dow-labels {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 4px;
  }
  .streak-dow-label {
    font-size: 8px;
    font-weight: 600;
    color: var(--text-dim);
    text-align: center;
    text-transform: uppercase;
  }
  .streak-dot-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(3, 17px);
    gap: 4px;
  }
  .s-dot {
    border-radius: 5px;
    background: rgba(0,0,0,0.34);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);
    transition: background 0.2s, opacity 0.2s;
  }
  .s-dot.future { opacity: 0.35; }
  .s-dot.today-ring { box-shadow: 0 0 0 2px rgba(255,255,255,0.55); }

  .streak-controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }
  .streak-dots-btn {
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .streak-ring-btn {
    width: 38px; height: 38px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .streak-ring-btn:active { transform: scale(0.9); }
  .streak-ring-btn svg { width: 38px; height: 38px; overflow: visible; }
  .streak-yday-btn {
    width: 32px; height: 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .streak-yday-btn:active { background: var(--surface3); }
  .streak-yday-btn svg { width: 13px; height: 13px; }

  /* Expanded analytics */
  .streak-expanded {
    border-top: 1px solid var(--border-soft);
    padding: 13px 12px 14px;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  .streak-card.expanded .streak-expanded { display: block; }
  .stat-box {
    background: var(--surface2);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 9px 10px;
  }
  .stat-label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    margin-bottom: 3px;
  }
  .stat-value {
    font-size: 19px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.5px;
  }

  /* GitHub-style heatmap navigation */
  .heatmap-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .heatmap-nav-btn {
    width: 26px; height: 26px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .heatmap-nav-btn:active { background: var(--surface3); }
  .heatmap-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .heatmap-nav-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  /* GitHub-style week-column heatmap — fixed 11px dots */
  .gh-heatmap-outer {
    display: flex;
    flex-direction: row;
    gap: 2px;
    align-items: flex-start;
    overflow: hidden;
  }
  .gh-heatmap-dow-labels {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex-shrink: 0;
    margin-top: 12px;
  }
  .gh-dow-label {
    width: 9px;
    height: 11px;
    font-size: 7px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    line-height: 11px;
    text-align: right;
  }
  .gh-heatmap-grid {
    display: flex;
    flex-direction: row;
    gap: 2px;
    overflow: hidden;
    flex: 1;
  }
  .gh-week-col {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
    max-width: 16px;
  }
  .gh-week-month-label {
    height: 10px;
    font-size: 7px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
    line-height: 10px;
  }
  .h-dot {
    width: 100%;
    height: 11px;
    border-radius: 2px;
    background: rgba(0,0,0,0.34);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .h-dot.empty { background: transparent; pointer-events: none; }
  .h-dot.future { opacity: 0.2; }
  .h-dot.today-ring { box-shadow: 0 0 0 1.5px rgba(255,255,255,0.55); }

  /* Add habit modal extras */

  /* Yesterday level picker */

  .streak-card.drag-source { opacity: 0.2; border: 1.5px dashed var(--border); background: transparent; pointer-events: none; }
  .streak-card.drag-shift-down { transform: translateY(6px); transition: transform 0.18s ease; }
  .streak-card.drag-shift-up { transform: translateY(-6px); transition: transform 0.18s ease; }
  /* ── FOCUS FAB (floating action button, bottom-right) ── */
  .focus-fab {
    position: fixed;
    bottom: 22px;   /* see the note at .header: bottom insets stay 0 so the FAB doesn't move */
    right: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .focus-btn {
    background: linear-gradient(135deg, var(--pink) 0%, #ff6b6b 50%, var(--purple) 100%);
    border: none;
    border-radius: 50px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 7px;
    box-shadow: 0 6px 24px rgba(255,77,126,0.45), 0 2px 8px rgba(168,85,247,0.25);
    transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: auto;
    white-space: nowrap;
    overflow: hidden;
    /* Collapsed state: circle with centered icon */
    width: 46px;
    height: 46px;
    padding: 0;
    line-height: 1;
  }
  .focus-btn.expanded {
    width: 230px;
    height: 46px;
    padding: 0 18px 0 14px;
  }
  .focus-btn:active { transform: scale(0.95); }
  .focus-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .focus-btn-label {
    display: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .focus-btn.expanded .focus-btn-label {
    display: block;
  }

  /* ── MODAL ────────────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    backdrop-filter: blur(6px);
  }
  .modal-overlay.open { display: flex; animation: fadeIn 0.2s; }

  .modal {
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    padding: 26px 22px 32px;
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    border-top: 1px solid var(--border);
    animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    position: relative;
  }
  .modal::before {
    content: '';
    position: absolute;
    top: 8px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 4px;
    background: var(--surface3);
    border-radius: 99px;
  }

  .modal-title {
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 16px;
    margin-top: 8px;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .modal-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    resize: none;
    min-height: 56px;
    transition: border-color 0.2s;
  }
  .modal-input:focus { border-color: var(--pink); }

  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }

  .btn-cancel {
    flex: 1;
    padding: 13px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-cancel:active { color: var(--text); }

  .btn-save {
    flex: 2;
    padding: 13px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none;
    border-radius: var(--radius-sm);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 12px rgba(255,77,126,0.3);
  }
  .btn-save:active { opacity: 0.9; transform: scale(0.99); }

  .btn-danger {
    background: rgba(230,69,69,0.15);
    color: #ff8585;
    border: 1px solid rgba(230,69,69,0.3);
    box-shadow: none;
  }

  /* ── ACTION SHEET (for ⋮ button on items) ─────────── */
  .action-sheet { padding-top: 14px; }
  .action-sheet-btn {
    width: 100%;
    padding: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 10px;
    transition: all 0.15s;
    text-align: left;
  }
  .action-sheet-btn:active { background: var(--surface3); }
  .action-sheet-btn.danger { color: #ff8585; }
  .action-sheet-btn svg { width: 16px; height: 16px; }

  /* ── SETTINGS MODAL ─────────────────────────────── */
  .settings-section-title {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 600;
    margin: 12px 0 8px;
  }
  .settings-section-title:first-child { margin-top: 0; }

  /* ── KEYFRAMES ────────────────────────────────────── */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes flameFlicker {

    50% { filter: drop-shadow(0 0 8px rgba(255,77,126,0.9)); }

  /* Long-press visual feedback */

  /* ── DRAG & DROP ─────────────────────────────────── */
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 999;
    border-radius: var(--radius-sm);
    background: var(--surface2);
    border: 1.5px solid var(--pink);
    box-shadow: 0 12px 40px rgba(255,77,126,0.35), 0 4px 16px rgba(0,0,0,0.6);
    opacity: 0.95;
    transform: scale(1.03) rotate(0.8deg);
    left: 0; top: 0;
    will-change: transform;
    transition: box-shadow 0.15s ease;
  }
  .drag-insert-line {
    height: 2px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    border-radius: 99px;
    margin: 2px 0;
    box-shadow: 0 0 8px rgba(255,77,126,0.6);
    pointer-events: none;
    position: relative;
    z-index: 5;
    animation: insertPulse 0.8s ease infinite alternate;
  }
  .drag-insert-line::before, .drag-insert-line::after {
    content: '';
    position: absolute;
    top: 50%; transform: translateY(-50%);
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--pink);
    box-shadow: 0 0 6px rgba(255,77,126,0.8);
  }
  .drag-insert-line::before { left: 0; }
  .drag-insert-line::after { right: 0; }
  @keyframes insertPulse { from { opacity: 0.7; } to { opacity: 1; } }

  /* ── FOLDER CARDS ────────────────────────────────── */

  /* ── COMPACT (collapsed) HABIT GRID ──────────────── */
  .compact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
  }
  .compact-chip {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-sm);
    padding: 8px 8px 7px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    min-height: 50px;
    transition: transform 0.12s, border-color 0.2s;
  }
  .compact-chip-top {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  /* Current week only — seven dots, Sunday through Saturday. */
  .compact-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
    padding: 13px 1px 0;   /* top room for day markers, which float above the pill */
  }
  .compact-dot {
    height: 5px;
    border-radius: 2.5px;
    background: rgba(0,0,0,0.4);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .compact-dot.future { background: rgba(0,0,0,0.2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); }
  .compact-dot.today-ring { box-shadow: 0 0 0 1.5px rgba(255,255,255,0.30); }

  /* ── Day markers (habit.marks) ──
     A marked dot is wrapped in .mk-cell so the icon is a sibling of the dot,
     not a child — dots carry opacity (gradient levels, future, weekly outline)
     and the icon must not inherit it. */
  .mk-cell { position: relative; min-width: 0; }
  .mk-cell > .s-dot { width: 100%; height: 100%; }
  .mk-cell.mk-h { height: 11px; flex-shrink: 0; }
  .mk-cell.mk-h > .h-dot { height: 100%; }
  .mk-icon {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center;
    line-height: 1; pointer-events: none;
  }
  .mk-icon svg { display: block; filter: drop-shadow(0 0 1.2px rgba(0,0,0,0.9)); }
  .mk-emoji { filter: drop-shadow(0 0 1px rgba(0,0,0,0.6)); }
  .mk-s .mk-icon svg { width: 13px; height: 13px; }
  .mk-s .mk-emoji { font-size: 11px; }
  .mk-h .mk-icon svg { width: 10px; height: 10px; }
  .mk-h .mk-emoji { font-size: 8.5px; }
  /* Compact view: the icon floats just above its pill, like a flag. */
  .mk-c .mk-icon { top: auto; bottom: calc(100% + 1px); transform: translateX(-50%); }
  .mk-c .mk-icon svg { width: 12px; height: 12px; filter: none; }
  .mk-c .mk-emoji { font-size: 10.5px; filter: none; }

  /* Edit history: Log / Mark toggle */

  /* Marker picker sheet */
  .mark-picker-overlay { z-index: 260; }
  .mark-picker-sub { font-size: 12px; color: var(--text-muted); margin: -4px 0 14px; }
  .mark-arrows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .mark-emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .mark-opt {

  .mark-opt.selected { border-color: var(--text); background: var(--surface3); box-shadow: 0 0 0 1px var(--text); }
  .mark-remove { color: var(--danger) !important; }
  .compact-chip:active { transform: scale(0.96); }
  .compact-flame {

  .view-toggle-btn {

  }
  .view-toggle-btn:active { color: var(--pink); border-color: var(--pink); }

  /* ── STAT BOXES (2x2) ────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
    margin-bottom: 13px;
  }
  .stats-grid .stat-box { padding: 7px 6px; }
  .stats-grid .stat-label {

    letter-spacing: 0.06em;
    margin-bottom: 2px;
    white-space: nowrap;

  .stat-chip {

  }
  .stat-sub {
    font-size: 8px;
    color: var(--text-dim);

    margin-top: 2px;
    letter-spacing: 0;
    white-space: nowrap;
    overflow: hidden;

  }

  /* ── HABIT DESCRIPTION ───────────────────────────── */
  .habit-desc {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-muted);
    padding: 2px 0 2px 10px;
    margin-bottom: 13px;
    border-left: 2px solid var(--border);
  }

  .chart-empty {
    font-size: 11.5px;
    color: var(--text-dim);
    text-align: center;
    padding: 16px 10px;
    background: var(--surface2);
    border: 1px dashed var(--border-soft);
    border-radius: var(--radius-sm);
    line-height: 1.5;
  }

    /* ─────────────────────────────────────────────────
       STREAKY — mascot dialog
       ───────────────────────────────────────────────── */
    .streaky-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .streaky-btn:active { transform: scale(0.92); }
    .streaky-btn img {
      width: 26px; height: 26px;
      object-fit: contain;
      display: block;
      transform: translateX(1px);
    }

    .streaky-overlay {
      position: fixed; inset: 0;
      z-index: 2000;
      display: none;
      background: rgba(6, 6, 12, 0.82);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      opacity: 0;
      transition: opacity 0.28s ease;
    }
    .streaky-overlay.open { display: block; opacity: 1; }
    .streaky-overlay.closing { opacity: 0; }

    .streaky-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 14px 18px;
    }

    .streaky-portrait-wrap {
      display: flex;
      justify-content: flex-end;
      padding-right: 6px;
      margin-bottom: -14px;
      pointer-events: none;
      /* Lift is set per line by skSeatPortrait(); glide so the rare
         move reads as floating up rather than snapping. */
      transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .streaky-portrait {
      position: relative;
      width: 168px;
      max-width: 46vw;
      aspect-ratio: 365 / 318;   /* matches the shared art canvas */
      /* Mood knobs. Each expression overrides these below, so the
         flame behaves differently without touching the keyframes. */
      --sk-float: 3.4s;
      --sk-flicker: 2.1s;
      --sk-ember: 1.37s;
      --sk-glow-a: rgba(255,77,126,0.34);
      --sk-glow-b: rgba(160,80,255,0.18);
      --sk-ember-a: rgba(255,176,32,0.30);
      --sk-ember-b: rgba(255,77,126,0.13);
      --sk-shadow: rgba(255,77,126,0.35);
      /* Entrance, then hand off to the idle float once it lands. */
      animation:
        streakyIn 0.42s cubic-bezier(0.22, 1, 0.36, 1),
        streakyFloat var(--sk-float) ease-in-out 0.42s infinite;
    }

    /* Per-mood flame. Chill barely moves; unhinged is a strobe. */
    .streaky-portrait.m-chill {
      --sk-float: 5.2s; --sk-flicker: 3.2s; --sk-ember: 2.3s;
      --sk-glow-a: rgba(255,77,126,0.20); --sk-glow-b: rgba(120,90,255,0.14);
      --sk-ember-a: rgba(255,176,32,0.16); --sk-shadow: rgba(255,77,126,0.24);
    }
    .streaky-portrait.m-uncertain {
      --sk-float: 4.4s; --sk-flicker: 2.9s; --sk-ember: 2.0s;
      --sk-glow-a: rgba(255,120,90,0.24); --sk-glow-b: rgba(160,80,255,0.12);
      --sk-ember-a: rgba(255,150,60,0.20); --sk-shadow: rgba(255,120,90,0.28);
    }
    .streaky-portrait.m-pumped {
      --sk-float: 2.4s; --sk-flicker: 1.25s; --sk-ember: 0.86s;
      --sk-glow-a: rgba(255,120,60,0.46); --sk-glow-b: rgba(255,60,140,0.24);
      --sk-ember-a: rgba(255,214,90,0.42); --sk-ember-b: rgba(255,120,40,0.20);
      --sk-shadow: rgba(255,140,60,0.52);
    }
    .streaky-portrait.m-unhinged {
      --sk-float: 1.9s; --sk-flicker: 0.62s; --sk-ember: 0.44s;
      --sk-glow-a: rgba(255,90,60,0.52); --sk-glow-b: rgba(190,60,255,0.30);
      --sk-ember-a: rgba(255,240,180,0.46); --sk-ember-b: rgba(255,90,40,0.24);
      --sk-shadow: rgba(255,110,90,0.58);
    }

    /* Two stacked layers so a mood change crossfades instead of popping. */
    .streaky-portrait img {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 14px var(--sk-shadow));
      transition: opacity 0.24s ease, filter 0.4s ease;
    }
    .streaky-overlay.closing .streaky-portrait {
      animation: streakyOut 0.3s ease forwards;
    }
    /* Main glow. Flicker period is deliberately not a multiple of the
       float period so the two never sync up and look mechanical. */
    .streaky-portrait::before {
      content: '';
      position: absolute;
      inset: -18%;
      background: radial-gradient(circle at 50% 55%, var(--sk-glow-a) 0%, var(--sk-glow-b) 45%, rgba(0,0,0,0) 70%);
      filter: blur(8px);
      z-index: 0;
      transform-origin: 50% 62%;
      animation: streakyFlicker var(--sk-flicker) ease-in-out infinite;
    }
    /* Hotter ember core, faster and offset again. */
    .streaky-portrait::after {
      content: '';
      position: absolute;
      inset: -4%;
      background: radial-gradient(circle at 50% 64%, var(--sk-ember-a) 0%, var(--sk-ember-b) 42%, rgba(0,0,0,0) 68%);
      filter: blur(10px);
      z-index: 0;
      transform-origin: 50% 68%;
      animation: streakyEmber var(--sk-ember) ease-in-out infinite;
    }

    @keyframes streakyIn {
      from { opacity: 0; transform: translateX(46px) translateY(10px); }
      to   { opacity: 1; transform: translateX(0) translateY(0); }
    }
    @keyframes streakyOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(56px); }
    }
    @keyframes streakyFloat {
      0%   { transform: translateY(0)    rotate(0deg)    scale(1); }
      28%  { transform: translateY(-5px) rotate(-0.7deg) scale(1.012); }
      55%  { transform: translateY(-2px) rotate(0.5deg)  scale(0.996); }
      78%  { transform: translateY(-6px) rotate(0.3deg)  scale(1.009); }
      100% { transform: translateY(0)    rotate(0deg)    scale(1); }
    }
    @keyframes streakyFlicker {
      0%, 100% { opacity: 0.82; transform: scale(1); }
      35%      { opacity: 1;    transform: scale(1.06); }
      68%      { opacity: 0.72; transform: scale(0.975); }
    }
    @keyframes streakyEmber {
      0%, 100% { opacity: 0.52; transform: scale(0.98) translateY(0); }
      45%      { opacity: 0.95; transform: scale(1.06) translateY(-2px); }
      72%      { opacity: 0.60; transform: scale(1.01) translateY(1px); }
    }

    /* Streaky's seat: sized for the COMMON line, not the tallest one.
       The box is absolutely positioned inside it and grows upward out
       of it, so ordinary lines never move him at all. */
    .streaky-box-area {
      position: relative;
      height: clamp(150px, 25vh, 215px);
    }

    .streaky-box {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      max-height: min(420px, calc(100dvh - 300px));
      background: linear-gradient(180deg, rgba(24,24,34,0.97), rgba(16,16,24,0.97));
      border: 1.5px solid rgba(255,77,126,0.42);
      border-radius: 16px;
      padding: 16px 18px 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: streakyBoxIn 0.34s cubic-bezier(0.22, 1, 0.36, 1);
      min-height: 116px;
    }
    /* Overflow lives on an inner wrapper so the ▾ arrow stays put. */
    .streaky-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes streakyBoxIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .streaky-name {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--pink);
      margin-bottom: 8px;
    }
    .streaky-header {
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .streaky-text {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.55;
      color: var(--text);
      font-weight: 500;
    }

    .streaky-extra { margin-top: 14px; display: none; }
    .sk-check-row {
      display: flex; align-items: center; gap: 11px;
      padding: 11px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 11px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: opacity 0.2s ease, background 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .sk-check-row:active { background: rgba(255,255,255,0.06); }
    .sk-check-box {
      width: 20px; height: 20px; flex-shrink: 0;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #fff;
      transition: all 0.18s ease;
    }
    .sk-check-box span { opacity: 0; transition: opacity 0.15s ease; }
    .sk-check-row.done .sk-check-box { background: var(--pink); border-color: var(--pink); }
    .sk-check-row.done .sk-check-box span { opacity: 1; }
    .sk-check-row.done .sk-check-text { text-decoration: line-through; color: var(--text-dim); }
    .sk-check-text {
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.4;
    }
    .sk-tag {
      font-family: 'Inter', sans-serif;
      font-size: 10px; font-weight: 700;
      padding: 3px 7px; border-radius: 6px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.07);
      color: var(--text-muted);
    }
    .sk-tag.overdue { background: rgba(245,158,11,0.16); color: #f59e0b; }
    .sk-tag.soon { background: rgba(251,146,60,0.16); color: #fb923c; }
    .sk-bucket-row {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px;
      background: color-mix(in srgb, var(--c) 8%, var(--surface2));
      border: 1px solid color-mix(in srgb, var(--c) 22%, var(--border));
      border-radius: 11px;
      margin-bottom: 8px;
    }
    .sk-bucket-star { width: 18px; height: 18px; flex-shrink: 0; color: var(--c); display: flex; }
    .sk-bucket-star svg { width: 18px; height: 18px; }
    .sk-bucket-tag { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); margin-top: 3px; }
    .sk-bucket-tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); display: inline-block; }

    .streaky-next {
      position: absolute;
      right: 16px; bottom: 12px;
      font-size: 13px;
      color: var(--pink);
      font-weight: 800;
      animation: streakyBlink 1.4s ease-in-out infinite;
    }
    @keyframes streakyBlink {
      0%, 100% { opacity: 0.35; transform: translateY(0); }
      50%      { opacity: 1; transform: translateY(2px); }
    }

    .streaky-hint {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      color: rgba(255,255,255,0.32);
      margin-top: 10px;
      letter-spacing: 0.3px;
    }

    /* ── Typewriter reveal ──
       Every character exists from frame one at opacity 0, so the box
       height is final immediately and nothing reflows while typing.
       Words are wrapped so line breaks still land between words. */
    .sk-w { display: inline-block; white-space: pre; }
    .sk-ch {
      display: inline-block;
      position: relative;
      opacity: 0;
      transform: translateY(0.34em) scale(0.84);
    }
    .sk-ch.in {
      opacity: 1;
      transform: translateY(0) scale(1);
      transition: opacity 80ms linear,
                  transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    /* Jitter rides on left/top, not transform, so it can coexist with
       the pop-in above. Only the newest ~3 characters ever have it. */
    .sk-ch.jit { animation: skJitter 0.14s steps(1, end) infinite; }
    @keyframes skJitter {
      0%   { left:  0.4px; top: -0.5px; }
      33%  { left: -0.5px; top:  0.4px; }
      66%  { left:  0.3px; top:  0.5px; }
      100% { left: -0.3px; top: -0.4px; }
    }

    /* Extra slot holds its space while typing so the box never jumps. */
    .streaky-extra.sk-veiled {
      opacity: 0;
      pointer-events: none;
    }
    .streaky-extra {
      transition: opacity 0.22s ease;
    }
    .streaky-next.sk-veiled { opacity: 0; animation: none; }

    /* Yes/No and category boxes for the review offer. */
    .sk-choice-row { display: flex; gap: 8px; margin-top: 2px; }
    .sk-choice-row.col { flex-direction: column; }
    .sk-choice {
      flex: 1;
      text-align: center;
      padding: 11px 12px;
      border: 1.5px solid rgba(255,77,126,0.45);
      border-radius: 11px;
      background: rgba(255,77,126,0.08);
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--pink);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s ease, transform 0.12s ease;
    }
    .sk-choice:active { transform: scale(0.97); background: rgba(255,77,126,0.18); }
    .sk-choice.dim {
      border-color: var(--border);
      background: var(--surface2);
      color: var(--text-muted);
    }
    .sk-choice.dim:active { background: rgba(255,255,255,0.07); }
    .sk-choice-sub {
      display: block;
      font-size: 10px;

  /* ══════════════════════════════════════════════════════
     STREAK FIRE (Oct 2026, v2.4)
     fireDecorate() lays a fire outline around each run of streak days,
     in every grid: card 3-week grid, compact week strip, month calendar,
     4-month grid, Edit history. fr-blaze when today (weekly: the week's
     target) is done, fr-smolder (dim, no flames) while it's still open.
     fr-inplay: a weekly habit's current week before its target, drawn as
     a thin unlit outline that catches fire when the target is met.
     ══════════════════════════════════════════════════════ */
  /* Cards only fade in when you arrive on the tab, not on every redraw. */
  #page-streaks.st-enter .streak-card { animation: fadeSlideIn .3s ease both; }
  #page-streaks.st-enter .compact-chip { animation: fadeSlideIn .25s ease both; }

  .streak-dot-grid, .compact-week, .gh-heatmap-grid, .mc-grid { position: relative; }
  .streak-dot-grid > :not(.fire-run), .compact-week > :not(.fire-run), .gh-week-col > *, .mc-grid > :not(.fire-run) { position: relative; z-index: 1; }
  .compact-week > .mk-cell { z-index: 3; }
  .fire-run { position: absolute; pointer-events: none; }

  /* Fire outline: a glowing line around the days, a light traveling along it, small flames on top. */
  .fr-outline { z-index: 2; border-radius: 8px; --th: 7px; }
  .fr-outline::before { content: ''; position: absolute; inset: 0; border-radius: inherit; border: 1.5px solid var(--c);
    box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent), inset 0 0 6px color-mix(in srgb, var(--c) 28%, transparent);
    animation: frFlicker 1.6s ease-in-out infinite; }
  .fr-outline .flow { position: absolute; inset: 0; border-radius: inherit; padding: 1.5px;
    background: linear-gradient(90deg, transparent 0 30%, var(--cl) 42%, #fff 50%, var(--cl) 58%, transparent 70% 100%) 0 0 / 200% 100%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: frOlFlow 2.4s linear infinite; }
  .fr-outline i { position: absolute; left: 1px; right: 1px; bottom: calc(100% - 3px); height: var(--th); pointer-events: none; transform-origin: 50% 100%; mix-blend-mode: screen; filter: blur(.9px); opacity: .75;
    background: radial-gradient(ellipse 42% 100% at 50% 100%, color-mix(in srgb, var(--cl) 80%, transparent) 0%, color-mix(in srgb, var(--c) 55%, transparent) 48%, transparent 72%) 0 100% / 11px var(--th) repeat-x;
    animation: frTongues .55s ease-in-out infinite alternate; }
  .fr-outline.fr-smolder::before { opacity: .5; animation-duration: 3s; box-shadow: 0 0 4px color-mix(in srgb, var(--c) 40%, transparent); }
  .fr-outline.fr-smolder .flow { opacity: .4; animation-duration: 4.5s; }
  .fr-outline.fr-smolder i { display: none; }
  @keyframes frFlicker { 0%, 100% { opacity: .82; } 40% { opacity: 1; } 70% { opacity: .68; } }
  @keyframes frOlFlow { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  @keyframes frOlFlowV { from { background-position: 0 150%; } to { background-position: 0 -50%; } }
  @keyframes frTongues { from { transform: scaleY(.6); background-position-x: 0; } to { transform: scaleY(1.1); background-position-x: 5px; } }
  /* Per grid: corner radius and flame height follow the size of the days. */
  .compact-week .fr-outline, .compact-week .fr-inplay { border-radius: 6px; --th: 5px; }
  .mc-grid .fr-outline, .mc-grid .fr-inplay { border-radius: 12px; }
  .gh-heatmap-grid .fr-outline, .gh-heatmap-grid .fr-inplay { border-radius: 4px; }
  .gh-heatmap-grid .fr-outline::before { border-width: 1px; }
  .gh-heatmap-grid .fr-outline .flow { padding: 1px; background-image: linear-gradient(180deg, transparent 0 30%, var(--cl) 42%, #fff 50%, var(--cl) 58%, transparent 70% 100%); background-size: 100% 200%; animation-name: frOlFlowV; }
  .gh-heatmap-grid .fr-outline i { display: none; }

  /* A finished week (weekly habits): a dim fiery wash behind the whole week, so the
     days between logs read as part of it. Dimmer while this week's goal is still open. */
  .fr-wash { z-index: 1; border-radius: 7px; mix-blend-mode: screen;
    background: linear-gradient(0deg, color-mix(in srgb, var(--c) 34%, transparent), color-mix(in srgb, var(--cl) 13%, transparent) 80%);
    animation: frWash 4.2s ease-in-out infinite; }
  .fr-wash.fr-smolder { opacity: .5; animation-duration: 6s; }
  @keyframes frWash { 0%, 100% { filter: brightness(1); } 45% { filter: brightness(1.35); } 70% { filter: brightness(.9); } }
  .compact-week .fr-wash { border-radius: 5px; }
  .mc-grid .fr-wash { border-radius: 11px; }
  .gh-heatmap-grid .fr-wash { border-radius: 3px; }

  /* Weekly habit, current week before its target: a thin unlit outline. */
  .fr-inplay { z-index: 0; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--c) 24%, transparent); }

  .fr-surge { animation: frSurge .75s ease-out; }
  @keyframes frSurge { 30% { filter: brightness(1.9) saturate(1.2); } }

  /* Habit cards and their expanded details sit on a tinted background, so their
     gray panels use a darker fill with a faint edge (same as the day squares). */
  #page-streaks .stat-box,
  #page-streaks .heatmap-nav-btn,
  #page-streaks .seg,
  #page-streaks .streak-yday-btn,
  #page-streaks .compact-yday-btn { background: rgba(0,0,0,.3); border-color: rgba(255,255,255,.07); }
  #page-streaks .heatmap-nav-btn:active, #page-streaks .streak-yday-btn:active, #page-streaks .compact-yday-btn:active { background: rgba(0,0,0,.45); }
  #page-streaks .chart-empty { background: rgba(0,0,0,.28); border-color: rgba(255,255,255,.09); }

  /* Flame square (streakFire().flame). Lit when today is done; times-a-week habits only
     when the week's goal is met, and halfway (fb-half) on a day logged before that.
     Streak alive but not done yet: dark, a hint of the habit color, and a small
     ember glowing at the base of the flame. Out: gray, with smoke. */
  .fb { position: relative; transition: background .4s, box-shadow .4s; }
  .fb svg { transform-origin: 50% 90%; position: relative; z-index: 1; }
  .fb-blaze { background: linear-gradient(135deg, var(--c), var(--cd)); box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 45%, transparent); animation: fbGlow 1.8s ease-in-out infinite; }
  .fb-blaze svg { fill: #fff; animation: fbFlick 1.1s ease-in-out infinite; }
  .fb-smolder { background: color-mix(in srgb, var(--c) 7%, rgba(0,0,0,.38)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 17%, rgba(255,255,255,.04)); }
  .fb-smolder svg { fill: color-mix(in srgb, var(--c) 26%, #2a272e); }
  .fb-smolder::after { content: ''; position: absolute; z-index: 2; left: 31%; right: 31%; top: 57%; height: 24%; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(ellipse at 50% 70%, color-mix(in srgb, var(--cl) 70%, transparent) 0%, color-mix(in srgb, var(--c) 35%, transparent) 42%, transparent 72%);
    animation: fbEmber 3.4s ease-in-out infinite; }
  /* Halfway (times-a-week habits): logged today, the week's goal isn't met yet. */
  .fb-half { background: color-mix(in srgb, var(--c) 14%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 38%, transparent); }
  .fb-half svg { fill: var(--c); animation: fbBreathe 2.8s ease-in-out infinite; }
  @keyframes fbBreathe { 50% { opacity: .55; } }
  .fb-dead { background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,.07); }
  .fb-dead svg { fill: rgba(255,255,255,.17); }
  .compact-flame.fb-blaze { box-shadow: 0 3px 10px color-mix(in srgb, var(--c) 40%, transparent); }
  @keyframes fbFlick { 0%, 100% { transform: scale(1) skewX(0); } 25% { transform: scale(1.06, .95) skewX(-3deg); } 50% { transform: scale(.97, 1.06) skewX(2deg); } 75% { transform: scale(1.03, .98) skewX(-1deg); } }
  @keyframes fbGlow { 50% { box-shadow: 0 4px 22px color-mix(in srgb, var(--c) 72%, transparent); } }
  @keyframes fbEmber { 0%, 100% { opacity: .38; transform: scale(.9); } 45% { opacity: .85; transform: scale(1.06); } 70% { opacity: .5; } }
  .fb-boom { position: absolute; z-index: 3; inset: -14px; border-radius: 50%; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(255,255,255,.95), color-mix(in srgb, var(--cl) 80%, transparent) 30%, color-mix(in srgb, var(--c) 45%, transparent) 55%, transparent 72%);
    animation: fbBoom .5s ease-out forwards; }
  @keyframes fbBoom { 0% { transform: scale(.3); opacity: 0; } 15% { opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

  /* Out: the habit drains of color (cards keep their details colored) */
  #page-streaks .streak-card.st-dead, #page-streaks .compact-chip.st-dead { background: var(--surface); border-color: var(--border-soft); }
  #page-streaks .streak-card.st-dead .streak-card-main, #page-streaks .compact-chip.st-dead { filter: saturate(.12) brightness(.92); }
  #page-streaks .streak-card.fx-revive .streak-card-main, #page-streaks .compact-chip.fx-revive { animation: fxRevive .8s ease-out; }
  #page-streaks .streak-card.fx-die .streak-card-main, #page-streaks .compact-chip.fx-die { animation: fxDie .8s ease-out; }
  @keyframes fxRevive { from { filter: saturate(.12) brightness(.92); } to { filter: none; } }
  @keyframes fxDie { from { filter: none; } to { filter: saturate(.12) brightness(.92); } }
  #page-streaks .compact-sub { color: var(--c); }
  #page-streaks .compact-chip.st-dead .compact-sub { color: var(--text-dim); }
  .fx-jolt { animation: fxJolt .3s ease-out; }
  @keyframes fxJolt { 20% { transform: translate(1.5px, -1px); } 45% { transform: translate(-1.5px, 1px); } 70% { transform: translate(1px, .5px); } }
  .fx-numpop { transform-origin: 0 60%; animation: fxNumPop .55s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes fxNumPop { 40% { transform: scale(1.4); color: var(--cl); text-shadow: 0 0 12px var(--c); } }

  /* Log button: tinted circle with a plus; solid fill with a check when done.
     1–4 habits show the level with an arc. The done fill is painted under the
     border too (border-box), so the transparent border doesn't show a mismatched rim. */
  .log-btn { position: relative; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    border: 1.5px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 12%, transparent); color: var(--cl);
    transition: background .25s, border-color .25s, box-shadow .25s; }
  .streak-ring-btn .log-btn svg:not(.log-arc), .compact-ring-btn .log-btn svg:not(.log-arc) { width: 16px; height: 16px; overflow: visible; }
  .log-btn b { font: 800 15px 'Inter', sans-serif; font-variant-numeric: tabular-nums; }
  .log-btn.on { background: linear-gradient(135deg, var(--c), var(--cd)) border-box; border-color: transparent; color: #fff; box-shadow: 0 3px 14px color-mix(in srgb, var(--c) 55%, transparent); }
  .log-btn.scale:not(.on) { border-color: color-mix(in srgb, var(--c) 25%, transparent); }
  .streak-ring-btn .log-btn .log-arc, .compact-ring-btn .log-btn .log-arc { position: absolute; inset: -1.5px; width: calc(100% + 3px); height: calc(100% + 3px); transform: rotate(-90deg); pointer-events: none; }
  .log-arc circle { fill: none; stroke: var(--c); stroke-width: 2.6; stroke-linecap: round; }
  .log-btn.sm { width: 30px; height: 30px; }
  .compact-ring-btn .log-btn.sm svg:not(.log-arc) { width: 13px; height: 13px; }
  .log-btn.sm b { font-size: 12px; }
  #page-streaks .st-dead .log-btn:not(.on) { border-color: rgba(255,255,255,.18); background: rgba(255,255,255,.04); color: rgba(255,255,255,.55); }
  .fx-pop { animation: fxPop .45s cubic-bezier(.34, 1.56, .64, 1); }
  @keyframes fxPop { 45% { transform: scale(1.18); } }

  /* Log yesterday: always the plain gray arrow; the grid shows whether yesterday is logged. */
  .compact-bot { display: flex; align-items: flex-end; gap: 7px; }
  .compact-bot .compact-week { flex: 1; min-width: 0; }
  .compact-yday-btn { width: 26px; height: 18px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-dim);
    display: flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; cursor: pointer; transition: all .15s; }
  /* centered under the log circle (whose tap area hangs past the chip edge) */
  .compact-yday-btn { margin-right: 4px; }
  .compact-yday-btn svg { width: 11px; height: 11px; }
  .compact-yday-btn:active { transform: scale(.92); }

  /* Log yesterday sheet (1–4 habits) */
  .yd-sub { font-size: 12.5px; color: var(--text-muted); margin: -10px 0 16px; }
  .yd-levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .yd-lvl { height: 64px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--c) 22%, var(--border)); background: var(--surface2); color: var(--text); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font: 800 20px 'Inter', sans-serif; font-variant-numeric: tabular-nums; transition: transform .1s; }
  .yd-lvl i { display: flex; gap: 2px; }
  .yd-lvl i s { width: 7px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); }
  .yd-lvl i s.f { background: var(--c); }
  .yd-lvl.on { background: color-mix(in srgb, var(--c) 22%, var(--surface2)); border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
  .yd-lvl:active { transform: scale(.95); }
  .yd-clear { color: #ff8585; }

  /* Cards / Compact switch */
  .view-seg { display: flex; gap: 2px; padding: 2px; background: var(--surface2); border: 1px solid var(--border-soft); border-radius: 10px; }
  .view-seg button { display: flex; align-items: center; gap: 5px; border: none; background: none; color: var(--text-dim); font: 600 11.5px 'Inter', sans-serif; padding: 5px 9px; border-radius: 8px; cursor: pointer; }
  .view-seg button svg { width: 12px; height: 12px; }
  .view-seg button.on { background: var(--surface3); color: var(--text); }

  @media (prefers-reduced-motion: reduce) {
    .fire-run, .fire-run::before, .fire-run .flow, .fire-run i, .fb, .fb::after, .fb svg, .fb-boom, .fx-pop, .fx-jolt, .fx-numpop, #page-streaks .streak-card, #page-streaks .compact-chip, .streak-card-main { animation: none !important; }
  }

  /* ══════════════════════════════════════════════════════
     CLEAR EFFECTS (Oct 2026)
     Checklist: a checked item smolders; Clear makes it combust.
     Bucket: a starred item twinkles; Finished sends shooting stars
     and lifts the items onto the Done shelf. Particles are drawn on
     #fx (see the FX block in the script).
     ══════════════════════════════════════════════════════ */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2050; }

  .lv-row.lv-smolder::before { content: ''; position: absolute; inset: 30% 0 0 0; pointer-events: none;
    background: linear-gradient(0deg, rgba(255,90,30,.14), rgba(255,90,30,0)); animation: fxSmolder 2.3s ease-in-out infinite; }
  .lv-row.lv-smolder .lv-txt { color: color-mix(in srgb, #ff8a4c 32%, var(--text-dim)); text-decoration-color: rgba(255,120,60,.5); }
  .lv-row.lv-smolder .lv-chk { animation: fxHotChk 1.9s ease-in-out infinite; }
  .lv-row.lv-smolder.lv-pop .lv-chk { animation: lvPop .35s cubic-bezier(.34,1.56,.64,1), fxHotChk 1.9s ease-in-out .35s infinite; }
  @keyframes fxSmolder { 0%, 100% { opacity: .45; } 35% { opacity: 1; } 62% { opacity: .62; } 80% { opacity: .9; } }
  @keyframes fxHotChk { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,140,50,0); } 50% { box-shadow: 0 0 11px 1px rgba(255,140,50,.55); } }

  .lv-row.lv-flare::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 23px 50%, rgba(255,175,70,.5), rgba(255,100,40,.12) 45%, transparent 70%);
    animation: fxFlare .6s ease-out forwards; }
  @keyframes fxFlare { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }

  .lv-row.lv-igniting::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(0deg, rgba(255,110,40,.38), rgba(255,110,40,.04)); }
  .lv-row.lv-igniting .lv-txt { color: #ffc27a; text-shadow: 0 0 9px rgba(255,140,50,.85); text-decoration-color: rgba(255,180,100,.8); }
  .lv-row.lv-igniting .lv-chk { box-shadow: 0 0 14px 3px rgba(255,150,60,.8); }
  .lv-row.lv-igniting > :not(.lv-blast) { animation: fxTremble .06s steps(2) infinite; }
  @keyframes fxTremble { from { transform: translate(.8px, -.5px); } to { transform: translate(-.8px, .6px); } }
  .lv-row.lv-boom { background: #1f1511; transition: background .25s; cursor: default; }
  .lv-row.lv-boom > :not(.lv-blast) { animation: fxBlowout .16s ease-out forwards; }
  @keyframes fxBlowout { to { transform: scale(1.08); opacity: 0; filter: brightness(2.2) blur(2px); } }
  .lv-blast { position: absolute; z-index: 2; inset: -16px -8px; pointer-events: none; mix-blend-mode: screen;
    background: radial-gradient(ellipse 58% 72% at 42% 50%, rgba(255,252,220,.97), rgba(255,175,65,.75) 32%, rgba(255,75,25,.32) 58%, rgba(255,60,20,0) 76%);
    animation: fxBlast .44s ease-out forwards; }
  @keyframes fxBlast { 0% { transform: scale(.3); opacity: 0; } 14% { opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
  .lv-group.lv-shake { animation: fxShake .24s ease-out; }
  @keyframes fxShake { 20% { transform: translate(2px,-1px); } 40% { transform: translate(-2px,1.5px); } 60% { transform: translate(1.5px,1px); } 80% { transform: translate(-1px,-.5px); } }

  .lv-row.lv-twinkle .lv-star svg { animation: fxGlint 2.6s ease-in-out infinite; }
  @keyframes fxGlint { 0%, 100% { filter: drop-shadow(0 0 0 rgba(160,200,255,0)); transform: none; } 50% { filter: drop-shadow(0 0 6px rgba(160,200,255,.85)); transform: scale(1.08) rotate(9deg); } }
  .lv-row.lv-rise > * { animation: fxRise .52s cubic-bezier(.3,.6,.2,1) forwards; }
  @keyframes fxRise { 0% { transform: none; opacity: 1; } 35% { transform: translateY(-2px); opacity: 1; filter: drop-shadow(0 0 9px rgba(170,205,255,.9)); } 100% { transform: translateY(-16px); opacity: 0; filter: drop-shadow(0 0 2px rgba(170,205,255,.3)); } }
  .lv-trophy.lv-new { animation: fxLand .55s cubic-bezier(.34,1.56,.64,1) both, fxLandGlow 1.4s ease-out both; }
  @keyframes fxLand { 0% { transform: scale(.55) translateY(10px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes fxLandGlow { 0%, 30% { box-shadow: 0 0 16px 2px rgba(150,195,255,.55); } 100% { box-shadow: 0 0 0 0 rgba(150,195,255,0); } }

  .lv-row.lv-gone { height: 0 !important; min-height: 0; padding-top: 0; padding-bottom: 0; opacity: 0; overflow: hidden; border-top-color: transparent; }
  .lv-clear-btn:disabled { opacity: .5; }

  @media (prefers-reduced-motion: reduce) {
    .lv-row::before, .lv-row::after, .lv-row .lv-chk, .lv-row .lv-star svg, .lv-row > *, .lv-trophy, .lv-group, .lv-blast { animation: none !important; }
  }

  /* ══════════════════════════════════════════════════════
     SHEETS (Oct 2026) — every popup shares this look.
     Accent comes from --c/--cd/--cl on the overlay (the list's or
     habit's color); the :root values below are the pink fallback.
     ══════════════════════════════════════════════════════ */
  :root { --c:#ff4d7e; --cd:#bf3a5f; --cl:#ff9db8; }
  .modal {
    max-height: 90dvh;
    overflow-y: auto;
    overscroll-behavior: contain;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 8%, var(--surface)), var(--surface) 160px);
    border-top: 1px solid color-mix(in srgb, var(--c) 30%, var(--border));
  }
  .modal-input:focus { border-color: var(--c); }
  input.modal-input { min-height: auto; }
  .btn-save {
    background: linear-gradient(135deg, var(--c), var(--cd));
    box-shadow: 0 2px 12px color-mix(in srgb, var(--c) 30%, transparent);
  }
  .btn-save.btn-danger { background: rgba(230,69,69,0.15); color: #ff8585; border: 1px solid rgba(230,69,69,0.3); box-shadow: none; }
  .action-sheet-btn svg { color: var(--text-muted); flex-shrink: 0; }
  .action-sheet-btn.danger svg { color: #ff8585; }
  .sheet-body { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin: -4px 0 18px; }
  .sheet-body b { color: var(--text); font-weight: 600; }

  .fs-eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--c); margin-top: 8px; }
  .fs-eyebrow + .modal-title { margin-top: 3px; }
  .fs-label { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); margin: 18px 0 8px; }
  .fs-hint { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 8px; }
  .fs-text { min-height: auto; font-size: 15px; line-height: 1.4; }
  .fs-link { background: none; border: none; color: var(--c); font: 600 13px 'Inter', sans-serif; padding: 16px 0 0; cursor: pointer; }
  @keyframes fsShake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .fs-shake { animation: fsShake .25s ease 2; border-color: #ff8585 !important; }

  /* either/or control — one look everywhere */
  .seg { display: flex; gap: 3px; padding: 3px; background: var(--surface2); border: 1px solid var(--border-soft); border-radius: 11px; }
  .seg-btn { flex: 1; min-width: 0; padding: 8px 4px; border: none; border-radius: 8px; background: none; color: var(--text-muted);
             font: 600 12.5px 'Inter', sans-serif; cursor: pointer; transition: background .2s, color .2s; white-space: nowrap; }
  .seg-btn.on { background: color-mix(in srgb, var(--c) 24%, var(--surface3)); color: #fff; }
  .seg-sm .seg-btn { padding: 5px 4px; font-size: 11.5px; }
  .seg-lg .seg-btn { padding: 12px 4px; font-size: 14px; }

  /* color swatches */
  .fs-swatches { display: grid; grid-template-columns: repeat(10, 1fr); gap: 7px; }
  .fs-swatch { aspect-ratio: 1; border-radius: 50%; border: none; padding: 0; cursor: pointer; transition: transform .15s; }
  .fs-swatch.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px #fff; transform: scale(1.06); }

  /* name field with live icon preview */
  .fs-name { display: flex; align-items: center; gap: 10px; }
  .fs-name .lv-ico { width: 46px; height: 46px; border-radius: 13px; }
  .fs-name .modal-input { flex: 1; min-width: 0; }

  /* icon picker */
  .fs-icons { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .fs-icon { aspect-ratio: 1; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border-soft); color: var(--text-muted);
             display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background .15s, color .15s, border-color .15s; }
  .fs-icon svg { width: 17px; height: 17px; }
  .fs-icon span { font-size: 17px; line-height: 1; }
  .fs-icon.on { background: color-mix(in srgb, var(--c) 22%, var(--surface2)); border-color: var(--c); color: var(--cl); }
  .fs-emoji-in { margin-top: 8px; padding: 10px 14px; text-align: center; font-size: 18px; }

  /* due date: indented under the item text, quieter than the item itself */
  .fs-due { margin: 8px 0 0 14px; padding-left: 12px; border-left: 2px solid var(--border-soft); }
  .fs-due.on { border-left-color: color-mix(in srgb, var(--c) 45%, var(--border-soft)); }
  .fs-due-row { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: none; color: var(--text-muted);
                font: 500 13px 'Inter', sans-serif; padding: 6px 0; cursor: pointer; text-align: left; }
  .fs-due.on .fs-due-row { color: var(--text); }
  .fs-check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--text-dim); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; }
  .fs-check svg { width: 10px; height: 10px; opacity: 0; }
  .fs-due.on .fs-check { background: var(--c); border-color: var(--c); }
  .fs-due.on .fs-check svg { opacity: 1; }
  .fs-due-sum { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--c); white-space: nowrap; }
  .fs-due-sum.late { color: #f59e0b; }
  .fs-pills { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 0 2px; }
  .fs-pill { position: relative; overflow: hidden; padding: 5px 10px; border-radius: 99px; border: 1px solid var(--border); background: var(--surface2);
             color: var(--text-muted); font: 500 11.5px 'Inter', sans-serif; cursor: pointer; white-space: nowrap; }
  .fs-pill.on { background: var(--c); border-color: var(--c); color: #fff; }
  .fs-pill input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }

  /* habit form */
  .fs-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  .fs-day { aspect-ratio: 1; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text-muted);
            font: 600 13px 'Inter', sans-serif; cursor: pointer; padding: 0; transition: all .15s; }
  .fs-day.on { background: var(--c); border-color: var(--c); color: #fff; }
  .fs-stepper { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 12px; }
  .fs-stepper button { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--surface2); color: var(--text);
                       font-size: 20px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .fs-stepper div { text-align: center; min-width: 92px; }
  .fs-stepper b { display: block; font-size: 26px; font-weight: 800; line-height: 1; color: var(--c); }
  .fs-stepper span { font-size: 11px; color: var(--text-muted); }

  /* month calendar */
  .mc-toggle { margin-bottom: 12px; }
  .mc-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .mc-dow { font-size: 9.5px; font-weight: 700; color: var(--text-dim); text-align: center; padding-bottom: 1px; }
  .mc-cell { position: relative; aspect-ratio: 1; border-radius: 9px; background: rgba(0,0,0,.3); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); border: none; padding: 0;
             display: flex; align-items: center; justify-content: center; font: 600 11.5px 'Inter', sans-serif; color: var(--text-muted);
             font-variant-numeric: tabular-nums; }
  .mc-pad { background: none; box-shadow: none; }
  .mc-cell.on { color: #fff; box-shadow: none; }
  .mc-cell.future { opacity: .3; }
  .mc-cell.before { background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); color: var(--text-dim); }
  .mc-cell.req { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--c) 60%, transparent); }
  .mc-cell.today { outline: 2px solid rgba(255,255,255,.6); outline-offset: 1px; }
  .mc-mk { line-height: 1; display: flex; align-items: center; justify-content: center; }
  .mc-mk svg { width: 13px; height: 13px; filter: drop-shadow(0 0 1.2px rgba(0,0,0,.9)); }
  .mc-mk .mk-emoji { font-size: 13px; }
  .mc-foot { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 9px; }
  .mcal-view .mc-grid { gap: 4px; }
  .mcal-view .mc-cell { aspect-ratio: auto; height: 28px; border-radius: 8px; font-size: 11px; }
  .mcal-edit .mc-cell { font-size: 13px; border-radius: 11px; cursor: pointer; transition: transform .1s; }
  .mcal-edit .mc-cell:active { transform: scale(.9); }
  .mcal-edit .mc-mk svg { width: 18px; height: 18px; }
  .mcal-edit .mc-mk .mk-emoji { font-size: 18px; }

</style>
