   Each section has: id, name, items[], type (controls behavior)
   type: 'goals' (no checkbox, no due date) | 'tasks' (checkbox + optional due date)
   ───────────────────────────────────────────────────── */

const STORAGE_KEY = 'streaks_v2_data';

const defaultData = {
  goals: {
    sections: [
      { id: 's_lt', name: 'Long-term goals', type: 'goals', items: [] },
      { id: 's_st', name: 'Short-term goals', type: 'tasks', items: [] }
    ]
  },
  checklist: {
    sections: [
      { id: 's_td', name: 'To-do', type: 'tasks', items: [] },
      { id: 's_tdl', name: 'To-do later', type: 'tasks', items: [] }
    ]
  },
  bucket: {
    sections: [
      { id: 's_bk', name: 'Bucket list', type: 'tasks', items: [] }
    ]
  },
  streaks: {
    habits: []  // {id, name, history: ['YYYY-MM-DD', ...], created}
  },
  streaky: { lastGreeted: null, lastWeekly: null, bags: {}, lastChecklistNudge: null },
  prefs: { compactMode: false }   // remembered UI choices
};

function loadData() { return lvMigrate(loadDataRaw()); }
function loadDataRaw() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      // Try to migrate from old "goalsData"
      const old = localStorage.getItem('goalsData');
      if (old) {
        const oldData = JSON.parse(old);
        const migrated = JSON.parse(JSON.stringify(defaultData));
        if (oldData.longterm) migrated.goals.sections[0].items = oldData.longterm.map(i => ({ id: uid(), text: i.text, checked: !!i.checked }));
        if (oldData.shortterm) migrated.goals.sections[1].items = oldData.shortterm.map(i => ({ id: uid(), text: i.text, checked: !!i.checked }));
        if (oldData.checklist) migrated.checklist.sections[0].items = oldData.checklist.map(i => ({ id: uid(), text: i.text, checked: !!i.checked }));
        if (oldData.later) migrated.checklist.sections[1].items = oldData.later.map(i => ({ id: uid(), text: i.text, checked: !!i.checked, deadline: i.deadline }));
        if (oldData.bucket) migrated.bucket.sections[0].items = oldData.bucket.map(i => ({ id: uid(), text: i.text, checked: !!i.checked }));
        return migrated;
      }
      return JSON.parse(JSON.stringify(defaultData));
    }
    const parsed = JSON.parse(raw);
    // Ensure shape
    // Migrate old type names
    const migrateSections = (tab) => {
      if (!tab || !tab.sections) return tab;
      tab.sections = tab.sections.map(s => ({
        ...s,
        type: s.type === 'longterm' ? 'goals'
            : (s.type === 'standard' || s.type === 'deadline') ? 'tasks'
            : s.type // preserves 'folder', 'goals', 'tasks' as-is
      }));
      return tab;
    };
    return {
      goals: migrateSections(parsed.goals) || JSON.parse(JSON.stringify(defaultData.goals)),
      checklist: migrateSections(parsed.checklist) || JSON.parse(JSON.stringify(defaultData.checklist)),
      bucket: migrateSections(parsed.bucket) || JSON.parse(JSON.stringify(defaultData.bucket)),
      streaks: parsed.streaks || { habits: [] },
      streaky: parsed.streaky || { lastGreeted: null, lastWeekly: null, bags: {}, lastChecklistNudge: null },
      prefs: parsed.prefs || { compactMode: false }
    };
  } catch {
    return JSON.parse(JSON.stringify(defaultData));
  }
}

function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function uid() { return 'i_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let data = loadData();
let currentTab = 'streaks';

/* ─────────────────────────────────────────────────────
   DATE HELPERS
   ───────────────────────────────────────────────────── */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(d, n) {
  const x = new Date(d);
  x.setDate(x.getDate()+n);
  return x;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateDate() {
  document.getElementById('dateLabel').textContent =
    new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

/* ─────────────────────────────────────────────────────
   TAB SWITCHING + SWIPE
   ───────────────────────────────────────────────────── */
const tabOrder = ['streaks', 'goals', 'checklist', 'bucket'];

function switchTab(tab, fromSwipe = false) {
  if (tab === currentTab) { if (lvOpen) lvBack(); else if (habitPageId) closeHabitPage(); return; }
  lvOpen = null;
  habitPageId = null;
  lvGoalsEditing = false;
  if (tab === 'streaks') streaksEnter = true;
  const fromIdx = tabOrder.indexOf(currentTab);
  const toIdx = tabOrder.indexOf(tab);
  const dir = toIdx > fromIdx ? 1 : -1;

  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  document.querySelectorAll('.page').forEach(el => {
    if (el.dataset.tab === tab) {
      el.style.setProperty('--swipe-from', dir > 0 ? '24px' : '-24px');
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
  currentTab = tab;
  render({ jumpToTop: true });
  // Scroll to top on tab change
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Swipe gesture
(function setupSwipe(){
  let startX = 0, startY = 0, tracking = false, swipeLocked = false;

  document.addEventListener('touchstart', e => {
    // Don't track if a modal is open
    if (document.querySelector('.modal-overlay.open')) { tracking = false; return; }
    if (e.target.closest && e.target.closest('.lv-shelf, .mcal')) { tracking = false; return; }
    lvDragged = false;
    if (e.touches.length !== 1) { tracking = false; return; }
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    swipeLocked = false;
    tracking = true;
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!tracking || swipeLocked) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    // If vertical movement dominates early, lock out swipe so scroll works normally
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8) {
      swipeLocked = true;
    }
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!tracking || swipeLocked) { tracking = false; return; }
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    if (lvDragged) { tracking = false; return; }
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.8) {
      if (lvOpen || habitPageId) { if (dx > 0) { if (lvOpen) lvBack(); else closeHabitPage(); } tracking = false; return; }
      const idx = tabOrder.indexOf(currentTab);
      if (dx < 0 && idx < tabOrder.length - 1) switchTab(tabOrder[idx+1], true);
      else if (dx > 0 && idx > 0) switchTab(tabOrder[idx-1], true);
    }
    tracking = false;
  }, { passive: true });
})();

/* ─────────────────────────────────────────────────────
   RENDER
   ───────────────────────────────────────────────────── */

/* ══════════════════════════════════════════════════════════
   LISTS v2 — Goals / Checklist / Bucket
   Data shape is unchanged from v4: each tab has sections[], where a
   top-level entry is either a plain section {type:'tasks'|'goals', items}
   or a folder {type:'folder', sections:[...]}. In the UI every top-level
   entry is a "list" (a tile). New fields, all optional:
     entry.color / entry.icon      — list color + icon (plain lists too)
     tab.pinned                    — id of the list shown at the top (null = none)
     bucket item.doneOn            — date it was starred
     bucket item.shelved           — cleared onto the Done shelf
   ══════════════════════════════════════════════════════════ */
let lvOpen = null;            // { tab, id } — list drilled into
let lvHomeScroll = 0;
let lvGoalsEditing = false;
let lvSheetBtns = [];
let lvUndoFn = null, lvToastTimer = null;
let lvPopId = null;
let lvAnim = null;            // 'in' | 'back' — one-shot page animation

const LV_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const LV_STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
const LV_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
const LV_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
const LV_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LV_WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const LV_TITLE = { goals:'Goals', checklist:'Checklist', bucket:'Bucket' };

/* Fills in list colors/icons and the default pinned list. Safe to run on
   any data, any number of times. Declared as a function (hoisted) and uses
   only literals because loadData() runs before the consts below exist. */
function lvMigrate(d) {
  const cyc = {
    goals:     ['orange','purple','teal','blue','pink','green'],
    checklist: ['yellow','orange','teal','indigo','pink','blue'],
    bucket:    ['blue','teal','purple','pink','green','orange']
  };
  ['goals','checklist','bucket'].forEach(t => {
    const tab = d && d[t];
    if (!tab || !Array.isArray(tab.sections)) return;
    let n = 0;
    tab.sections.forEach(s => {
      if (t === 'goals') { if (!s.color) s.color = cyc.goals[n % 6]; if (!Array.isArray(s.items)) s.items = []; n++; return; }
      if (s.type === 'folder') {
        if (!s.color) s.color = 'coral';
        if (!s.icon) s.icon = 'folder';
        if (!Array.isArray(s.sections)) s.sections = [];
        s.sections.forEach(x => { if (!Array.isArray(x.items)) x.items = []; x.type = 'tasks'; });
        return;
      }
      if (!Array.isArray(s.items)) s.items = [];
      s.type = 'tasks';   // every Checklist and Bucket item has a checkbox (Oct 2026)
      if (!s.color) s.color = cyc[t][n % 6];
      if (!s.icon) s.icon = 'list';
      n++;
    });
    if (t !== 'goals' && !('pinned' in tab)) {
      const first = tab.sections.find(s => s.type !== 'folder');
      tab.pinned = first ? first.id : null;
    }
  });
  return d;
}

/* ── lookups ─────────────────────────────────────────── */
function lvEntry(tab, id) { return (data[tab].sections || []).find(s => s.id === id) || null; }
function lvSecs(e) { return e.type === 'folder' ? (e.sections || []) : [e]; }
function lvFind(tab, secId) {
  for (const e of data[tab].sections) {
    if (e.type === 'folder') { const s = (e.sections || []).find(x => x.id === secId); if (s) return { entry: e, sec: s }; }
    else if (e.id === secId) return { entry: e, sec: e };
  }
  return null;
}
function lvFindItem(tab, itemId) {
  for (const e of data[tab].sections) for (const s of lvSecs(e)) {
    const it = (s.items || []).find(i => i.id === itemId);
    if (it) return { entry: e, sec: s, item: it };
  }
  return null;
}
function lvPinned(tab) { const id = data[tab].pinned; return id ? lvEntry(tab, id) : null; }

/* ── color + icon ────────────────────────────────────── */
function lvMix(hex, amt) { // blend toward white
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.round(((n >> s) & 255) + (255 - ((n >> s) & 255)) * amt);
  return `#${((ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).padStart(6, '0')}`;
}
function lvVars(e) { const c = folderColor(e); return `--c:${c};--cd:${darkenHex(c, 25)};--cl:${lvMix(c, .45)}`; }
function lvIcon(e, px) {
  if (e.icon && e.icon.startsWith('emoji:')) return `<span style="font-size:${Math.round(px * .55)}px">${escHtml(e.icon.slice(6))}</span>`;
  const sz = Math.round(px * .5);
  return (LIST_ICONS[e.icon || 'folder'] || LIST_ICONS.list).replace('<svg ', `<svg width="${sz}" height="${sz}" `);
}

/* ── dates ───────────────────────────────────────────── */
function lvParse(ds) { const [y, m, d] = ds.split('-').map(Number); return new Date(y, m - 1, d); }
function lvDayDiff(ds) { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((lvParse(ds) - t) / 86400000); }
// One wording for overdue everywhere: list rows, the edit sheet and Streaky.
function lvLate(n) { return `${n} day${n === 1 ? '' : 's'} late`; }
function lvDue(ds) {
  const d = lvDayDiff(ds), dt = lvParse(ds);
  if (d < 0) return { cls: 'late', t: lvLate(-d) };
  if (d === 0) return { cls: 'soon', t: 'Today' };
  if (d === 1) return { cls: 'soon', t: 'Tomorrow' };
  if (d <= 6) return { cls: '', t: LV_WD[dt.getDay()] };
  return { cls: '', t: `${LV_MON[dt.getMonth()]} ${dt.getDate()}` };
}
const lvIsDueSoon = (sec, it) => sec.type !== 'goals' && it.deadline && !it.shelved && lvDayDiff(it.deadline) <= 7;

/* ── counts ──────────────────────────────────────────── */
function lvCounts(tab, e) {
  let left = 0, done = 0, due = 0, notes = 0;
  lvSecs(e).forEach(s => (s.items || []).forEach(it => {
    if (s.type === 'goals') { notes++; return; }
    if (it.checked) done++; else left++;
    if (!it.checked && lvIsDueSoon(s, it)) due++;
  }));
  return { left, done, due, notes };
}
function lvMeta(tab, e) {
  const c = lvCounts(tab, e);
  if (tab === 'bucket') return `${c.left} to go${c.done ? ` · ${c.done} done` : ''}`;
  if (!c.left && !c.done && c.notes) return `${c.notes} item${c.notes === 1 ? '' : 's'}`;
  return c.left ? `${c.left} to do` : (c.done ? 'All clear' : 'Empty');
}

/* ══ RENDER ════════════════════════════════════════════ */
function renderGoalTab(tab) {
  const page = document.getElementById('page-' + tab);
  if (!page) return;
  if (tab === 'goals') page.innerHTML = lvGoalsHtml();
  else {
    const e = lvOpen && lvOpen.tab === tab ? lvEntry(tab, lvOpen.id) : null;
    if (lvOpen && !e) lvOpen = null;
    page.innerHTML = e ? lvDetailHtml(tab, e) : lvHomeHtml(tab);
  }
  page.classList.remove('lv-page-in', 'lv-page-back');
  if (lvAnim) { void page.offsetWidth; page.classList.add(lvAnim === 'in' ? 'lv-page-in' : 'lv-page-back'); lvAnim = null; }
  lvPopId = null;
  lvAttachDrags(page, tab);
  fxAfterRender(page);
}

function lvRowHtml(tab, e, sec, it, opts = {}) {
  const bucket = tab === 'bucket', checkable = sec.type !== 'goals';
  const due = checkable && !bucket && it.deadline && !it.checked ? lvDue(it.deadline) : null;
  const state = !checkable ? 'lv-nocheck' : it.checked ? (bucket ? 'lv-starred lv-twinkle' : 'lv-done lv-smolder') : '';
  const mark = !checkable ? '' : bucket ? `<span class="lv-star">${LV_STAR}</span>` : `<span class="lv-chk">${LV_CHECK}</span>`;
  return `<div class="lv-row ${state} ${lvPopId === it.id ? 'lv-pop' : ''}" style="${lvVars(e)}" data-lvid="${it.id}"${opts.nodrag ? '' : ' data-drag="1"'}${checkable ? ` onclick="lvToggle('${tab}','${it.id}')"` : ''}>
    ${mark}<div class="lv-txt">${escHtml(it.text)}${opts.tag ? `<div class="lv-tag"><i></i>${escHtml(e.name)}</div>` : ''}</div>
    ${due ? `<div class="lv-due ${due.cls}">${due.t}</div>` : ''}
    <button class="lv-dots" onclick="event.stopPropagation();lvItemMenu('${tab}','${it.id}')" aria-label="Item options">⋮</button></div>`;
}

function lvAddRowHtml(tab, e, sec) {
  const label = tab === 'goals' ? 'Add goal' : tab === 'bucket' ? 'Add to the list' : 'Add item';
  return `<div class="lv-add" style="${lvVars(e)}" data-tab="${tab}" data-sec="${sec.id}" onclick="lvOpenAdd(this)"><span class="lv-plus">＋</span><span>${label}</span></div>`;
}

function lvSectionHtml(tab, e, sec, showHead) {
  const bucket = tab === 'bucket', checkable = sec.type !== 'goals';
  const items = (sec.items || []).filter(i => !i.shelved);
  const left = items.filter(i => !i.checked).length;
  const marked = checkable ? items.filter(i => i.checked).length : 0;
  let h = `<div class="lv-sec" data-lvid="${sec.id}" style="${lvVars(e)}">`;
  if (showHead) {
    const meta = checkable ? (left ? `${left} ${bucket ? 'to go' : 'left'}` : (items.length ? 'All clear' : '')) : `${items.length} item${items.length === 1 ? '' : 's'}`;
    h += `<div class="lv-sub"><span class="lv-sub-name">${escHtml(sec.name)}</span><em>${meta}</em>
      <button class="lv-dots lv-sec-dots" onclick="lvSectionMenu('${tab}','${e.id}','${sec.id}')" aria-label="Section options">⋮</button></div>`;
  }
  h += `<div class="lv-group" data-sec="${sec.id}">` + items.map(it => lvRowHtml(tab, e, sec, it)).join('') + lvAddRowHtml(tab, e, sec);
  if (marked) h += `<div class="lv-clear-row"><span>${marked} ${bucket ? 'starred' : 'done'}</span><button class="lv-clear-btn" onclick="lvClear('${tab}','${sec.id}')">${bucket ? 'Finished' : 'Clear'}</button></div>`;
  return h + `</div></div>`;
}

function lvListBody(tab, e) {
  const secs = lvSecs(e);
  if (e.type === 'folder' && !secs.length) return `<div class="lv-group"><div class="lv-empty">No sections yet.</div></div>`;
  return secs.map(s => lvSectionHtml(tab, e, s, e.type === 'folder')).join('');
}

function lvHomeHtml(tab) {
  const pinned = lvPinned(tab);
  let h = '';
  if (tab === 'checklist') {
    const rows = [];
    data.checklist.sections.forEach(e => {
      if (e === pinned) return;
      lvSecs(e).forEach(s => (s.items || []).forEach(it => { if (lvIsDueSoon(s, it)) rows.push({ e, s, it }); }));
    });
    rows.sort((a, b) => a.it.deadline.localeCompare(b.it.deadline));
    if (rows.length) h += `<div class="lv-block"><div class="lv-eyebrow">Due soon<em>from your other lists</em></div><div class="lv-group">${rows.map(r => lvRowHtml(tab, r.e, r.s, r.it, { tag: true, nodrag: true })).join('')}</div></div>`;
  } else {
    const shelf = [];
    data.bucket.sections.forEach(e => lvSecs(e).forEach(s => (s.items || []).forEach(it => { if (it.shelved) shelf.push({ e, it }); })));
    shelf.sort((a, b) => (b.it.doneOn || '').localeCompare(a.it.doneOn || ''));
    h += `<div class="lv-block lv-shelf-block"><div class="lv-eyebrow">Done so far<em>${shelf.length ? `${shelf.length} and counting` : ''}</em></div>`;
    h += shelf.length
      ? `<div class="lv-shelf">${shelf.map(({ e, it }) => {
          const when = it.doneOn ? `${LV_MON[lvParse(it.doneOn).getMonth()]} ${lvParse(it.doneOn).getFullYear()}` : '';
          return `<div class="lv-trophy${lvFreshShelf && lvFreshShelf.has(it.id) ? ' lv-new' : ''}" style="${lvVars(e)}" onclick="lvShelfMenu('${it.id}')">${LV_STAR}<div style="min-width:0"><div class="lv-tr-txt">${escHtml(it.text)}</div>${when ? `<div class="lv-tr-when">${when}</div>` : ''}</div></div>`;
        }).join('')}</div>`
      : `<div class="lv-shelf-empty">Star something and press Finished to start your shelf.</div>`;
    h += `</div>`;
  }
  if (pinned) {
    h += `<div class="lv-block lv-pinned" style="${lvVars(pinned)}">
      <div class="lv-pin-head"><div class="lv-ico">${lvIcon(pinned, 28)}</div><div class="lv-pin-name">${escHtml(pinned.name)}</div><span class="lv-pin-chip">Pinned</span><div class="lv-grow"></div>
        <button class="lv-more" onclick="lvListMenu('${tab}','${pinned.id}')" aria-label="List options">⋯</button></div>
      ${lvListBody(tab, pinned)}</div>`;
  }
  const rest = data[tab].sections.filter(e => e !== pinned);
  h += `<div class="lv-eyebrow">${tab === 'checklist' ? 'Lists' : 'Collections'}</div><div class="lv-tiles">`;
  h += rest.map(e => {
    const c = lvCounts(tab, e);
    return `<div class="lv-tile" style="${lvVars(e)}" data-lvid="${e.id}" onclick="lvOpenList('${tab}','${e.id}')">
      <div class="lv-t-top"><div class="lv-ico">${lvIcon(e, 34)}</div>${tab === 'checklist' && c.due ? `<span class="lv-pill">${c.due} due</span>` : ''}</div>
      <div class="lv-t-name">${escHtml(e.name)}</div><div class="lv-t-meta">${lvMeta(tab, e)}</div></div>`;
  }).join('');
  h += `<div class="lv-tile lv-new" onclick="lvNewList('${tab}')">＋ New list</div></div>`;
  return h;
}

function lvDetailHtml(tab, e) {
  return `<div class="lv-d-bar" style="${lvVars(e)}"><button class="lv-back" onclick="lvBack()">${LV_BACK}${LV_TITLE[tab]}</button>
      <button class="lv-more" onclick="lvListMenu('${tab}','${e.id}')" aria-label="List options">⋯</button></div>
    <div class="lv-d-title" style="${lvVars(e)}"><div class="lv-ico">${lvIcon(e, 42)}</div><div style="min-width:0"><h2>${escHtml(e.name)}</h2><p>${lvMeta(tab, e)}</p></div></div>
    ${lvListBody(tab, e)}
    <button class="lv-new-sec" onclick="lvNewSection('${tab}','${e.id}')">＋ New section</button>`;
}

function lvGoalsHtml() {
  const ed = lvGoalsEditing, secs = data.goals.sections;
  let h = `<div class="lv-goals ${ed ? 'editing' : ''}"><div class="lv-edit-bar"><button class="lv-edit-btn" onclick="lvToggleGoalsEdit()">${ed ? 'Done' : 'Edit'}</button></div>`;
  if (!secs.length && !ed) h += `<div class="lv-goals-empty">Tap <b>Edit</b> to add your first section.</div>`;
  secs.forEach(s => {

/* Called from moveDrag for ctx.type === 'lv' */
function lvMoveDrag(cx, cy, ctx) {
  const src = dragState.sourceEl, parent = src.parentElement;
  const sibs = Array.from(parent.querySelectorAll(`:scope > ${ctx.sel}:not(.drag-source)`));
  sibs.forEach(s => s.classList.remove('drag-shift-up', 'drag-shift-down', 'lv-drop-target'));
  dragInsertLineEl.style.display = 'none';
  dragState.insertBefore = null;
  if (ctx.grid) {
    // Live reorder: the placeholder moves through the grid under your finger,
    // so the layout itself shows where the list will land.
    parent.classList.add('lv-dragging');
    const hit = sibs.find(s => { const r = s.getBoundingClientRect(); return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom; });
    if (hit) {
      const r = hit.getBoundingClientRect();
      const ref = cx > r.left + r.width / 2 ? hit.nextSibling : hit;
      if (ref !== src) parent.insertBefore(src, ref);
    }
    dragState.insertBefore = { target: src, pos: 'dom' };
    return;
  }
  let target = null, pos = 'before';
  for (const s of sibs) {
    const r = s.getBoundingClientRect();
    if (ctx.grid) {
      if (cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom) { target = s; pos = cx < r.left + r.width / 2 ? 'before' : 'after'; break; }
    } else if (cy >= r.top - 10 && cy <= r.bottom + 10) { target = s; pos = cy < r.top + r.height / 2 ? 'before' : 'after'; break; }
  }
  if (!target) return;
  if (ctx.grid) target.classList.add('lv-drop-target');
  else {
    const r = target.getBoundingClientRect();
    target.classList.add(pos === 'before' ? 'drag-shift-down' : 'drag-shift-up');
    dragInsertLineEl.style.display = 'block';
    dragInsertLineEl.style.position = 'fixed';
    dragInsertLineEl.style.left = (r.left + 8) + 'px';
    dragInsertLineEl.style.width = (r.width - 16) + 'px';
    dragInsertLineEl.style.top = (pos === 'before' ? r.top - 3 : r.bottom + 1) + 'px';
  }
  dragState.insertBefore = { target, pos };
}
/* Called from applyReorder for ctx.type === 'lv' */
function lvApplyReorder(ctx, insertBefore) {
  const arr = ctx.arr();
  if (ctx.grid) {
    const parent = dragState.sourceEl.parentElement;
    parent.classList.remove('lv-dragging');
    const order = Array.from(parent.querySelectorAll(':scope > [data-lvid]')).map(el => el.dataset.lvid);
    dragState = null;
    if (arr) {
      // Tiles don't include the pinned list: rebuild the order and put it back where it was.
      const pinned = arr.find(x => !order.includes(x.id));
      const pinIdx = pinned ? arr.indexOf(pinned) : -1;
      const next = order.map(id => arr.find(x => x.id === id)).filter(Boolean);
      if (pinned) next.splice(Math.min(pinIdx, next.length), 0, pinned);
      if (next.length === arr.length) { arr.splice(0, arr.length, ...next); saveData(data); }
    }
    render();
    return;
  }
  const fromId = dragState.sourceEl.dataset.lvid, toId = insertBefore.target.dataset.lvid;
  document.querySelectorAll('.lv-drop-target').forEach(el => el.classList.remove('lv-drop-target'));
  document.querySelectorAll('.lv-dragging').forEach(el => el.classList.remove('lv-dragging'));
  dragState = null;
  if (!arr) { render(); return; }
  const from = arr.findIndex(x => x.id === fromId);
  if (from < 0 || fromId === toId) { render(); return; }
  const [moved] = arr.splice(from, 1);
  let to = arr.findIndex(x => x.id === toId);
  if (to < 0) { arr.splice(from, 0, moved); render(); return; }
  if (insertBefore.pos === 'after') to++;
  arr.splice(to, 0, moved);
  saveData(data);
  render();
}

/* ══ FX — particles for the clear effects (Oct 2026) ═══════
   One fixed canvas (#fx) above everything, Streaky included. The loop
   runs only while there are particles, or while a checked/starred row
   is on screen (those give off a few embers or sparkles). It skips that
   ambient effect while a sheet or Streaky is open. Reduce Motion turns
   all of it off: rows just fade.
   Note on the loop: rAF's timestamp can be a hair earlier than the
   performance.now() taken in fxKick(). That used to make dt negative,
   which made a radius negative, which threw and killed the loop for good.
   dt is clamped and the frame is wrapped in try/catch for that reason. */
const fxCanvas = document.createElement('canvas');
fxCanvas.id = 'fx';
fxCanvas.setAttribute('aria-hidden', 'true');
document.body.appendChild(fxCanvas);
const fxCtx = fxCanvas.getContext('2d');

let fxW = 0, fxH = 0, fxRunning = false, fxLast = 0;

const fxReduced = () => !!(fxMotionQuery && fxMotionQuery.matches);
const fxRand = (a, b) => a + Math.random() * (b - a);

function fxSize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fxW = window.innerWidth; fxH = window.innerHeight;
  fxCanvas.width = fxW * dpr; fxCanvas.height = fxH * dpr;
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
fxSize();
window.addEventListener('resize', fxSize);
document.addEventListener('visibilitychange', () => fxKick());

const FX_HEAT = [[0, [110, 28, 16]], [.4, [255, 96, 40]], [.7, [255, 184, 64]], [1, [255, 245, 195]]];
function fxHeat(h, stops) {
  const st = stops || FX_HEAT;
  for (let i = 1; i < st.length; i++) {
    if (h <= st[i][0]) {
      const [a, ca] = st[i - 1], [b, cb] = st[i], k = (h - a) / (b - a);
      return ca.map((v, j) => Math.round(v + (cb[j] - v) * k)).join(',');
    }
  }
  return st[st.length - 1][1].join(',');
}
/* Ember colors for a habit: dark → habit color → light → white-hot. */
const fxStopsCache = new Map();
function fxStops(hex) {
  hex = (hex || '').trim();
  if (!/^#[0-9a-f]{6}$/i.test(hex)) return FX_HEAT;
  if (!fxStopsCache.has(hex)) {
    const n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    fxStopsCache.set(hex, [[0, c.map(v => v * .35)], [.45, c], [.78, c.map(v => v + (255 - v) * .5)], [1, [255, 252, 240]]]);

}
const fxStopsOf = el => fxStops(getComputedStyle(el).getPropertyValue('--c'));

function fxEmber(x, y, o) {
  fxParts.push(Object.assign({ t: 'ember', x, y, vx: fxRand(-25, 25), vy: fxRand(-95, -30), g: -18, drag: .985, life: 0, max: fxRand(.5, 1.05), s: fxRand(.9, 2), h0: fxRand(.8, 1) }, o || {}));
}
function fxCrumb(x, y) {   // what's left behind: slower, cooler, falling
  fxParts.push({ t: 'ember', x, y, vx: fxRand(-12, 12), vy: fxRand(-18, 6), g: 46, drag: .99, life: 0, max: fxRand(.9, 1.5), s: fxRand(.8, 1.5), h0: fxRand(.45, .7) });
}
function fxFlame(x, y, stops) {
  fxParts.push({ t: 'flame', x, y, stops, vx: fxRand(-45, 45), vy: fxRand(-160, -50), g: -40, drag: .96, life: 0, max: fxRand(.35, .6), s: fxRand(10, 19) });
}
function fxSmoke(x, y, o) {
  fxParts.push(Object.assign({ t: 'smoke', x, y, vx: fxRand(-22, 22), vy: fxRand(-34, -10), g: 0, drag: .98, life: 0, max: fxRand(.9, 1.3), s: fxRand(11, 20), col: '58,52,56', a: .3 }, o || {}));
}
function fxAsh(x, y) {
  fxParts.push({ t: 'ash', x, y, vx: fxRand(-10, 10), vy: fxRand(4, 26), g: 38, drag: .99, life: 0, max: fxRand(.6, 1.1), s: fxRand(.9, 1.7) });
}
function fxSpark(x, y, o) {
  fxParts.push(Object.assign({ t: 'spark', x, y, vx: 0, vy: 0, g: 0, drag: .94, life: 0, max: fxRand(.45, .75), s: fxRand(3, 5.5), rot: fxRand(0, .8), col: '220,234,255' }, o || {}));
}
function fxShootingStar() {
  const ang = fxRand(17, 30) * Math.PI / 180, sp = fxRand(980, 1260);
  fxParts.push({ t: 'shoot', x: fxRand(-90, fxW * .35), y: fxRand(fxH * .06, fxH * .42), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: 0, drag: 1, life: 0, max: fxRand(.8, .98), trail: [] });

function fxTick(dt) {
  for (let i = fxParts.length - 1; i >= 0; i--) {
    const p = fxParts[i];
    p.life += dt;
    if (p.life >= p.max) { fxParts.splice(i, 1); continue; }
    if (p.t === 'shoot') {
      p.trail.push([p.x, p.y]);
      if (p.trail.length > 14) p.trail.shift();
      if (Math.random() < .45) fxSpark(p.x - p.vx * .02, p.y - p.vy * .02, { s: fxRand(1.5, 2.6), max: fxRand(.3, .55), vx: fxRand(-15, 15), vy: fxRand(10, 40) });
    }
    const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy = p.vy * d + p.g * dt;

function fxCirc(x, y, r) { fxCtx.beginPath(); fxCtx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); fxCtx.fill(); }

}
function fxDraw() {

    const k = p.life / p.max;

      g.addColorStop(.45, p.stops ? `rgba(${fxHeat(.45, p.stops)},${a * .45})` : `rgba(255,100,35,${a * .45})`);
      g.addColorStop(1, p.stops ? `rgba(${fxHeat(.3, p.stops)},0)` : 'rgba(255,60,20,0)');

function fxQuiet() {   // nothing ambient while something covers the lists
  return fxReduced() || document.hidden || streakyOpen || !!document.querySelector('.modal-overlay.open');
}
function fxAmbient(dt) {
  if (fxQuiet()) return;
  document.querySelectorAll('.page.active .lv-row.lv-smolder').forEach(el => {
    if (Math.random() > dt * 1.8) return;
    const r = el.getBoundingClientRect();
    if (!r.width || r.bottom < 0 || r.top > fxH) return;
    fxEmber(r.left + fxRand(14, r.width * .8), r.bottom - fxRand(3, 12), { vx: fxRand(-8, 8), vy: fxRand(-40, -14), g: -6, max: fxRand(.6, 1.2), s: fxRand(.7, 1.3), h0: fxRand(.65, .9) });
  });
  document.querySelectorAll('.page.active .lv-row.lv-twinkle .lv-star').forEach(st => {
    if (Math.random() > dt * 1.1) return;
    const r = st.getBoundingClientRect();
    if (!r.width || r.bottom < 0 || r.top > fxH) return;
    fxSpark(r.left + r.width / 2 + fxRand(-16, 16), r.top + r.height / 2 + fxRand(-12, 12), { s: fxRand(2.4, 3.8), max: fxRand(.5, .8) });
  });

  document.querySelectorAll('.page.active .fr-outline').forEach(run => {
    const r = run.getBoundingClientRect();
    if (!r.width || r.bottom < 0 || r.top > fxH) return;
    const hot = run.classList.contains('fr-blaze');
    if (Math.random() > dt * (hot ? .5 : .12) * Math.max(1, r.width / 40)) return;
    fxEmber(r.left + fxRand(2, r.width - 2), r.top + 1, { stops: fxStopsOf(run), vx: fxRand(-8, 8), vy: fxRand(-45, -15), g: -6, max: fxRand(.5, 1), s: fxRand(.6, 1.2), h0: hot ? fxRand(.8, 1) : fxRand(.55, .8) });
  });
  document.querySelectorAll('.page.active .fb-blaze').forEach(f => {
    if (Math.random() > dt * 1.1) return;
    const r = f.getBoundingClientRect();
    if (!r.width || r.bottom < 0 || r.top > fxH) return;
    fxEmber(r.left + r.width / 2 + fxRand(-8, 8), r.top + 6, { stops: fxStopsOf(f), vy: fxRand(-55, -25), max: fxRand(.4, .8), s: fxRand(.7, 1.3) });
  });

  });

    if (Math.random() > dt * .7) return;

    fxSmoke(r.left + r.width / 2 + fxRand(-3, 3), r.top + r.height * .35, { s: fxRand(3, 5), vy: fxRand(-16, -8), vx: fxRand(-4, 4), max: fxRand(1.3, 2), col: '120,114,124', a: .2 });
  });
}
const FX_AMBIENT_SEL = '.page.active .lv-row.lv-smolder, .page.active .lv-row.lv-twinkle, .page.active .fr-outline, .page.active .fb-blaze, .page.active .fb-smolder, .page.active .fb-dead';

/* Called after every list render: shelf chips that just landed get a sparkle. */
function fxAfterRender(page) {

      const r = t.getBoundingClientRect();

/* Checking an item: a flare from the circle (lists and Streaky's rows). */
function fxFlare(box) {

  for (let i = 0; i < 14; i++) fxEmber(cx + fxRand(-4, 4), cy + fxRand(-4, 4), { vx: fxRand(-60, 60), vy: fxRand(-170, -50), max: fxRand(.4, .8), s: fxRand(1, 2) });

function fxCollapse(el, cb) {

  el.style.transition = 'height .22s ease, padding .22s ease, opacity .22s ease';

  el.classList.add('lv-gone');

/* Clear on Checklist: each row heats up, then combusts. Rows go off ~150ms apart. */
function fxIgniteRows(rows, done) {
  rows.forEach((el, i) => setTimeout(() => fxIgnite(el, i === rows.length - 1 ? done : null), i * 150));
}
function fxIgnite(el, cb) {
  el.classList.remove('lv-smolder', 'lv-flare', 'lv-pop');
  if (fxReduced()) {
    el.style.transition = 'opacity .25s'; el.style.opacity = '0';
    setTimeout(() => fxCollapse(el, cb), 260);
    return;
  }
  el.classList.add('lv-igniting');
  const heat = setInterval(() => {   // a few sparks while it heats up
    const r = el.getBoundingClientRect();
    for (let k = 0; k < 2; k++) fxEmber(r.left + fxRand(14, r.width * .8), r.top + fxRand(8, r.height - 4), { vy: fxRand(-90, -40), max: fxRand(.3, .5), s: fxRand(.8, 1.4) });
    fxKick();
  }, 45);
  setTimeout(() => {
    clearInterval(heat);
    el.classList.remove('lv-igniting');
    el.classList.add('lv-boom');
    const blast = document.createElement('div'); blast.className = 'lv-blast'; el.appendChild(blast);
    const grp = el.closest('.lv-group');
    if (grp) { grp.classList.remove('lv-shake'); void grp.offsetWidth; grp.classList.add('lv-shake'); }
    const r = el.getBoundingClientRect(), cy = r.top + r.height / 2, span = Math.min(r.width * .85, 300);
    for (let k = 0; k < 11; k++) fxFlame(r.left + fxRand(10, span), cy + fxRand(-6, 6));
    for (let k = 0; k < 28; k++) {
      const ang = fxRand(-Math.PI * .95, -Math.PI * .05) + (Math.random() < .25 ? Math.PI : 0), sp = fxRand(120, 340);
      fxEmber(r.left + fxRand(10, span), cy + fxRand(-8, 8), { vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: 280, drag: .95, max: fxRand(.6, 1.1), s: fxRand(1, 2.4), h0: fxRand(.85, 1) });
    }
    for (let k = 0; k < 6; k++) fxSmoke(r.left + fxRand(20, span), cy + fxRand(-4, 4));
    setTimeout(() => {
      const r2 = el.getBoundingClientRect();
      for (let k = 0; k < 10; k++) fxCrumb(r2.left + fxRand(10, span), r2.top + fxRand(4, r2.height));
      for (let k = 0; k < 8; k++) fxAsh(r2.left + fxRand(10, span), r2.top + fxRand(4, r2.height));
      fxKick();
    }, 120);
    fxKick();
    setTimeout(() => fxCollapse(el, cb), 380);
  }, 210);
}

/* Finished on Bucket: shooting stars, rows lift off with a sparkle. */
function fxFinishRows(rows, done) {
  if (!fxReduced()) [0, 150, 320].forEach(d => setTimeout(fxShootingStar, d));
  rows.forEach((el, i) => setTimeout(() => {
    el.classList.remove('lv-twinkle', 'lv-pop');
    if (fxReduced()) {
      el.style.transition = 'opacity .25s'; el.style.opacity = '0';
      setTimeout(() => fxCollapse(el, i === rows.length - 1 ? done : null), 260);
      return;
    }
    el.classList.add('lv-rise');
    const r = el.getBoundingClientRect();
    for (let k = 0; k < 7; k++) fxSpark(r.left + fxRand(14, r.width * .8), r.top + fxRand(6, r.height - 6), { vy: fxRand(-50, -15), s: fxRand(2.5, 4.5) });
    fxKick();
    setTimeout(() => fxCollapse(el, i === rows.length - 1 ? done : null), 520);
  }, i * 90));
}

/* Streaks: after logging a day. Combusts in the habit's color (harder each
   level on 1–4 habits), brings an "out" habit back to life, or puts the day
   out with smoke when a log is undone. */
function fxRestart(el, cls, ms) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); }
const fxCenter = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2, r]; };
function fxHabitLogged(habit, ds, which, prev, next, before) {
  const el = document.querySelector(`#page-streaks [data-habit-id="${habit.id}"]`);
  if (!el) return;
  const after = streakFire(habit);
  if (before.state === 'dead' && after.state !== 'dead') fxRestart(el, 'fx-revive', 820);
  if (before.state !== 'dead' && after.state === 'dead') fxRestart(el, 'fx-die', 820);
  const btn = el.querySelector(which === 'yday' ? '.streak-yday-btn, .compact-yday-btn' : '.log-btn');
  if (next) fxRestart(btn, 'fx-pop', 460);
  if (fxReduced()) return;
  const stops = fxStops(habitColor(habit));
  const cell = [...el.querySelectorAll('[data-d]')].find(c => c.dataset.d === ds && c.offsetWidth);

  if (!next) {   // undone: smoke and ash where the day was, more if a 4 went back to 0
    const big = habit.type === 'gradient' && prev === 4;
    if (cell) { const [x, y] = fxCenter(cell); for (let k = 0; k < 5; k++) fxSmoke(x + fxRand(-4, 4), y, { s: fxRand(4, 7) }); for (let k = 0; k < 5; k++) fxAsh(x + fxRand(-5, 5), y); }
    if (big || after.state === 'dead') {
      const [fx, fy] = fxCenter(el.querySelector('.fb'));
      for (let k = 0; k < (big ? 9 : 5); k++) fxSmoke(fx + fxRand(-8, 8), fy + fxRand(-4, 4), { s: fxRand(7, 12), vy: fxRand(-40, -12) });
      if (big) for (let k = 0; k < 8; k++) fxAsh(fx + fxRand(-8, 8), fy);
    }
    fxKick();
    return;
  }

  // How hard it goes off
  const weekly = before.freq !== 'daily';
  const finishedWeek = weekly && before.state !== 'blaze' && after.state === 'blaze';
  let power, surge, jolt, sweep;
  if (habit.type === 'gradient' && !weekly) { power = .35 + next * .2; surge = next >= 2 && before.state !== 'dead'; jolt = next >= 3; sweep = prev === 0 ? 'grow' : null; }
  else if (weekly) { power = finishedWeek ? 1 : .45; surge = finishedWeek; jolt = finishedWeek; sweep = finishedWeek ? 'fill' : null; }
  else if (before.state !== 'dead') { power = 1; surge = true; jolt = true; sweep = 'grow'; }
  else { power = .65; surge = false; jolt = false; sweep = 'grow'; }

  el.querySelectorAll('.fire-run:not(.fr-inplay)').forEach((run, i) => {
    const vertical = run.parentElement.dataset.fireDir === 'col';
    if (!vertical && ds >= run.dataset.from && ds <= run.dataset.to) {
      if (sweep === 'fill') run.animate([{ clipPath: 'inset(-20px 100% -8px 0%)' }, { clipPath: 'inset(-20px 0% -8px 0%)' }], { duration: 480, easing: 'ease-out' });
      else if (sweep === 'grow') {
        const n = +run.dataset.n || 1;
        const right = n === 1 ? 50 : ds === run.dataset.to ? 100 / n : 0;
        const left = n === 1 ? 50 : ds === run.dataset.from ? 100 / n : 0;
        run.animate([{ clipPath: `inset(-20px ${right}% -8px ${left}%)` }, { clipPath: 'inset(-20px 0% -8px 0%)' }], { duration: 380, easing: 'ease-out' });
      }
    }
    if (surge) setTimeout(() => fxRestart(run, 'fr-surge', 800), i * 60);
  });
  if (cell) { const [x, y] = fxCenter(cell); for (let k = 0; k < Math.round(10 * power); k++) fxEmber(x + fxRand(-4, 4), y, { stops, vx: fxRand(-50, 50), vy: fxRand(-140, -40), max: fxRand(.4, .8) }); }
  if (btn) { const [bx, by] = fxCenter(btn); for (let k = 0; k < Math.round(10 * power); k++) fxEmber(bx + fxRand(-6, 6), by + fxRand(-6, 6), { stops, vx: fxRand(-70, 70), vy: fxRand(-150, -40), max: fxRand(.4, .75) }); }
  setTimeout(() => {
    const f = el.querySelector('.fb'); if (!f || !f.isConnected) return;
    const [fx, fy] = fxCenter(f);
    const boom = document.createElement('div'); boom.className = 'fb-boom'; boom.style.opacity = Math.min(1, .45 + power * .5);
    f.appendChild(boom); setTimeout(() => boom.remove(), 520);
    for (let k = 0; k < Math.round(10 * power); k++) fxFlame(fx + fxRand(-8, 8), fy + fxRand(-6, 6), stops);
    for (let k = 0; k < Math.round(26 * power); k++) {
      const ang = fxRand(-Math.PI * .95, -Math.PI * .05) + (Math.random() < .25 ? Math.PI : 0), sp = fxRand(110, 300) * (.7 + power * .3);
      fxEmber(fx, fy, { stops, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: 260, drag: .95, max: fxRand(.55, 1), s: fxRand(1, 2.2) });
    }
    for (let k = 0; k < Math.round(3 * power); k++) fxSmoke(fx + fxRand(-6, 6), fy - 6, { s: fxRand(8, 14) });
    fxRestart(el.querySelector('.streak-big-number, .compact-sub'), 'fx-numpop', 560);
    if (jolt) fxRestart(el, 'fx-jolt', 320);
    fxKick();
  }, surge ? 220 : 120);
  fxKick();
}

/* ══ NAVIGATION ════════════════════════════════════════ */
function lvOpenList(tab, id) {
  if (dragState) return;
  lvHomeScroll = window.scrollY;
  lvOpen = { tab, id };
  lvAnim = 'in';
  renderGoalTab(tab);
  window.scrollTo(0, 0);
}
function lvBack() {
  if (!lvOpen) return;
  const tab = lvOpen.tab;
  lvOpen = null;
  lvAnim = 'back';
  renderGoalTab(tab);
  const y = lvHomeScroll;
  window.scrollTo(0, y);
  requestAnimationFrame(() => window.scrollTo(0, y));
}
function lvToggleGoalsEdit() { lvGoalsEditing = !lvGoalsEditing; render(); }

/* ══ ITEMS ═════════════════════════════════════════════ */
function lvToggle(tab, itemId) {
  if (dragState || lvClearing) return;
  const f = lvFindItem(tab, itemId); if (!f) return;
  f.item.checked = !f.item.checked;
  if (tab === 'bucket') { if (f.item.checked) f.item.doneOn = todayStr(); else delete f.item.doneOn; }
  lvPopId = f.item.checked ? itemId : null;
  saveData(data);
  render();
  if (f.item.checked) {
    const row = document.querySelector(`#page-${tab} .lv-row[data-lvid="${itemId}"]`);
    if (row) { if (tab === 'bucket') fxStarBurst(row); else fxFlareRow(row); }
  }
}

/* Clear plays its effect on the rows first (combustion on Checklist,
   shooting stars on Bucket), then changes the data and re-renders. */
let lvClearing = false;
let lvFreshShelf = null;   // ids just moved to the Done shelf, so their chips pop in
function lvClear(tab, secId) {
  if (lvClearing || !lvFind(tab, secId)) return;
  const group = document.querySelector(`#page-${tab} .lv-group[data-sec="${secId}"]`);
  const rows = group ? [...group.querySelectorAll(`:scope > .lv-row.${tab === 'bucket' ? 'lv-starred' : 'lv-done'}`)] : [];
  if (!rows.length) { lvApplyClear(tab, secId); return; }
  lvClearing = true;
  const btn = group.querySelector('.lv-clear-btn'); if (btn) btn.disabled = true;
  const done = () => { lvClearing = false; lvApplyClear(tab, secId); };
  if (tab === 'bucket') fxFinishRows(rows, done); else fxIgniteRows(rows, done);
}
function lvApplyClear(tab, secId) {
  const f = lvFind(tab, secId); if (!f) { render(); return; }
  if (tab === 'bucket') {
    const moved = f.sec.items.filter(i => i.checked && !i.shelved);
    moved.forEach(i => { i.shelved = true; if (!i.doneOn) i.doneOn = todayStr(); });
    lvFreshShelf = new Set(moved.map(i => i.id));
    saveData(data); render();
    lvFreshShelf = null;
    lvToast(`Moved ${moved.length} to your Done shelf`, () => moved.forEach(i => { delete i.shelved; }));
  } else {
    const before = f.sec.items.slice();
    const n = before.filter(i => i.checked).length;
    f.sec.items = f.sec.items.filter(i => !i.checked);
    saveData(data); render();
    lvToast(`Cleared ${n} done item${n === 1 ? '' : 's'}`, () => { const g = lvFind(tab, secId); if (g) g.sec.items = before; });
  }
}

/* Inline add: the row turns into an input. Enter adds and stays open for
   the next one; the new row is inserted in place so the keyboard stays up. */
function lvOpenAdd(el) {
  if (el.classList.contains('open')) return;
  const tab = el.dataset.tab, f = lvFind(tab, el.dataset.sec); if (!f) return;
  const withDate = tab === 'checklist' && f.sec.type !== 'goals';
  el.classList.add('open');
  el.onclick = null;
  el.innerHTML = `<span class="lv-plus">＋</span><input class="lv-add-in" enterkeyhint="done" autocomplete="off" placeholder="${tab === 'bucket' ? 'Someday I want to…' : tab === 'goals' ? 'New goal' : 'New item'}">` +
    (withDate ? `<span class="lv-when"></span><label class="lv-cal" aria-label="Due date">${LV_CAL}<input type="date" class="lv-add-date"></label>` : '');
  const inp = el.querySelector('.lv-add-in'), dt = el.querySelector('.lv-add-date');
  const maybeClose = () => setTimeout(() => { if (el.isConnected && !el.contains(document.activeElement)) lvCommitAdd(el, false); }, 160);
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); lvCommitAdd(el, true); }
    else if (ev.key === 'Escape') { inp.value = ''; inp.blur(); }
  });
  inp.addEventListener('blur', maybeClose);
  if (dt) {
    dt.addEventListener('change', () => {
      el.dataset.due = dt.value || '';
      el.querySelector('.lv-when').textContent = dt.value ? lvDue(dt.value).t : '';
      el.querySelector('.lv-cal').classList.toggle('has', !!dt.value);
      inp.focus();
    });
    dt.addEventListener('blur', maybeClose);
  }
  inp.focus();
}
function lvCommitAdd(el, keepOpen) {
  if (el.dataset.committing) return;
  const tab = el.dataset.tab, f = lvFind(tab, el.dataset.sec);
  const inp = el.querySelector('.lv-add-in');
  if (!f || !inp) return;
  const text = inp.value.trim();
  if (text) {
    const item = { id: uid(), text, checked: false };
    if (el.dataset.due) item.deadline = el.dataset.due;
    f.sec.items.push(item);
    saveData(data);
    el.insertAdjacentHTML('beforebegin', tab === 'goals' ? lvGoalLineHtml(f.sec, item) : lvRowHtml(tab, f.entry, f.sec, item));
    const row = el.previousElementSibling, btn = row && row.querySelector('.lv-dots');
    if (btn) attachDragToDotsBtn(btn, row, { type: 'lv', tab, arr: () => { const g = lvFind(tab, f.sec.id); return g ? g.sec.items : null; }, sel: tab === 'goals' ? '.lv-gline' : '.lv-row[data-drag]' });
  }
  if (text) {   // keep the counts next to the list name honest while the row stays open
    const meta = document.querySelector(`#page-${tab} .lv-d-title p`);
    if (meta && lvOpen) { const e = lvEntry(tab, lvOpen.id); if (e) meta.textContent = lvMeta(tab, e); }
  }
  if (keepOpen && text) {
    inp.value = '';
    delete el.dataset.due;
    const w = el.querySelector('.lv-when'); if (w) w.textContent = '';
    const c = el.querySelector('.lv-cal'); if (c) c.classList.remove('has');
    const d = el.querySelector('.lv-add-date'); if (d) d.value = '';
    return;
  }
  el.dataset.committing = '1';
  // Another add row is taking focus: close this one in place, don't re-render under it.
  if (document.activeElement && document.activeElement.classList.contains('lv-add-in')) {
    el.outerHTML = lvAddRowHtml(tab, f.entry, f.sec);
    return;
  }
  render();
}

/* ══ SHEETS ═════════════════════════════════════════════
   Every popup is a bottom sheet: .modal-overlay > .modal.
   A sheet takes its accent from --c / --cd / --cl, set on the overlay
   from the list's or habit's color (sheetColor). Unset = app pink.
   Three kinds, one look:
     lvSheet      — a menu of actions (⋮ buttons)
     confirmSheet — a yes/no question
     fsOpen       — a form (edit item, list, section, habit, yesterday)
   ══════════════════════════════════════════════════════ */
const SHEET_ICONS = {
  edit:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
  calendar: LV_CAL,
  trash:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1.5 14a2 2 0 0 1-2 2h-7a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
  pin:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>',
  unpin:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/><line x1="3" y1="3" x2="21" y2="21"/></svg>',
  history:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg>',
  undo:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>'
};
const SHEET_CLOSERS = {};   // overlay id -> close function (Escape key + swipe-down use these)

function paletteHex(id) { const p = HABIT_PALETTE.find(c => c.id === id); return p ? p.hex : '#ff4d7e'; }
function hexVars(hex) { return `--c:${hex};--cd:${darkenHex(hex, 25)};--cl:${lvMix(hex, .45)}`; }
function sheetColor(el, hex) { el.style.cssText = hex ? hexVars(hex) : ''; }

/* ── Menu sheet ── buttons: [{ label, icon, danger, fn }] */
function lvSheet(title, buttons, sub, color) {
  lvSheetBtns = buttons;
  const ov = document.getElementById('lvSheet');
  sheetColor(ov, color);
  const t = title.length > 48 ? title.slice(0, 48) + '…' : title;
  ov.innerHTML = `<div class="modal action-sheet"><div class="modal-title">${escHtml(t)}</div>${sub ? `<div class="lv-sheet-sub">${escHtml(sub)}</div>` : ''}` +
    buttons.map((b, i) => `<button class="action-sheet-btn${b.danger ? ' danger' : ''}" onclick="lvSheetPick(${i})">${b.icon ? SHEET_ICONS[b.icon] || '' : ''}<span>${escHtml(b.label)}</span></button>`).join('') +
    `<button class="btn-cancel" onclick="lvSheetClose()" style="width:100%;margin-top:6px">Cancel</button></div>`;
  ov.classList.add('open');
}
function lvSheetClose() { document.getElementById('lvSheet').classList.remove('open'); }
function lvSheetPick(i) { const b = lvSheetBtns[i]; lvSheetClose(); if (b && b.fn) setTimeout(b.fn, 180); }
SHEET_CLOSERS.lvSheet = lvSheetClose;

/* ── Confirm sheet ── body is trusted HTML built by the caller */
function confirmSheet({ title, body, confirmLabel = 'Delete', danger = true, color, fn }) {
  lvSheetBtns = [{ fn }];
  const ov = document.getElementById('lvSheet');
  sheetColor(ov, color);
  ov.innerHTML = `<div class="modal"><div class="modal-title">${escHtml(title)}</div><div class="sheet-body">${body}</div>
    <div class="modal-actions"><button class="btn-cancel" onclick="lvSheetClose()">Cancel</button>
    <button class="btn-save${danger ? ' btn-danger' : ''}" onclick="lvSheetPick(0)">${escHtml(confirmLabel)}</button></div></div>`;
  ov.classList.add('open');
}

/* ── Form sheet ──
   onSave returns false to keep the sheet open (e.g. empty name). */
let fsState = null;
function fsOpen({ color, eyebrow, title, body, saveLabel = 'Save', onSave, onMount, focus }) {
  const ov = document.getElementById('formSheet');
  sheetColor(ov, color);
  ov.innerHTML = `<div class="modal fs">${eyebrow ? `<div class="fs-eyebrow">${escHtml(eyebrow)}</div>` : ''}<div class="modal-title">${escHtml(title)}</div>${body}
    <div class="modal-actions"><button class="btn-cancel" onclick="fsClose()">Cancel</button><button class="btn-save" onclick="fsSave()">${escHtml(saveLabel)}</button></div></div>`;
  fsState = { onSave };
  ov.querySelectorAll('.fs-enter').forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fsSave(); }
  }));
  lockScroll();
  ov.classList.add('open');
  if (onMount) onMount(ov);
  if (focus) setTimeout(() => {
    const el = ov.querySelector(focus);
    if (el && ov.classList.contains('open')) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (err) {} }
  }, 320);
}
function fsClose() {
  const ov = document.getElementById('formSheet');
  if (!ov.classList.contains('open')) return;
  ov.classList.remove('open');
  fsState = null;
  unlockScroll();
}
function fsSave() {
  if (!fsState) return;
  if (fsState.onSave && fsState.onSave() === false) return;
  fsClose();
}
SHEET_CLOSERS.formSheet = fsClose;

// Shared form pieces
function fsSwatchesHtml(selected, pickFn) {
  return `<div class="fs-swatches">${HABIT_PALETTE.map(p =>
    `<button class="fs-swatch${p.id === selected ? ' on' : ''}" style="background:${p.hex}" onclick="${pickFn}('${p.id}')" aria-label="${p.id}"></button>`).join('')}</div>`;
}
function segHtml(options, current, onclickFn, extraCls) {
  return `<div class="seg${extraCls ? ' ' + extraCls : ''}">${options.map(o =>
    `<button class="seg-btn${o.v === current ? ' on' : ''}" onclick="event.stopPropagation();${onclickFn}('${o.v}')">${escHtml(o.label)}</button>`).join('')}</div>`;
}
function fsGrow(el) { if (!el) return; el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight + 2, 180) + 'px'; }
function fsNeedText(el) {
  if (el && el.value.trim()) return el.value.trim();
  if (el) { el.classList.remove('fs-shake'); void el.offsetWidth; el.classList.add('fs-shake'); el.focus(); }
  return null;
}

/* ══ ITEM MENUS + EDIT SHEET ══════════════════════════════ */
function lvItemMenu(tab, itemId) {
  if (dragState) return;
  const f = lvFindItem(tab, itemId); if (!f) return;
  const btns = [{ label: 'Edit', icon: 'edit', fn: () => lvEditItem(tab, itemId, false) }];
  btns.push({ label: 'Delete', icon: 'trash', danger: true, fn: () => {
    const g = lvFindItem(tab, itemId); if (!g) return;
    const idx = g.sec.items.indexOf(g.item);
    g.sec.items.splice(idx, 1);
    saveData(data); render();
    lvToast('Deleted', () => { g.sec.items.splice(Math.min(idx, g.sec.items.length), 0, g.item); });
  } });
  lvSheet(f.item.text, btns, null, folderColor(f.entry));
}

let fsItem = null;   // { tab, itemId, due }
function lvEditItem(tab, itemId, focusDate) {
  const f = lvFindItem(tab, itemId); if (!f) return;
  const withDue = tab === 'checklist' && f.sec.type !== 'goals';
  fsItem = { tab, itemId, due: f.item.deadline || '' };
  if (focusDate && !fsItem.due) fsItem.due = todayStr();
  fsOpen({
    color: folderColor(f.entry),
    eyebrow: f.entry.type === 'folder' ? `${f.entry.name} · ${f.sec.name}` : f.entry.name,
    title: tab === 'goals' ? 'Edit goal' : 'Edit item',
    body: `<textarea class="modal-input fs-text fs-enter" id="fsText" rows="1" oninput="fsGrow(this)">${escHtml(f.item.text)}</textarea>` + (withDue ? '<div id="fsDue"></div>' : ''),
    onMount: () => { fsGrow(document.getElementById('fsText')); if (withDue) fsRenderDue(); },
    focus: focusDate ? null : '#fsText',
    onSave: () => {
      const text = fsNeedText(document.getElementById('fsText'));
      if (!text) return false;
      const g = lvFindItem(fsItem.tab, fsItem.itemId); if (!g) return;
      g.item.text = text;
      if (withDue) { if (fsItem.due) g.item.deadline = fsItem.due; else delete g.item.deadline; }
      saveData(data);
      render();
    }
  });
}
function lvShortDate(ds) { const d = lvParse(ds); return `${LV_WD[d.getDay()]}, ${LV_MON[d.getMonth()]} ${d.getDate()}`; }
function fsRenderDue() {
  const el = document.getElementById('fsDue'); if (!el || !fsItem) return;
  const due = fsItem.due, t = new Date();
  const opts = [['Today', todayStr()], ['Tomorrow', dateStr(addDays(t, 1))], ['Next week', dateStr(addDays(t, 7))]];
  const preset = opts.some(o => o[1] === due);
  const diff = due ? lvDayDiff(due) : 0;
  const sum = !due ? '' : diff < 0 ? `${lvShortDate(due)} · ${lvLate(-diff)}` : lvShortDate(due);
  el.className = 'fs-due' + (due ? ' on' : '');
  el.innerHTML = `<button class="fs-due-row" onclick="fsToggleDue()"><span class="fs-check">${LV_CHECK}</span>Due date<span class="fs-due-sum${diff < 0 ? ' late' : ''}">${sum}</span></button>` +
    (due ? `<div class="fs-pills">${opts.map(o => `<button class="fs-pill${o[1] === due ? ' on' : ''}" onclick="fsSetDue('${o[1]}')">${o[0]}</button>`).join('')}` +
      `<label class="fs-pill${preset ? '' : ' on'}">${preset ? 'Pick a date' : `${LV_MON[lvParse(due).getMonth()]} ${lvParse(due).getDate()}`}<input type="date" value="${due}" onchange="fsSetDue(this.value)"></label></div>` : '');
}
function fsToggleDue() { if (!fsItem) return; fsItem.due = fsItem.due ? '' : todayStr(); fsRenderDue(); }
function fsSetDue(v) { if (!fsItem) return; fsItem.due = v || ''; fsRenderDue(); }

function lvShelfMenu(itemId) {
  const f = lvFindItem('bucket', itemId); if (!f) return;
  const when = f.item.doneOn ? `Done ${LV_MON[lvParse(f.item.doneOn).getMonth()]} ${lvParse(f.item.doneOn).getFullYear()} · ` : '';
  lvSheet(f.item.text, [
    { label: 'Not done yet', icon: 'undo', fn: () => {
      f.item.checked = false; delete f.item.shelved; delete f.item.doneOn;
      saveData(data); render(); lvToast(`Back in ${f.entry.type === 'folder' ? f.sec.name : f.entry.name}`);
    } },
    { label: 'Delete', icon: 'trash', danger: true, fn: () => {
      const idx = f.sec.items.indexOf(f.item);
      f.sec.items.splice(idx, 1); saveData(data); render();
      lvToast('Deleted', () => { f.sec.items.splice(Math.min(idx, f.sec.items.length), 0, f.item); });
    } }

/* ══ LISTS + SECTIONS ═════════════════════════════════════ */
function lvListMenu(tab, id) {

    isPinned

      : { label: 'Pin to top', icon: 'pin', fn: () => { data[tab].pinned = id; saveData(data); if (lvOpen) { lvOpen = null; lvAnim = 'back'; } renderGoalTab(tab); window.scrollTo(0, 0); lvToast(`${e.name} is pinned to the top`); } },
    { label: 'Edit list', icon: 'edit', fn: () => lvEditList(tab, id) },

function lvSectionMenu(tab, entryId, secId) {
  const f = lvFind(tab, secId); if (!f) return;
  lvSheet(f.sec.name, [
    { label: 'Rename section', icon: 'edit', fn: () => lvRenameSection(tab, entryId, secId) },

  ], null, folderColor(f.entry));

function lvGoalSectionMenu(secId) {
  const s = lvEntry('goals', secId); if (!s) return;
  lvSheet(s.name, [
    { label: 'Edit section', icon: 'edit', fn: () => lvGoalSectionEditor(s) },

  ], null, folderColor(s));

function lvConfirmDelete(tab, sectionId, folderId, noun) {
  const owner = folderId ? lvEntry(tab, folderId) : lvEntry(tab, sectionId);
  const e = folderId ? (lvFind(tab, sectionId) || {}).sec : owner;
  if (!e || !owner) return;
  confirmSheet({
    title: `Delete ${noun}?`,
    body: `This permanently deletes <b>${escHtml(e.name)}</b> and everything in it.`,
    color: folderColor(owner),
    fn: () => {
      if (folderId) owner.sections = owner.sections.filter(s => s.id !== sectionId);
      else { data[tab].sections = data[tab].sections.filter(s => s.id !== sectionId); lvAfterDelete(tab, sectionId); }
      saveData(data);
      render();
    }
  });
}
function lvAfterDelete(tab, sectionId) {
  if (data[tab] && data[tab].pinned === sectionId) data[tab].pinned = null;
  if (lvOpen && lvOpen.tab === tab && lvOpen.id === sectionId) { lvOpen = null; lvAnim = 'back'; }
}

/* List editor: name, color, icon. Goal sections use it too, without the icon. */
let fsList = null;   // { mode:'new'|'edit', tab, id, color, icon }
function lvNextColor(tab, fallback) {
  const used = data[tab].sections.map(s => s.color);
  return HABIT_PALETTE.map(p => p.id).find(c => !used.includes(c)) || fallback;
}
function lvNewList(tab) {

  fsOpenList('New list', '', 'Create list');
}
function lvEditList(tab, id) {

function lvNewGoalSection() {

}
function lvGoalSectionEditor(s) {
  fsList = { mode: 'edit', tab: 'goals', id: s.id, color: s.color || 'orange' };
  fsOpenList('Edit section', s.name, 'Save');
}
function fsOpenList(title, name, saveLabel) {
  const withIcon = fsList.tab !== 'goals';
  fsOpen({
    color: paletteHex(fsList.color), eyebrow: LV_TITLE[fsList.tab], title, saveLabel,
    body: `<div class="fs-name">${withIcon ? '<div class="lv-ico" id="fsIco"></div>' : ''}<input class="modal-input fs-enter" id="fsName" value="${escHtml(name)}" placeholder="${withIcon ? 'List name' : 'Section name'}" autocomplete="off"></div>
      <div class="fs-label">Color</div><div id="fsColors"></div>` +

  document.getElementById('fsIcons').innerHTML = `<div class="fs-icons">` +

    `<button class="fs-icon fs-icon-emoji${isEmoji ? ' on' : ''}" onclick="fsEmojiSlot()" aria-label="Use an emoji">${isEmoji ? `<span>${escHtml(cur.slice(6))}</span>` : LIST_ICONS.smile}</button></div>`;
}
function fsPickListColor(c) { if (fsList) { fsList.color = c; fsRenderListPickers(); } }
function fsPickListIcon(id) {

  fsList.icon = id;
  document.getElementById('fsEmojiWrap').innerHTML = '';

function fsEmojiSlot() {

  if (!wrap.innerHTML) {
    wrap.innerHTML = '<input class="modal-input fs-emoji-in" id="fsEmoji" placeholder="Type or paste an emoji" autocomplete="off" oninput="fsEmojiInput(this)">';

function fsEmojiInput(el) {
  const segs = [...new Intl.Segmenter('en', { granularity: 'grapheme' }).segment(el.value)].map(s => s.segment);
  const pick = segs.reverse().find(g => /\p{Extended_Pictographic}|\p{Regional_Indicator}/u.test(g));
  el.value = pick || '';
  if (pick && fsList) { fsList.icon = 'emoji:' + pick; fsRenderListPickers(); }
}

/* Sections inside a list: name only. Every section in Checklist and Bucket has checkboxes. */
function lvNewSection(tab, entryId) {
  const e = lvEntry(tab, entryId); if (!e) return;
  fsOpen({
    color: folderColor(e), eyebrow: e.name, title: 'New section', saveLabel: 'Add section',
    body: '<input class="modal-input fs-enter" id="fsName" placeholder="Section name" autocomplete="off">',
    focus: '#fsName',
    onSave: () => {
      const name = fsNeedText(document.getElementById('fsName'));
      if (!name) return false;
      const en = lvEntry(tab, entryId); if (!en) return;
      if (en.type !== 'folder') {
        // A one-section list grows into a multi-section list. Its id stays the
        // same (so pinning survives); its items move into a first section.
        const first = { id: 's_' + uid(), name: en.name, type: 'tasks', items: en.items || [] };
        delete en.items;
        en.type = 'folder';
        en.sections = [first];
      }

      render();
    }

function lvRenameSection(tab, entryId, secId) {
  const f = lvFind(tab, secId); if (!f) return;
  fsOpen({
    color: folderColor(f.entry), eyebrow: f.entry.name, title: 'Rename section',

    focus: '#fsName',
    onSave: () => {
      const name = fsNeedText(document.getElementById('fsName'));
      if (!name) return false;
      const g = lvFind(tab, secId); if (g) g.sec.name = name;
      saveData(data);
      render();

}

/* ══ SHEET GESTURES ═══════════════════════════════════════
   Drag a sheet down to close it. Starts only when the sheet is
   scrolled to the top and the finger moves mostly downward, so
   scrolling inside a tall sheet still works. */
function closeOverlay(ov) {
  const fn = SHEET_CLOSERS[ov.id];
  if (fn) fn(); else ov.classList.remove('open');
}
(function setupSheetDrag() {
  let m = null, sx = 0, sy = 0, dy = 0, dragging = false;
  document.addEventListener('touchstart', e => {
    m = null;
    const mod = e.target.closest && e.target.closest('.modal-overlay.open > .modal');
    if (!mod || e.touches.length !== 1 || mod.scrollTop > 0) return;
    if (e.target.closest('input, textarea, .mcal')) return;
    m = mod; sx = e.touches[0].clientX; sy = e.touches[0].clientY; dy = 0; dragging = false;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!m) return;
    const t = e.touches[0], ddx = t.clientX - sx, ddy = t.clientY - sy;
    if (!dragging) {
      if (ddy > 8 && ddy > Math.abs(ddx) * 1.2) { dragging = true; m.style.transition = 'none'; }
      else { if (Math.abs(ddx) > 8 || ddy < -8) m = null; return; }
    }
    dy = Math.max(0, ddy);
    m.style.transform = `translateY(${dy}px)`;
    e.preventDefault();
  }, { passive: false });
  const end = () => {
    if (!m) return;
    const mod = m; m = null;
    if (!dragging) return;
    mod.style.transition = 'transform .22s cubic-bezier(.32,.72,0,1)';
    if (dy > 110) {
      mod.style.transform = 'translateY(105%)';
      setTimeout(() => {
        closeOverlay(mod.parentElement);
        mod.style.transition = ''; mod.style.transform = '';
      }, 200);
    } else {
      mod.style.transform = '';
      setTimeout(() => { mod.style.transition = ''; }, 230);
    }
  };
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
})();

function lvToast(msg, undo) {
  const t = document.getElementById('lvToast');
  document.getElementById('lvToastMsg').textContent = msg;
  document.getElementById('lvToastUndo').hidden = !undo;
  lvUndoFn = undo || null;
  t.classList.add('show');
  clearTimeout(lvToastTimer);
  lvToastTimer = setTimeout(() => { t.classList.remove('show'); lvUndoFn = null; }, undo ? 5000 : 1800);
}
function lvDoUndo() {
  if (!lvUndoFn) return;
  const fn = lvUndoFn; lvUndoFn = null;
  fn(); saveData(data); render();
  document.getElementById('lvToast').classList.remove('show');
}

/* Re-rendering replaces innerHTML wholesale, which drops the scroll position.
   Capture it before and restore after so adding an item deep in a long list
   (especially inside a folder) doesn't fling you to the bottom of the page. */
function withScrollPreserved(fn) {
  const y = window.scrollY;
  fn();
  if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  requestAnimationFrame(() => {
    if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
  });
}

/* Remember where the page was when a modal opened, so focusing an input
   (which iOS scrolls to) doesn't leave the page somewhere else on close. */
let modalScrollY = null;
function lockScroll() { if (modalScrollY === null) modalScrollY = window.scrollY; }
function unlockScroll() {
  if (modalScrollY === null) return;
  const y = modalScrollY;
  modalScrollY = null;
  requestAnimationFrame(() => window.scrollTo(0, y));
}

function render(opts) {
  const jumpToTop = opts && opts.jumpToTop;
  const draw = () => {
    if (currentTab === 'streaks') renderStreaks({ raw: true });
    else renderGoalTab(currentTab);
  };
  if (jumpToTop) draw();
  else withScrollPreserved(draw);
}

/* ─────────────────────────────────────────────────────
   DRAG & DROP — ghost-based visual system
   Long-press the ⋮ button to drag, short tap to open menu
   ───────────────────────────────────────────────────── */

let dragState = null;
let lvDragged = false;   // set when a long-press drag starts, so the swipe handler ignores that touch
let dragGhostEl = null;
let dragInsertLineEl = null;

function attachStreakDragHandlers(pageEl) {
  pageEl.querySelectorAll('.streak-card').forEach(el => {
    const dotsBtn = el.querySelector('.streak-dots-btn');
    if (dotsBtn) attachDragToDotsBtn(dotsBtn, el, { type: 'streak', habitId: el.dataset.habitId });
  });
}

function attachDragToDotsBtn(dotsBtn, itemEl, ctx) {
  let pressTimer = null;
  let dragStarted = false;
  let touchId = null;
  let startX = 0, startY = 0;

  dotsBtn.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    touchId = t.identifier;
    startX = t.clientX;
    startY = t.clientY;
    dragStarted = false;

    pressTimer = setTimeout(() => {
      dragStarted = true;
      dotsBtn.classList.add('drag-handle-active');
      if (navigator.vibrate) navigator.vibrate([20, 10, 20]);
      startDrag(itemEl, ctx, t.clientX, t.clientY);
    }, 350);
  }, { passive: true });

  dotsBtn.addEventListener('touchmove', e => {
    const t = findTouch(e.touches, touchId);
    if (!t) return;
    if (!dragStarted) {
      // Cancel if finger moves before long-press threshold
      if (Math.abs(t.clientX - startX) > 6 || Math.abs(t.clientY - startY) > 6) {
        clearTimeout(pressTimer);
      }
      return;
    }
    e.preventDefault();
    moveDrag(t.clientX, t.clientY, ctx);
  }, { passive: false });

  dotsBtn.addEventListener('touchend', e => {
    clearTimeout(pressTimer);
    dotsBtn.classList.remove('drag-handle-active');
    if (dragStarted) {
      dragStarted = false;
      finishDrag(ctx);
      e.preventDefault(); // prevent tap firing after drag
    }
    touchId = null;
  });

  dotsBtn.addEventListener('touchcancel', e => {
    clearTimeout(pressTimer);
    dotsBtn.classList.remove('drag-handle-active');
    if (dragStarted) cancelDrag();
    dragStarted = false;
    touchId = null;
  });
}

function findTouch(list, id) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].identifier === id) return list[i];
  }
  return null;
}

function startDrag(itemEl, ctx, cx, cy) {
  lvDragged = true;
  // Mark source as ghost placeholder
  itemEl.classList.add('drag-source');
  dragState = { ctx, sourceEl: itemEl, dropIndex: -1, insertBefore: null };

  // Build ghost clone
  const rect = itemEl.getBoundingClientRect();
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  if (ctx.type === 'lv') {
    ghost.className = 'drag-ghost ' + itemEl.className.replace('drag-source', '');
    const st = itemEl.getAttribute('style'); if (st) ghost.style.cssText = st;
  }
  ghost.style.width = rect.width + 'px';
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.innerHTML = itemEl.innerHTML;
  document.body.appendChild(ghost);
  dragGhostEl = ghost;
  dragState.ghostW = rect.width; dragState.ghostH = rect.height;

  // Insert line element
  const line = document.createElement('div');
  line.className = 'drag-insert-line';
  line.style.display = 'none';
  document.body.appendChild(line);
  dragInsertLineEl = line;

  positionGhost(cx, cy, rect);
}

function positionGhost(cx, cy, refRect) {
  if (!dragGhostEl) return;
  const rect = refRect || dragGhostEl.getBoundingClientRect();
  const offsetY = cy - rect.height / 2;
  const padding = 18;
  if (dragState && dragState.ctx && dragState.ctx.grid) {
    const w = dragState.ghostW, h = dragState.ghostH;
    dragGhostEl.style.width = w + 'px';
    dragGhostEl.style.height = h + 'px';
    dragGhostEl.style.left = (cx - w / 2) + 'px';
    dragGhostEl.style.top = (cy - h / 2) + 'px';
    return;
  }
  dragGhostEl.style.left = padding + 'px';
  dragGhostEl.style.width = `calc(100% - ${padding*2}px)`;
  dragGhostEl.style.top = offsetY + 'px';
}

function moveDrag(cx, cy, ctx) {
  if (!dragGhostEl || !dragState) return;
  positionGhost(cx, cy, null);
  if (ctx.type === 'lv') { lvMoveDrag(cx, cy, ctx); return; }

  // Habit cards (lists are handled above)
  const siblings = Array.from(document.querySelectorAll('.streak-card:not(.drag-source)'));

  // Reset shifts
  siblings.forEach(s => s.classList.remove('drag-shift-up','drag-shift-down'));
  dragInsertLineEl.style.display = 'none';
  dragState.insertBefore = null;

  let insertTarget = null;
  let insertPos = 'before';

  for (const sib of siblings) {
    const r = sib.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    if (cy >= r.top - 10 && cy <= r.bottom + 10) {
      insertTarget = sib;
      insertPos = cy < mid ? 'before' : 'after';
      break;
    }
  }

  if (insertTarget) {
    const r = insertTarget.getBoundingClientRect();
    // Shift siblings
    const srcIdx = Array.from(insertTarget.parentElement.children).indexOf(dragState.sourceEl);
    const tgtIdx = Array.from(insertTarget.parentElement.children).indexOf(insertTarget);

    siblings.forEach(sib => {
      const sibIdx = Array.from(sib.parentElement.children).indexOf(sib);
      if (insertPos === 'before') {
        if (sibIdx >= tgtIdx && (srcIdx === -1 || sibIdx < srcIdx)) sib.classList.add('drag-shift-down');
        else if (sibIdx < tgtIdx && (srcIdx === -1 || sibIdx > srcIdx)) sib.classList.add('drag-shift-up');
      } else {
        if (sibIdx <= tgtIdx && (srcIdx === -1 || sibIdx > srcIdx)) sib.classList.add('drag-shift-up');
        else if (sibIdx > tgtIdx && (srcIdx === -1 || sibIdx < srcIdx)) sib.classList.add('drag-shift-down');
      }
    });

    // Position insert line
    const lineY = insertPos === 'before' ? r.top - 3 : r.bottom + 1;
    dragInsertLineEl.style.display = 'block';
    dragInsertLineEl.style.position = 'fixed';
    dragInsertLineEl.style.left = (r.left + 8) + 'px';
    dragInsertLineEl.style.width = (r.width - 16) + 'px';
    dragInsertLineEl.style.top = lineY + 'px';

    dragState.insertBefore = { target: insertTarget, pos: insertPos };
  }
}

function finishDrag(ctx) {
  if (!dragState) return;
  const { sourceEl, insertBefore } = dragState;

  // Clean up visuals
  sourceEl.classList.remove('drag-source');
  document.querySelectorAll('.drag-shift-up,.drag-shift-down').forEach(el => {
    el.classList.remove('drag-shift-up','drag-shift-down');
  });
  if (dragGhostEl) { dragGhostEl.remove(); dragGhostEl = null; }
  if (dragInsertLineEl) { dragInsertLineEl.remove(); dragInsertLineEl = null; }

  // Apply reorder
  if (insertBefore && insertBefore.target) {
    applyReorder(ctx, insertBefore);
  } else {
    dragState = null;
    render();
  }
}

function cancelDrag() {
  if (dragState) dragState.sourceEl.classList.remove('drag-source');
  document.querySelectorAll('.lv-drop-target').forEach(el => el.classList.remove('lv-drop-target'));
  document.querySelectorAll('.lv-dragging').forEach(el => el.classList.remove('lv-dragging'));
  document.querySelectorAll('.drag-shift-up,.drag-shift-down').forEach(el => el.classList.remove('drag-shift-up','drag-shift-down'));
  if (dragGhostEl) { dragGhostEl.remove(); dragGhostEl = null; }
  if (dragInsertLineEl) { dragInsertLineEl.remove(); dragInsertLineEl = null; }
  dragState = null;
}

function applyReorder(ctx, insertBefore) {
  if (ctx.type === 'lv') { lvApplyReorder(ctx, insertBefore); return; }
  const { target, pos } = insertBefore;

  if (ctx.type === 'streak') {
    const habits = data.streaks.habits;
    const fromIdx = habits.findIndex(h => h.id === ctx.habitId);
    const targetId = target.dataset.habitId;
    let toIdx = habits.findIndex(h => h.id === targetId);
    if (fromIdx < 0 || toIdx < 0 || fromIdx === toIdx) { dragState = null; renderStreaks(); return; }
    const [moved] = habits.splice(fromIdx, 1);
    toIdx = habits.findIndex(h => h.id === targetId);
    if (pos === 'after') toIdx++;
    habits.splice(Math.max(0, toIdx), 0, moved);
    saveData(data);
    dragState = null;
    renderStreaks();
  }
}

   STREAKS — PALETTE & HELPERS
