const HABIT_PALETTE = [
  { id:'coral',   hex:'#ff4d7e' },
  { id:'purple',  hex:'#a855f7' },
  { id:'teal',    hex:'#14b8a6' },
  { id:'blue',    hex:'#3b82f6' },
  { id:'green',   hex:'#22c55e' },
  { id:'orange',  hex:'#f97316' },
  { id:'yellow',  hex:'#eab308' },
  { id:'pink',    hex:'#ec4899' },
  { id:'red',     hex:'#ef4444' },
  { id:'indigo',  hex:'#6366f1' },
];

function habitColor(habit) {
  const p = HABIT_PALETTE.find(c => c.id === habit.color);
  return p ? p.hex : '#ff4d7e';
}

// Darken a hex color by a percentage (0-100)
function darkenHex(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, ((n >> 16) & 0xff) - Math.round(((n >> 16) & 0xff) * pct / 100));
  const g = Math.max(0, ((n >> 8) & 0xff) - Math.round(((n >> 8) & 0xff) * pct / 100));
  const b = Math.max(0, (n & 0xff) - Math.round((n & 0xff) * pct / 100));
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

// Get the level for a given date string (works for both binary and gradient)
function habitLevel(habit, ds) {
  if (habit.type === 'gradient') {
    const entry = habit.history.find(e => e.date === ds);
    return entry ? entry.level : 0;
  } else {
    return habit.history.includes(ds) ? 1 : 0;
  }
}

// Is today logged (level > 0)?
function isHabitDoneToday(habit) {
  return habitLevel(habit, todayStr()) > 0;
}

// Is yesterday logged (level > 0)?
function isHabitDoneYesterday(habit) {
  return habitLevel(habit, dateStr(addDays(new Date(), -1))) > 0;
}

/* ─────────────────────────────────────────────────────
   HABIT ANALYTICS — shared helpers

   All progress numbers are built from three ideas:
     1. A habit is only measured from the day it was created.
     2. "Expected" completions depend on the habit's own target
        (every day / N per week / specific weekdays), so a 3x-per-week
        habit and a daily habit are both at 100% when they hit target.
     3. Today is left out of the denominator until it's actually logged,
        so numbers don't sag every morning and recover every night.
   ───────────────────────────────────────────────────── */

// One pass over history -> Set of completed date strings. Avoids repeated
// O(n) scans when the analytics loops touch hundreds of days.
function historySet(habit) {
  const set = new Set();
  (habit.history || []).forEach(e => {
    if (habit.type === 'gradient') { if (e && e.level > 0) set.add(e.date); }
    else if (e) set.add(e);
  });
  return set;
}

const _habitStartCache = new Map();

function habitStart(habit) {
  const hist = habit.history || [];
  const cached = _habitStartCache.get(habit.id);
  if (cached && cached.len === hist.length && cached.created === habit.created) return cached.val;

  let earliest = null;
  for (const e of hist) {
    const d = (habit.type === 'gradient') ? (e && e.date) : e;
    if (!d) continue;
    if (earliest === null || d < earliest) earliest = d;  // 'YYYY-MM-DD' sorts lexically
  }
  let pick = habit.created || null;
  if (earliest && (!pick || earliest < pick)) pick = earliest;

  let val = null;
  if (pick) { const d = new Date(pick + 'T00:00:00'); if (!isNaN(d)) val = d; }
  _habitStartCache.set(habit.id, { len: hist.length, created: habit.created, val });
  return val;
}

function isRequiredDow(habit, dow) {
  if ((habit.frequency || 'daily') !== 'weekly') return true;
  return (habit.requiredDays || [0,1,2,3,4,5,6]).includes(dow);
}

/* Completions vs. expected over an inclusive date range, clamped to the
   habit's creation date. Returns { done, expected }. */
function windowStats(habit, hs, start, end) {
  const created = habitStart(habit);
  let s = new Date(start); s.setHours(0,0,0,0);
  if (created && s < created) s = new Date(created);
  const e = new Date(end); e.setHours(0,0,0,0);
  if (e < s) return { done: 0, expected: 0, days: 0 };

  const freq = habit.frequency || 'daily';
  let done = 0, expected = 0, days = 0;
  for (let d = new Date(s); d <= e; d = addDays(d, 1)) {
    days++;
    const hit = hs.has(dateStr(d));
    if (freq === 'weekly') {
      // Only the weekdays you committed to count, either way.
      if (isRequiredDow(habit, d.getDay())) { expected++; if (hit) done++; }
    } else if (hit) done++;
  }
  if (freq === 'daily') expected = days;
  else if (freq === 'custom') expected = (days / 7) * (habit.requiredCount || 1);
  return { done, expected, days };
}

function rateOf(st) {
  return st.expected > 0 ? Math.min(1, st.done / st.expected) : 0;
}

// Last day that should count toward stats: today if logged, else yesterday.
function statsEndDate(habit, hs, today) {
  return hs.has(dateStr(today)) ? new Date(today) : addDays(today, -1);
}

function flameSvg(fill, size) {
  return `<svg viewBox="0 0 24 24" fill="${fill}" stroke="none" xmlns="http://www.w3.org/2000/svg" style="width:${size}px;height:${size}px">
      <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
    </svg>`;
}

/* Week-based progress for weekly/custom habits: how far into this week's
   requirement you are, counting only days that have already happened. */
function weekProgress(habit, today) {
  const ws = getWeekSunday(today);
  const freq = habit.frequency || 'daily';
  if (freq === 'custom') {
    const need = habit.requiredCount || 1;
    let done = 0;
    for (let d = 0; d < 7; d++) {
      const day = addDays(ws, d);
      if (day > today) break;
      if (habitLevel(habit, dateStr(day)) > 0) done++;
    }
    return { done, need, elapsedNeed: need };
  }
  const required = habit.requiredDays || [];
  let done = 0, elapsed = 0;
  for (const dow of required) {
    const day = addDays(ws, dow);
    if (day > today) continue;
    elapsed++;
    if (habitLevel(habit, dateStr(day)) > 0) done++;
  }
  return { done, need: required.length, elapsedNeed: elapsed };
}

// Completed weeks out of the last N fully-elapsed weeks, clamped to creation.
function recentWeeksStats(habit, today, n) {
  const created = habitStart(habit);
  const thisWeekSun = getWeekSunday(today);
  let done = 0, total = 0;
  for (let w = 1; w <= n; w++) {
    const ws = addDays(thisWeekSun, -w * 7);
    if (created && addDays(ws, 6) < created) break;
    total++;
    if (isWeekComplete(habit, ws)) done++;
  }
  // Give credit for the current week the moment it's complete.
  if (isWeekComplete(habit, thisWeekSun)) { done++; total++; }
  return { done, total };
}

function allTimeWeeksStats(habit, today) {
  const created = habitStart(habit) || addDays(today, -7);
  const thisWeekSun = getWeekSunday(today);
  const firstWeekSun = getWeekSunday(created);
  const spanWeeks = Math.max(0, Math.round((thisWeekSun - firstWeekSun) / (7 * 86400000)));
  let done = 0, total = 0;
  for (let w = spanWeeks; w >= 1; w--) {
    total++;
    if (isWeekComplete(habit, addDays(thisWeekSun, -w * 7))) done++;
  }
  if (isWeekComplete(habit, thisWeekSun)) { done++; total++; }
  return { done, total };
}

// Small ↑/↓ trend line comparing two rates, in percentage points.
// Renders on its own line beneath the value, in the same slot as .stat-sub.
function trendChip(currentRate, priorRate) {
  const diff = Math.round(currentRate * 100) - Math.round(priorRate * 100);
  if (diff === 0) return `<div class="stat-chip" style="color:var(--text-dim)">→ even</div>`;
  const up = diff > 0;
  return `<div class="stat-chip" style="color:${up ? '#22c55e' : '#ef4444'}">${up ? '↑' : '↓'}${Math.abs(diff)}%</div>`;
}

function getWeekSunday(d) {
  const day = new Date(d); day.setHours(0,0,0,0);
  day.setDate(day.getDate() - day.getDay());
  return day;
}

function isWeekComplete(habit, weekSun) {
  const freq = habit.frequency || 'daily';
  if (freq === 'weekly') {
    const required = habit.requiredDays || [0,1,2,3,4,5,6];
    for (const dow of required) {
      const d = addDays(weekSun, dow);
      if (habitLevel(habit, dateStr(d)) === 0) return false;
    }
    return true;
  }
  if (freq === 'custom') {
    const need = habit.requiredCount || 1;
    let done = 0;
    for (let d = 0; d < 7; d++) {
      if (habitLevel(habit, dateStr(addDays(weekSun, d))) > 0) done++;
    }
    return done >= need;
  }
  return false; // daily handled separately
}

function isWeekInProgress(habit, weekSun) {
  // Returns true if the week has at least one completion so far (used for current week)
  const freq = habit.frequency || 'daily';
  if (freq === 'weekly') {
    const required = habit.requiredDays || [];
    const today = new Date(); today.setHours(0,0,0,0);
    let any = false;
    for (const dow of required) {
      const d = addDays(weekSun, dow);
      if (d > today) continue;
      if (habitLevel(habit, dateStr(d)) > 0) any = true;
    }
    return any;
  }
  if (freq === 'custom') {
    const today = new Date(); today.setHours(0,0,0,0);
    for (let d = 0; d < 7; d++) {
      const day = addDays(weekSun, d);
      if (day > today) break;
      if (habitLevel(habit, dateStr(day)) > 0) return true;
    }
    return false;
  }
  return false;
}

function getCurrentStreak(habit) {
  const freq = habit.frequency || 'daily';

  if (freq === 'daily') {
    // Original daily logic
    const today = new Date();
    let cursor;
    if (habitLevel(habit, dateStr(today)) > 0) {
      cursor = today;
    } else if (habitLevel(habit, dateStr(addDays(today, -1))) > 0) {
      cursor = addDays(today, -1);
    } else {
      return 0;
    }
    let count = 0;
    while (habitLevel(habit, dateStr(cursor)) > 0) {
      count++;
      cursor = addDays(cursor, -1);
    }
    return count;
  }

  // Weekly / Custom — count in weeks
  const today = new Date(); today.setHours(0,0,0,0);
  const thisWeekSun = getWeekSunday(today);
  let streak = 0;
  let w = 0;

  while (true) {
    const weekSun = addDays(thisWeekSun, -w * 7);
    const weekSat = addDays(weekSun, 6);
    const isCurrent = w === 0;
    const weekFullyPast = weekSat < today;

    if (isCurrent) {
      // Current week: only add to streak if fully complete.
      // If still in progress, don't add but don't break — streak carries from prior weeks.
      if (isWeekComplete(habit, weekSun)) {
        streak++;
      }
      // Always continue to check prior weeks regardless
    } else {
      if (isWeekComplete(habit, weekSun)) {
        streak++;
      } else {
        break;
      }
    }
    w++;
    // Safety: stop after 520 weeks (~10 years)
    if (w > 520) break;
    // Stop if we've gone before the habit was created
    if (habit.created && weekSun < new Date(habit.created + 'T12:00:00')) break;
  }
  return streak;
}

function getLongestStreak(habit) {
  const freq = habit.frequency || 'daily';
  if (freq === 'daily') {
    let dates;
    if (habit.type === 'gradient') {
      dates = habit.history.filter(e => e.level > 0).map(e => e.date).sort();
    } else {
      dates = [...habit.history].sort();
    }
    if (!dates.length) return 0;
    let longest = 1, current = 1;
    for (let i = 1; i < dates.length; i++) {
      const diff = Math.round((new Date(dates[i]) - new Date(dates[i-1])) / 86400000);
      if (diff === 1) { current++; longest = Math.max(longest, current); }
      else { current = 1; }
    }
    return longest;
  }
  // Weekly / Custom: find longest consecutive completed-week run.
  // Walk back from last fully-elapsed week. Stop after 520 weeks or when
  // we've gone back further than the earliest date in history.
  const today = new Date(); today.setHours(0,0,0,0);
  const thisWeekSun = getWeekSunday(today);
  // Find earliest history date to know when to stop
  let earliestDate = today;
  if (habit.type === 'gradient') {
    habit.history.forEach(e => { const d = new Date(e.date); if (d < earliestDate) earliestDate = d; });
  } else {
    habit.history.forEach(ds => { const d = new Date(ds + 'T12:00:00'); if (d < earliestDate) earliestDate = d; });
  }
  const earliestWeekSun = getWeekSunday(earliestDate);
  let longest = 0, current = 0;
  // Walk from oldest to newest (excluding current week)
  const totalWeeks = Math.round((thisWeekSun - earliestWeekSun) / (7 * 86400000));
  for (let w = totalWeeks; w >= 1; w--) {
    const weekSun = addDays(thisWeekSun, -w * 7);
    if (isWeekComplete(habit, weekSun)) {
      current++;
      longest = Math.max(longest, current);
    } else {
      current = 0;
    }
  }
  return longest;
}

function getTotalCompletions(habit) {
  if (habit.type === 'gradient') {
    return habit.history.filter(e => e.level > 0).length;
  }
  return habit.history.length;
}

/* ─────────────────────────────────────────────────────
   STREAKS — RENDER
   ───────────────────────────────────────────────────── */
/* ─────────────────────────────────────────────────────
   STREAK FIRE (Oct 2026)
   streakFire(habit) says which days (daily) or weeks (weekly/custom)
   belong to the current streak, and what state the habit is in:
     'blaze'   — logged today (weekly: this week's target is met)
     'smolder' — streak alive, today not logged yet (weekly: streak alive,
                 or something logged this week)
     'dead'    — no streak
   flame is what the flame square shows: the state for daily habits; for
   times-a-week habits 'half' once today is logged but the goal isn't met yet;
   for some-days habits 'blaze' when today is logged, like a daily habit.
   Grids mark each streak cell with fireAttrs(); fireDecorate() measures
   those cells and lays the bars: faint behind cards / calendars / the
   4-month grid, full fire over the compact week strip. A weekly habit's
   current week before its target gets a dashed outline ('inplay').
   ───────────────────────────────────────────────────── */
function streakFire(habit) {
  const freq = habit.frequency || 'daily';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tds = dateStr(today);
  const days = new Set(), weeks = new Set();
  if (freq === 'daily') {
    let cur = habitLevel(habit, tds) > 0 ? new Date(today)
      : habitLevel(habit, dateStr(addDays(today, -1))) > 0 ? addDays(today, -1) : null;
    while (cur && habitLevel(habit, dateStr(cur)) > 0) { days.add(dateStr(cur)); cur = addDays(cur, -1); }
    const state = habitLevel(habit, tds) > 0 ? 'blaze' : days.size ? 'smolder' : 'dead';
    return { freq, state, flame: state, days, weeks, curWeek: null, inPlay: false };
  }
  const thisWS = getWeekSunday(today);
  const curDone = isWeekComplete(habit, thisWS);
  if (curDone) weeks.add(dateStr(thisWS));
  const created = habit.created ? new Date(habit.created + 'T00:00:00') : null;
  for (let w = 1; w <= 520; w++) {
    const ws = addDays(thisWS, -7 * w);
    if (created && addDays(ws, 6) < created) break;
    if (!isWeekComplete(habit, ws)) break;
    weeks.add(dateStr(ws));
  }
  const loggedToday = habitLevel(habit, tds) > 0;
  let state = curDone ? 'blaze' : (weeks.size || isWeekInProgress(habit, thisWS)) ? 'smolder' : 'dead';
  if (state === 'dead' && loggedToday) state = 'smolder';   // logged on an off day: alive, not gray
  // Flame square. Times a week: dark → halfway (logged today, goal not met yet) → lit (goal met).
  // Some days: like a daily habit, lit when today is logged.
  const flame = freq === 'custom'
    ? (curDone ? 'blaze' : loggedToday ? 'half' : state)
    : (loggedToday ? 'blaze' : state === 'dead' ? 'dead' : 'smolder');
  return { freq, state, flame, days, weeks, curWeek: dateStr(thisWS), inPlay: !curDone && state !== 'dead' };
}

/* data-fire="key|kind" on a streak cell; cells sharing a key form one bar
   (split wherever the layout breaks: rows, or columns in the 4-month grid). */
function fireAttrs(info, ds) {
  const d = `data-d="${ds}"`;   // every cell carries its date, so effects can find the day
  if (!info) return d;
  const kind = info.state === 'blaze' ? 'blaze' : 'smolder';
  if (info.freq === 'daily') return info.days.has(ds) ? `data-fire="s|${kind}" ${d}` : d;
  const ws = dateStr(getWeekSunday(new Date(ds + 'T00:00:00')));
  if (info.weeks.has(ws)) return `data-fire="${ws}|${kind}" ${d}`;
  if (info.inPlay && ws === info.curWeek) return `data-fire="cur|inplay" ${d}`;
  return d;
}

/* Lays the bars inside every [data-fire-grid] under root. Positions are
   measured, so it must run after the grid is visible (it skips hidden ones;
   expanding a card or opening Edit history calls it again). */
function fireDecorate(root) {
  (root || document).querySelectorAll('[data-fire-grid]').forEach(grid => {
    grid.querySelectorAll(':scope > .fire-run').forEach(e => e.remove());
    if (!grid.offsetWidth) return;
    const vertical = grid.dataset.fireDir === 'col';
    const pad = +(grid.dataset.firePad || 3);
    const g = grid.getBoundingClientRect();
    const box = el => { const r = el.getBoundingClientRect(); return { l: r.left - g.left, t: r.top - g.top, w: r.width, h: r.height, d: el.dataset.d }; };
    const groups = new Map();
    grid.querySelectorAll('[data-fire]').forEach(el => {
      const k = el.dataset.fire;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(el);
    });
    groups.forEach((els, k) => {
      const kind = k.split('|')[1];
      const rects = els.map(box).filter(r => r.w > 0)
        .sort((a, b) => vertical ? (a.l - b.l || a.t - b.t) : (a.t - b.t || a.l - b.l));
      let seg = [];
      const flush = () => {
        if (!seg.length) return;
        const l = Math.min(...seg.map(r => r.l)), t = Math.min(...seg.map(r => r.t));
        const rr = Math.max(...seg.map(r => r.l + r.w)), bb = Math.max(...seg.map(r => r.t + r.h));
        const el = document.createElement('div');
        el.className = `fire-run ${kind === 'inplay' ? 'fr-inplay' : 'fr-outline fr-' + kind}`;
        el.style.cssText = `left:${l - pad}px;top:${t - pad}px;width:${rr - l + pad * 2}px;height:${bb - t + pad * 2}px`;
        el.dataset.from = seg[0].d; el.dataset.to = seg[seg.length - 1].d; el.dataset.n = seg.length;
        if (kind !== 'inplay') el.innerHTML = '<span class="flow"></span><i></i>';
        grid.appendChild(el);
        if (kind !== 'inplay' && k.split('|')[0] !== 's') {   // a finished week: a dim fiery wash behind its days
          const w = document.createElement('div'), wp = Math.max(0, pad - 1.5);
          w.className = `fire-run fr-wash fr-${kind}`;
          w.style.cssText = `left:${l - wp}px;top:${t - wp}px;width:${rr - l + wp * 2}px;height:${bb - t + wp * 2}px`;
          w.dataset.from = el.dataset.from; w.dataset.to = el.dataset.to; w.dataset.n = el.dataset.n;
          grid.appendChild(w);
        }
        seg = [];
      };
      rects.forEach(r => {
        const p = seg[seg.length - 1];
        const next = p && (vertical
          ? Math.abs(p.l - r.l) < 1 && r.t - (p.t + p.h) < p.h
          : Math.abs(p.t - r.t) < 1 && r.l - (p.l + p.w) < p.w);
        if (!next) flush();
        seg.push(r);
      });
      flush();
    });
  });
}
let fireResizeT = null;
window.addEventListener('resize', () => { clearTimeout(fireResizeT); fireResizeT = setTimeout(() => fireDecorate(document), 150); });

/* Log button and log-yesterday button, shared by cards and compact chips. */

function logBtnHtml(habit, small) {

const expandedHabits = new Set();

// Compact view collapses every habit into a two-column grid of chips so the
// whole list is visible at a glance. The choice sticks: whichever view you
// used last is the one the app opens in.
let compactMode = !!(data.prefs && data.prefs.compactMode);
let streaksEnter = true;   // play the cards' fade-in on the next draw only (arriving on the tab)

function setCompactMode(on) {
  if (compactMode === on) return;

  data.prefs.compactMode = compactMode;

}
function toggleCompactMode() { setCompactMode(!compactMode); }
const VIEW_ICON_CARDS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>';
const VIEW_ICON_COMPACT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="8" height="7" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="3" y="13" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg>';

function renderStreaks(opts) {
  const draw = () => {
    const page = document.getElementById('page-streaks');
    const habits = data.streaks.habits;
    page.classList.remove('lv-page-in', 'lv-page-back');
    page.classList.toggle('st-enter', streaksEnter);
    streaksEnter = false;
    if (lvAnim) { void page.offsetWidth; page.classList.add(lvAnim === 'in' ? 'lv-page-in' : 'lv-page-back'); lvAnim = null; }
    if (habitPageId) {
      const h = habits.find(x => x.id === habitPageId);
      if (h) { page.innerHTML = habitPageHtml(h); fireDecorate(page); fxKick(); return; }
      habitPageId = null;
    }

    const body = habits.length === 0
      ? `<div class="empty">No habits yet.<br>Add one to start a streak.</div>`
      : compactMode
        ? `<div class="compact-grid">${habits.map(h => renderCompactChip(h)).join('')}</div>`
        : `<div style="display:flex;flex-direction:column;gap:0">${habits.map(h => renderStreakCard(h)).join('')}</div>`;

    page.innerHTML = `
      <div class="section-block">
        <div class="section-header-row">
          <div class="section-label-wrap">
            <div class="section-label">Daily streaks</div>
          </div>
          ${habits.length ? `<div class="section-actions">
            <div class="view-seg" role="group" aria-label="View">
              <button class="${compactMode ? '' : 'on'}" onclick="setCompactMode(false)">${VIEW_ICON_CARDS}Cards</button>
              <button class="${compactMode ? 'on' : ''}" onclick="setCompactMode(true)">${VIEW_ICON_COMPACT}Compact</button>
            </div>
          </div>` : ''}
        </div>
        ${body}
        <button class="add-btn" onclick="openAddHabit()">＋ New habit</button>
      </div>
    `;

    if (!compactMode) {
      // Restore expanded state
      expandedHabits.forEach(id => {
        const card = page.querySelector(`.streak-card[data-habit-id="${id}"]`);
        if (card) card.classList.add('expanded');
      });
      attachStreakDragHandlers(page);
    }
    fireDecorate(page);
    fxKick();
  };
  if (opts && opts.raw) draw();
  else withScrollPreserved(draw);
}

/* ── Habit page: tapping a compact chip opens the full card on its own page,
   like opening a list on Checklist/Bucket. Only the ring on the chip logs. ── */
let habitPageId = null, habitPageScroll = 0;
function habitPageHtml(h) {
  const card = renderStreakCard(h)
    .replace('class="streak-card', 'class="streak-card expanded habit-page-card')
    .replace(`onclick="toggleHabitExpand('${h.id}')"`, '');
  return `<div class="lv-d-bar" style="--c:${habitColor(h)}"><button class="lv-back" onclick="closeHabitPage()">${LV_BACK}Streaks</button></div>${card}`;
}
function openHabitPage(id) {
  if (dragState) return;
  habitPageScroll = window.scrollY;
  habitPageId = id;
  lvAnim = 'in';
  renderStreaks({ raw: true });

}

  if (!habitPageId) return;
  habitPageId = null;
  lvAnim = 'back';
  renderStreaks({ raw: true });

function renderCompactChip(habit) {
  const col = habitColor(habit);
  const fire = streakFire(habit);
  const streak = getCurrentStreak(habit);
  const isWeekly = (habit.frequency || 'daily') !== 'daily';
  let sub;
  if (isWeekly) {
    const wp = weekProgress(habit, (() => { const t = new Date(); t.setHours(0,0,0,0); return t; })());
    sub = `${streak} wk · ${wp.done}/${wp.need}`;
  } else {
    sub = `${streak} ${streak === 1 ? 'day' : 'days'}`;
  }
  return `
    <div class="compact-chip${habitLevel(habit, todayStr()) > 0 ? ' logged' : ''} st-${fire.state}" data-habit-id="${habit.id}" onclick="openHabitPage('${habit.id}')" style="${hexVars(col)}">
      <div class="compact-chip-top">
        <div class="compact-flame fb fb-${fire.flame}">${flameSvg('currentColor', 16)}</div>

      </div>

/* Seven dots for the current week (Sun..Sat), same fill rules as the
   three-week grid on the full card but only the week you're in. */
function buildCompactWeek(habit, col, fire) {
  const today = new Date();
  const sunday = addDays(today, -today.getDay());
  const freq = habit.frequency || 'daily';
  const required = habit.requiredDays || [0, 1, 2, 3, 4, 5, 6];
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(sunday, i);
    const ds = dateStr(d);
    const isFuture = d > today;
    const isToday = ds === todayStr();
    const level = isFuture ? 0 : habitLevel(habit, ds);
    const isRequired = freq === 'weekly' ? required.includes(i) : true;

    let cls = 'compact-dot';
    if (isFuture) cls += ' future';
    if (isToday) cls += ' today-ring';
    let style = '';
    if (!isFuture && level > 0) {
      style = habit.type === 'binary'
        ? `background:${col}`
        : `background:${col};opacity:${(0.3 + (level / 4) * 0.7).toFixed(2)}`;
    } else if (!isFuture && isRequired && freq === 'weekly') {
      style = `box-shadow:inset 0 0 0 1.5px ${col};opacity:0.55`;
    }
    html += markWrap(`<div class="${cls}" style="${style}"></div>`, habit, ds, 'c', fireAttrs(fire, ds));
  }
  return html;
}

function renderStreakCard(habit) {
  const col = habitColor(habit);
  const streak = getCurrentStreak(habit);
  const fire = streakFire(habit);
  const todayLevel = habitLevel(habit, todayStr());

  // 3 rows (weeks) x 7 cols (Sun=0..Sat=6), oldest week first
  const today = new Date();
  const todayDow = today.getDay(); // 0=Sun
  const thisSunday = addDays(today, -todayDow);
  const gridStart = addDays(thisSunday, -2 * 7); // Sunday 2 weeks ago

  const dots = [];
  for (let week = 0; week < 3; week++) {
    for (let dayCol = 0; dayCol < 7; dayCol++) {
      const d = addDays(gridStart, week * 7 + dayCol);
      const ds = dateStr(d);
      const isFuture = d > today;
      const isToday = ds === todayStr();
      const level = isFuture ? 0 : habitLevel(habit, ds);
      dots.push({ level, isFuture, isToday, ds });
    }
  }

  const dotHtml = dots.map((dot, idx) => {
    const dow = idx % 7;
    const freq = habit.frequency || 'daily';
    const isRequired = freq === 'weekly'
      ? (habit.requiredDays || [0,1,2,3,4,5,6]).includes(dow)
      : true;
    let cls = 's-dot';
    if (dot.isFuture) cls += ' future';
    if (dot.isToday) cls += ' today-ring';
    if (!isRequired) cls += ' not-required';
    let style = '';
    if (!dot.isFuture && dot.level > 0) {
      if (habit.type === 'binary') {
        style = `background:${col};box-shadow:0 0 5px ${col}88`;
      } else {
        const op = (0.25 + (dot.level / 4) * 0.75).toFixed(2);
        style = `background:${col};opacity:${op}`;
      }
    } else if (!dot.isFuture && isRequired && (habit.frequency === 'weekly')) {
      // Required but not yet completed — show outline dot in habit color
      style = `border:1.5px solid ${col};opacity:0.6`;
    }
    return markWrap(`<div class="${cls}" style="${style}"></div>`, habit, dot.ds, 's', fireAttrs(fire, dot.ds));
  }).join('');

  const dowLabels = ['S','M','T','W','T','F','S'].map((d, i) => {
    const freq = habit.frequency || 'daily';
    const isRequired = freq === 'weekly' && (habit.requiredDays || []).includes(i);
    const style = isRequired
      ? `color:${col};font-weight:800;`
      : '';
    return `<div class="streak-dow-label" style="${style}">${d}</div>`;
  }).join('');

  return `
    <div class="streak-card${todayLevel > 0 ? ' logged' : ''} st-${fire.state}" data-habit-id="${habit.id}" style="${hexVars(col)}">
      <div class="streak-card-main" onclick="toggleHabitExpand('${habit.id}')">
        <div class="streak-card-body">
          <div class="streak-left-col">
            <div class="streak-name">${escHtml(habit.name)}</div>
            <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
              <div class="streak-flame-box fb fb-${fire.flame}">${flameSvg('currentColor', 22)}</div>
              <div class="streak-count-wrap">
                <div style="display:flex;align-items:baseline;gap:5px">
                  <div class="streak-big-number" style="color:${col}">${streak}</div>
                  ${(habit.frequency === 'custom' || habit.frequency === 'weekly') ? (() => {
                    const thisWS = getWeekSunday(new Date());
                    const tod = new Date(); tod.setHours(0,0,0,0);
                    let doneSoFar = 0, need = 0;
                    if (habit.frequency === 'custom') {
                      need = habit.requiredCount || 1;
                      for (let d = 0; d < 7; d++) {
                        const day = addDays(thisWS, d);
                        if (day > tod) break;
                        if (habitLevel(habit, dateStr(day)) > 0) doneSoFar++;
                      }
                    } else {
                      const required = habit.requiredDays || [];
                      need = required.length;
                      for (const dow of required) {
                        const day = addDays(thisWS, dow);
                        if (day > tod) continue;
                        if (habitLevel(habit, dateStr(day)) > 0) doneSoFar++;
                      }
                    }
                    return `<div style="font-size:13px;font-weight:700;color:${col};opacity:0.85;line-height:1">${doneSoFar}/${need}</div>`;
                  })() : ''}
                </div>
                <div class="streak-big-label">${habit.frequency && habit.frequency !== 'daily' ? 'weeks' : 'days'}</div>
              </div>
            </div>
          </div>
          <div style="flex:1"></div>
          <div class="streak-dot-section">
            <div class="streak-dow-labels">${dowLabels}</div>
            <div class="streak-dot-grid" data-fire-grid>${dotHtml}</div>
          </div>
          <div class="streak-controls">
            <button class="streak-dots-btn" onclick="event.stopPropagation();openHabitAction('${habit.id}')" aria-label="Habit options">⋮</button>
            <button class="streak-ring-btn" onclick="event.stopPropagation();logHabitDay('${habit.id}','today')" aria-label="Log today">${logBtnHtml(habit)}</button>
            ${ydayBtnHtml(habit, 'streak-yday-btn')}
          </div>
        </div>
      </div>
      ${renderStreakAnalytics(habit)}
    </div>
  `;
}

// habitWindowOffset: how many 4-month pages back from current (0 = most recent)
const habitWindowOffset = {};
const HEATMAP_MONTHS = 4;

function renderStreakAnalytics(habit) {
  const col = habitColor(habit);
  const hs = historySet(habit);
  const freq = habit.frequency || 'daily';
  const longest = getLongestStreak(habit);
  const today = new Date();
  today.setHours(0,0,0,0);
  const offset = habitWindowOffset[habit.id] || 0;
  // Month / 4 months toggle. The charts below always cover four months:
  // the 4-month page on screen, or the four months ending at the month shown.
  const monthView = ((data.prefs && data.prefs.calView) || 'month') === 'month';
  const monthOff = habitMonthOffset[habit.id] || 0;

  // Window: always full calendar months, 4 at a time.
  const windowEndMonth = monthView
    ? new Date(today.getFullYear(), today.getMonth() - monthOff + 1, 0)
    : new Date(today.getFullYear(), today.getMonth() - offset * HEATMAP_MONTHS + 1, 0);
  const windowStartMonth = new Date(windowEndMonth.getFullYear(), windowEndMonth.getMonth() - (HEATMAP_MONTHS - 1), 1);

  const startName = windowStartMonth.toLocaleDateString('en-US', { month: 'long', year: windowStartMonth.getFullYear() !== windowEndMonth.getFullYear() ? 'numeric' : undefined });
  const endName = windowEndMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const navLabel = `${startName} – ${endName}`;

  /* ── Stat boxes. These always describe the present; they do not follow
        the ‹ › pager (the heatmap and trend chart do). ── */
  const end = statsEndDate(habit, hs, today);
  const created = habitStart(habit);
  const fire = streakFire(habit);
  let statsHtml;

  if (freq === 'daily') {
    const s7      = windowStats(habit, hs, addDays(end, -6),  end);
    const s7prior = windowStats(habit, hs, addDays(end, -13), addDays(end, -7));
    const s30      = windowStats(habit, hs, addDays(end, -29), end);
    const s30prior = windowStats(habit, hs, addDays(end, -59), addDays(end, -30));
    const sAll = windowStats(habit, hs, created || addDays(end, -29), end);
    const allPct = sAll.expected > 0 ? Math.round(rateOf(sAll) * 100) : 0;

    statsHtml = `
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Record</div>
          <div class="stat-value" style="color:${col}">${longest}</div>
          <div class="stat-sub">${longest === 1 ? 'day' : 'days'}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">7 Day</div>
          <div class="stat-value" style="color:${col}">${s7.done}<span class="stat-den">/${Math.round(s7.expected)}</span></div>
          ${trendChip(rateOf(s7), rateOf(s7prior))}
        </div>
        <div class="stat-box">
          <div class="stat-label">30 Day</div>
          <div class="stat-value" style="color:${col}">${s30.done}<span class="stat-den">/${Math.round(s30.expected)}</span></div>
          ${trendChip(rateOf(s30), rateOf(s30prior))}
        </div>
        <div class="stat-box">
          <div class="stat-label">All time</div>
          <div class="stat-value" style="color:${col}">${allPct}%</div>
          <div class="stat-sub">${sAll.done}/${Math.round(sAll.expected)} days</div>
        </div>
      </div>`;
  } else {
    const wp = weekProgress(habit, today);
    const r12 = recentWeeksStats(habit, today, 12);
    const rAll = allTimeWeeksStats(habit, today);
    const allPct = rAll.total > 0 ? Math.round(rAll.done / rAll.total * 100) : 0;
    const weekDone = isWeekComplete(habit, getWeekSunday(today));
    const weekCol = weekDone ? '#22c55e' : col;

    statsHtml = `
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Record</div>
          <div class="stat-value" style="color:${col}">${longest}</div>
          <div class="stat-sub">${longest === 1 ? 'week' : 'weeks'}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">This Wk</div>
          <div class="stat-value" style="color:${weekCol}">${wp.done}<span class="stat-den">/${wp.need}</span></div>
          <div class="stat-sub">${weekDone ? 'target met' : `${Math.max(0, wp.need - wp.done)} to go`}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">12 Wks</div>
          <div class="stat-value" style="color:${col}">${r12.done}<span class="stat-den">/${r12.total}</span></div>
          <div class="stat-sub">on target</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">All time</div>
          <div class="stat-value" style="color:${col}">${allPct}%</div>
          <div class="stat-sub">${rAll.done}/${rAll.total} wks</div>
        </div>
      </div>`;
  }

  /* ── Heatmap (follows the pager) ── */
  const startDow = windowStartMonth.getDay();
  const gridStart = addDays(windowStartMonth, -startDow);
  const endDow = windowEndMonth.getDay();
  const gridEnd = addDays(windowEndMonth, 6 - endDow);
  const totalDays = Math.round((gridEnd - gridStart) / 86400000) + 1;
  const totalWeeks = Math.round(totalDays / 7);

  const weekCols = [];
  const monthLabels = [];
  const shownMonths = new Set();

  for (let w = 0; w < totalWeeks; w++) {
    const weekSun = addDays(gridStart, w * 7);
    const weekSat = addDays(weekSun, 6);
    if (weekSat < windowStartMonth || weekSun > windowEndMonth) continue;

    let monthLabelText = '';
    for (let d = 0; d < 7; d++) {
      const day = addDays(weekSun, d);
      if (day.getDate() === 1 && day >= windowStartMonth && day <= windowEndMonth) {
        const key = day.getFullYear() + '-' + day.getMonth();
        if (!shownMonths.has(key)) {
          shownMonths.add(key);
          monthLabelText = day.toLocaleDateString('en-US', { month: 'short' });
          break;
        }
      }
    }
    monthLabels.push(monthLabelText);

    let dotsHtml = '';
    for (let d = 0; d < 7; d++) {
      const day = addDays(weekSun, d);
      const ds = dateStr(day);
      const isOutOfWindow = day < windowStartMonth || day > windowEndMonth;
      const isFuture = day > today;
      const isToday = ds === dateStr(today);

      if (isOutOfWindow) { dotsHtml += `<div class="h-dot" style="background:transparent"></div>`; continue; }
      const level = isFuture ? 0 : habitLevel(habit, ds);
      let cls = 'h-dot';
      if (isFuture) cls += ' future';
      if (isToday) cls += ' today-ring';
      const beforeCreated = created && day < created;
      const hIsRequired = freq === 'weekly' && isRequiredDow(habit, day.getDay());
      let style = '';
      if (!isFuture && level > 0) {
        style = habit.type === 'binary'
          ? `background:${col};box-shadow:0 0 4px ${col}88`
          : `background:${col};opacity:${(0.25 + (level / 4) * 0.75).toFixed(2)}`;
      } else if (beforeCreated) {
        style = 'background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04)';
      } else if (!isFuture && hIsRequired) {
        style = `border:1.5px solid ${col};opacity:0.6`;
      }
      dotsHtml += markWrap(`<div class="${cls}" style="${style}"></div>`, habit, ds, 'h', fireAttrs(fire, ds));
    }
    weekCols.push(dotsHtml);
  }

  const weekColsHtml = weekCols.map((dots, i) =>
    `<div class="gh-week-col"><div class="gh-week-month-label">${monthLabels[i] || ''}</div>${dots}</div>`
  ).join('');

  const dowLabelsHtml = ['S','M','T','W','T','F','S'].map((l, i) => {
    const isReq = freq === 'weekly' && (habit.requiredDays || []).includes(i);
    return `<div class="gh-dow-label" style="${isReq ? `color:${col};font-weight:800;` : ''}">${l}</div>`;
  }).join('');

  /* ── Day-of-week performance, clamped to creation and to committed days ── */
  const dowDone = [0,0,0,0,0,0,0];
  const dowTotal = [0,0,0,0,0,0,0];
  let dowFrom = new Date(windowStartMonth);
  if (created && dowFrom < created) dowFrom = new Date(created);
  const dowTo = windowEndMonth < today ? windowEndMonth : today;
  for (let d = new Date(dowFrom); d <= dowTo; d = addDays(d, 1)) {
    const dow = d.getDay();
    if (freq === 'weekly' && !isRequiredDow(habit, dow)) continue;
    dowTotal[dow]++;
    if (hs.has(dateStr(d))) dowDone[dow]++;
  }

  const chartSvg = buildAdherenceChart(habit, hs, windowStartMonth, windowEndMonth, today, col);
  const dowSvg = buildDowChart(dowDone, dowTotal, col);

  return `
    <div class="streak-expanded">
      ${habit.description ? `<div class="habit-desc" style="border-left-color:${col}66">${escHtml(habit.description)}</div>` : ''}
      ${statsHtml}
      ${segHtml([{ v: 'month', label: 'Month' }, { v: 'range', label: '4 months' }], monthView ? 'month' : 'range', 'setCalView', 'seg-sm mc-toggle')}
      ${monthView ? monthCalHtml(habit, monthOff, 'view') : `
      <div class="heatmap-nav">
        <button class="heatmap-nav-btn" onclick="event.stopPropagation();shiftHeatmapWindow('${habit.id}', 1)">&#8249;</button>
        <div class="heatmap-nav-label">${navLabel}</div>
        <button class="heatmap-nav-btn" onclick="event.stopPropagation();shiftHeatmapWindow('${habit.id}', -1)" ${offset > 0 ? '' : 'disabled'}>&#8250;</button>
      </div>
      <div class="gh-heatmap-outer">
        <div class="gh-heatmap-dow-labels">${dowLabelsHtml}</div>
        <div class="gh-heatmap-grid" data-fire-grid data-fire-dir="col" data-fire-pad="1.5">${weekColsHtml}</div>
      </div>`}
      <div style="margin-top:14px">
        <div style="font-size:9px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px">Adherence trend</div>
        ${chartSvg}
      </div>
      <div style="margin-top:14px">
        <div style="font-size:9px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px">Best days of week</div>
        ${dowSvg}
      </div>
    </div>
  `;
}

/* Rolling 30-day adherence, sampled weekly.

   Every point answers the same question — "over the 30 days ending here, what
   share of my target did I hit?" — so the line only moves when behaviour moves.
   The old chart bucketed raw completions by calendar month, which meant the
   current month always started near zero and climbed, producing a cliff on the
   1st of every month that had nothing to do with performance. */
function buildAdherenceChart(habit, hs, wStart, wEnd, today, col) {
  const created = habitStart(habit);
  let start = new Date(wStart);
  if (created && start < created) start = new Date(created);
  const end = wEnd < today ? new Date(wEnd) : new Date(today);
  if (end < start) return `<div class="chart-empty">Nothing tracked in this range.</div>`;

  // Weekly samples, walking back from the most recent day in the window.
  const samples = [];
  for (let d = new Date(end); d >= start; d = addDays(d, -7)) samples.unshift(new Date(d));

  const pts = [];
  samples.forEach(d => {
    const st = windowStats(habit, hs, addDays(d, -29), d);
    if (st.days < 7) return;  // need at least a week of history behind a point
    pts.push({ d, pct: rateOf(st) * 100 });
  });

  if (pts.length < 2) {
    return `<div class="chart-empty">Not enough history yet.<br>This chart fills in after about two weeks of tracking.</div>`;
  }

  const W = 320, H = 88;
  const padL = 26, padR = 10, padT = 14, padB = 18;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const n = pts.length;

  const xs = pts.map((_, i) => padL + (i / (n - 1)) * chartW);
  const ys = pts.map(p => padT + chartH - (p.pct / 100) * chartH);

  function ctrl(p0, p1, p2, t = 0.35) {
    return {
      cp1x: p1[0] + (p2[0] - p0[0]) * t, cp1y: p1[1] + (p2[1] - p0[1]) * t,
      cp2x: p2[0] - (p2[0] - p0[0]) * t, cp2y: p2[1] - (p2[1] - p0[1]) * t
    };
  }
  let linePath = `M ${xs[0].toFixed(1)},${ys[0].toFixed(1)}`;
  for (let i = 1; i < n; i++) {
    const prev2 = [xs[Math.max(0, i-2)], ys[Math.max(0, i-2)]];
    const prev  = [xs[i-1], ys[i-1]];
    const cur   = [xs[i], ys[i]];
    const { cp1x, cp1y, cp2x, cp2y } = ctrl(prev2, prev, cur);
    linePath += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${cur[0].toFixed(1)},${cur[1].toFixed(1)}`;
  }
  const baseY = padT + chartH;
  const areaPath = `${linePath} L ${xs[n-1].toFixed(1)},${baseY} L ${xs[0].toFixed(1)},${baseY} Z`;

  const grids = [0, 50, 100].map(v => {
    const gy = padT + chartH - (v / 100) * chartH;
    return `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${W - padR}" y2="${gy.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="${padL - 4}" y="${(gy + 3.5).toFixed(1)}" fill="rgba(255,255,255,0.25)" font-size="7" text-anchor="end" font-family="Inter,sans-serif">${v}</text>`;
  }).join('');

  // Month labels wherever the month changes between samples.
  let lastMonth = -1;
  const labels = pts.map((p, i) => {
    const m = p.d.getMonth();
    if (m === lastMonth) return '';
    lastMonth = m;
    const x = Math.min(W - padR - 8, Math.max(padL, xs[i]));
    return `<text x="${x.toFixed(1)}" y="${H - 2}" fill="rgba(255,255,255,0.35)" font-size="8" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600">${p.d.toLocaleDateString('en-US', { month: 'short' })}</text>`;
  }).join('');

  const dots = pts.map((p, i) =>
    `<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i === n-1 ? 3 : 1.5}" fill="${col}" opacity="${i === n-1 ? 1 : 0.55}"/>`
  ).join('');

  const lastPct = Math.round(pts[n-1].pct);
  const labelX = Math.min(W - padR - 12, xs[n-1]);
  const labelY = Math.max(padT + 6, ys[n-1] - 7);
  const endLabel = `<text x="${labelX.toFixed(1)}" y="${labelY.toFixed(1)}" fill="${col}" font-size="8.5" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800">${lastPct}%</text>`;

  const gradId = `ad_${Math.random().toString(36).slice(2,7)}`;
  return `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;overflow:visible">
      <defs>
        <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${col}" stop-opacity="0.42"/>
          <stop offset="100%" stop-color="${col}" stop-opacity="0.03"/>
        </linearGradient>
      </defs>
      ${grids}
      <path d="${areaPath}" fill="url(#${gradId})"/>
      <path d="${linePath}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${endLabel}
      ${labels}
    </svg>
  `;
}

function buildDowChart(dowDone, dowTotal, col) {
  const W = 320, H = 64;
  const padT = 4, padB = 16;
  const chartW = W;
  const chartH = H - padT - padB;
  const labels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const n = 7;
  const barW = Math.floor(chartW / n) - 6;
  const rates = dowTotal.map((t, i) => t > 0 ? dowDone[i] / t : null);
  const active = rates.filter(r => r !== null);
  const maxRate = active.length ? Math.max(...active) : 0;

  const bars = labels.map((lbl, i) => {
    const rate = rates[i];
    const x = i * (chartW / n) + (chartW / n - barW) / 2;
    const labelEl = `<text x="${(x + barW/2).toFixed(1)}" y="${H - 2}" fill="rgba(255,255,255,0.3)" font-size="8" text-anchor="middle" font-family="Inter,sans-serif" font-weight="600">${lbl}</text>`;

    // Days the habit never asks for (or has no data for) get a muted dash.
    if (rate === null) {
      const y = padT + chartH - 2;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="2" rx="1" fill="rgba(255,255,255,0.09)"/>${labelEl}`;
    }
    const barH = Math.max(2, Math.round(rate * chartH));
    const y = padT + chartH - barH;
    const isTop = rate === maxRate && rate > 0;
    const opacity = rate === 0 ? 0.12 : 0.25 + rate * 0.75;
    const pctLabel = Math.round(rate * 100);
    return `
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${barH}" rx="3" fill="${col}" opacity="${opacity.toFixed(2)}"/>
      ${isTop ? `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="2" rx="1" fill="${col}"/>` : ''}
      ${rate > 0 ? `<text x="${(x + barW/2).toFixed(1)}" y="${(y - 3).toFixed(1)}" fill="${col}" opacity="${opacity.toFixed(2)}" font-size="7" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700">${pctLabel}%</text>` : ''}
      ${labelEl}`;
  }).join('');

  return `
    <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
      <line x1="0" y1="${padT + chartH}" x2="${W}" y2="${padT + chartH}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      ${bars}
    </svg>
  `;
}

function shiftHeatmapWindow(habitId, direction) {
  const current = habitWindowOffset[habitId] || 0;
  const next = current + direction;
  if (next < 0) return;
  habitWindowOffset[habitId] = next;
  renderStreaks();
}

/* ─────────────────────────────────────────────────────
   STREAKS — INTERACTIONS
   ───────────────────────────────────────────────────── */
function toggleHabitExpand(habitId) {
  if (expandedHabits.has(habitId)) {
    expandedHabits.delete(habitId);
  } else {
    expandedHabits.add(habitId);
  }
  const card = document.querySelector(`.streak-card[data-habit-id="${habitId}"]`);
  if (card) { card.classList.toggle('expanded', expandedHabits.has(habitId)); fireDecorate(card); }
}

/* Log today or yesterday. Binary habits toggle; 1–4 habits step
   0 → 1 → 2 → 3 → 4 → 0. Plays the streak effects after redrawing. */
function logHabitDay(habitId, which, level) {
  if (dragState) return;
  const habit = data.streaks.habits.find(h => h.id === habitId);
  if (!habit) return;
  const ds = which === 'yday' ? dateStr(addDays(new Date(), -1)) : todayStr();
  if (habit.type === 'gradient' && which === 'yday' && level === undefined) { ydaySheet(habit); return; }
  const before = streakFire(habit);
  const prev = habitLevel(habit, ds);
  let next;
  if (habit.type === 'gradient') {
    next = level !== undefined ? level : prev >= 4 ? 0 : prev + 1;
    if (next === prev) return;
    const idx = habit.history.findIndex(e => e.date === ds);
    if (!next) { if (idx >= 0) habit.history.splice(idx, 1); }
    else if (idx >= 0) habit.history[idx].level = next;
    else habit.history.push({ date: ds, level: next });
  } else {
    next = prev ? 0 : 1;
    const idx = habit.history.indexOf(ds);
    if (idx >= 0) habit.history.splice(idx, 1); else habit.history.push(ds);
  }
  saveData(data);
  renderStreaks();
  fxHabitLogged(habit, ds, which, prev, next, before);
}

/* Log yesterday on a 1–4 habit: pick the level, or Clear. Rendered into #lvSheet
   like the other menus, in the habit's color. */
function ydaySheet(habit) {
  const yd = addDays(new Date(), -1), L = habitLevel(habit, dateStr(yd));
  const id = habit.id;
  lvSheetBtns = [0, 1, 2, 3, 4].map(n => ({ fn: () => logHabitDay(id, 'yday', n) }));
  const ov = document.getElementById('lvSheet');
  sheetColor(ov, habitColor(habit));
  const when = yd.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  ov.innerHTML = `<div class="modal"><div class="fs-eyebrow">Log yesterday</div><div class="modal-title">${escHtml(habit.name)}</div>
    <div class="yd-sub">${when}${L ? ` · logged at ${L}` : ''}</div>
    <div class="yd-levels">${[1, 2, 3, 4].map(n => `<button class="yd-lvl${n === L ? ' on' : ''}" onclick="lvSheetPick(${n})" aria-label="Level ${n}">${n}<i>${[1, 2, 3, 4].map(k => `<s class="${k <= n ? 'f' : ''}"></s>`).join('')}</i></button>`).join('')}</div>
    <div class="modal-actions">${L ? '<button class="btn-cancel yd-clear" onclick="lvSheetPick(0)">Clear</button>' : ''}<button class="btn-cancel" onclick="lvSheetClose()">Cancel</button></div></div>`;
  ov.classList.add('open');
}
// Older names, kept so nothing that still calls them breaks.
function toggleBinaryToday(habitId) { logHabitDay(habitId, 'today'); }
function cycleGradientToday(habitId) { logHabitDay(habitId, 'today'); }
function markYesterday(habitId) { logHabitDay(habitId, 'yday'); }

/* ─────────────────────────────────────────────────────
   HABITS — add / edit / delete
   How often maps onto the stored frequency:
     Every day    -> frequency 'daily'
     Some days    -> frequency 'weekly' + requiredDays
     Times a week -> frequency 'custom' + requiredCount
   ───────────────────────────────────────────────────── */
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
let fsHabit = null;   // { id, color, freq: 'daily'|'days'|'count', days, count, type, note, noteOpen }

function openAddHabit() {
  const used = data.streaks.habits.map(h => h.color);
  fsHabit = { id: null, color: HABIT_PALETTE.map(p => p.id).find(c => !used.includes(c)) || 'coral',
              freq: 'daily', days: [1, 2, 3, 4, 5], count: 3, type: 'binary', note: '', noteOpen: false };
  fsOpenHabit('New habit', '', 'Create habit');
}
function openEditHabit(habitId) {
  const h = data.streaks.habits.find(x => x.id === habitId); if (!h) return;
  const f = h.frequency || 'daily';
  fsHabit = { id: h.id, color: h.color || 'coral',
              freq: f === 'weekly' ? 'days' : f === 'custom' ? 'count' : 'daily',
              days: h.requiredDays ? [...h.requiredDays] : [1, 2, 3, 4, 5], count: h.requiredCount || 3,
              type: h.type || 'binary', note: h.description || '', noteOpen: !!h.description };
  fsOpenHabit('Edit habit', h.name, 'Save');
}
function fsOpenHabit(title, name, saveLabel) {
  fsOpen({
    color: paletteHex(fsHabit.color), eyebrow: 'Streaks', title, saveLabel,
    body: `<input class="modal-input fs-enter" id="fsName" value="${escHtml(name)}" placeholder="Read 20 minutes" autocomplete="off">
      <div class="fs-label">Color</div><div id="fsColors"></div>
      <div class="fs-label">How often</div><div id="fsFreq"></div>
      <div class="fs-label">Track as</div><div id="fsType"></div>
      <div id="fsNote"></div>`,
    onMount: () => { fsRenderHabit(); fsRenderNote(); },
    focus: fsHabit.id ? null : '#fsName',
    onSave: fsSaveHabit
  });
}
function fsRenderHabit() {
  const s = fsHabit;
  sheetColor(document.getElementById('formSheet'), paletteHex(s.color));
  document.getElementById('fsColors').innerHTML = fsSwatchesHtml(s.color, 'fsPickHabitColor');
  let sub = '', hint = '';
  if (s.freq === 'days') {
    sub = `<div class="fs-days">${'SMTWTFS'.split('').map((l, i) =>
      `<button class="fs-day${s.days.includes(i) ? ' on' : ''}" onclick="fsToggleHabitDay(${i})" aria-label="${DAY_NAMES[i]}">${l}</button>`).join('')}</div>`;
    hint = 'Do it on each of these days. Missing one resets the streak.';
  } else if (s.freq === 'count') {
    sub = `<div class="fs-stepper"><button onclick="fsHabitCount(-1)" aria-label="Fewer">−</button>
      <div><b>${s.count}</b><span>${s.count === 1 ? 'day' : 'days'} a week</span></div>
      <button onclick="fsHabitCount(1)" aria-label="More">+</button></div>`;
    hint = `Any ${s.count} ${s.count === 1 ? 'day' : 'days'} in the week count.`;
  } else {
    hint = 'Every day keeps the streak alive.';
  }
  document.getElementById('fsFreq').innerHTML =
    segHtml([{ v: 'daily', label: 'Every day' }, { v: 'days', label: 'Some days' }, { v: 'count', label: 'Times a week' }], s.freq, 'fsPickHabitFreq') +
    sub + `<div class="fs-hint">${hint}</div>`;
  document.getElementById('fsType').innerHTML =
    segHtml([{ v: 'binary', label: 'Done or not' }, { v: 'gradient', label: 'Scale 1–4' }], s.type, 'fsPickHabitType') +
    `<div class="fs-hint">${s.type === 'binary' ? 'One tap marks the day done.' : 'Tap to step through 1–4 for how well it went.'}</div>`;
}
function fsRenderNote() {
  const s = fsHabit, el = document.getElementById('fsNote');
  el.innerHTML = s.noteOpen
    ? `<div class="fs-label">Note</div><textarea class="modal-input fs-text" id="fsNoteIn" rows="2" placeholder="Why this habit matters to you" oninput="fsHabit.note=this.value">${escHtml(s.note)}</textarea>`
    : `<button class="fs-link" onclick="fsHabit.noteOpen=true;fsRenderNote();document.getElementById('fsNoteIn').focus()">＋ Add a note</button>`;
}
function fsPickHabitColor(c) { fsHabit.color = c; fsRenderHabit(); }
function fsPickHabitFreq(v) { fsHabit.freq = v; fsRenderHabit(); }
function fsPickHabitType(v) { fsHabit.type = v; fsRenderHabit(); }
function fsToggleHabitDay(i) {
  const d = fsHabit.days, at = d.indexOf(i);
  if (at >= 0) { if (d.length > 1) d.splice(at, 1); } else { d.push(i); d.sort((a, b) => a - b); }
  fsRenderHabit();
}
function fsHabitCount(delta) { fsHabit.count = Math.max(1, Math.min(7, fsHabit.count + delta)); fsRenderHabit(); }

function fsSaveHabit() {
  const name = fsNeedText(document.getElementById('fsName'));
  if (!name) return false;
  const s = fsHabit, note = (s.note || '').trim();
  const frequency = s.freq === 'days' ? 'weekly' : s.freq === 'count' ? 'custom' : 'daily';
  let h;
  if (!s.id) {
    h = { id: 'h_' + uid(), name, type: s.type, color: s.color, frequency, history: [], created: todayStr() };
    data.streaks.habits.push(h);
  } else {
    h = data.streaks.habits.find(x => x.id === s.id); if (!h) return;
    h.name = name; h.color = s.color;
    if (h.type !== s.type) {
      // Binary keeps date strings; gradient keeps {date, level}. Converting
      // binary -> gradient marks old days as a full 4.
      if (s.type === 'gradient') h.history = (h.history || []).map(ds => ({ date: ds, level: 4 }));
      else h.history = (h.history || []).filter(e => e.level > 0).map(e => e.date);
    }
    h.type = s.type;
    h.frequency = frequency;
  }
  if (note) h.description = note; else delete h.description;
  delete h.requiredDays; delete h.requiredCount;
  if (frequency === 'weekly') h.requiredDays = [...s.days];
  if (frequency === 'custom') h.requiredCount = s.count;
  saveData(data);
  renderStreaks();
}

function openHabitAction(habitId) {
  const habit = data.streaks.habits.find(h => h.id === habitId); if (!habit) return;
  lvSheet(habit.name, [
    { label: 'Edit habit', icon: 'edit', fn: () => openEditHabit(habitId) },
    { label: 'Edit history', icon: 'history', fn: () => openHistoryEdit(habitId) },
    { label: 'Delete habit', icon: 'trash', danger: true, fn: () => deleteHabit(habitId) }
  ], null, habitColor(habit));
}

/* Deleting a habit takes its whole history with it, so it gets the same
   Undo toast as list items. Undo puts it back where it was. */
function deleteHabit(habitId) {
  const habits = data.streaks.habits;
  const idx = habits.findIndex(h => h.id === habitId);
  if (idx < 0) return;
  const [habit] = habits.splice(idx, 1);
  const wasExpanded = expandedHabits.delete(habitId);
  if (habitPageId === habitId) { habitPageId = null; lvAnim = 'back'; }
  saveData(data);
  renderStreaks();
  lvToast(`Deleted ${habit.name}`, () => {
    data.streaks.habits.splice(Math.min(idx, data.streaks.habits.length), 0, habit);
    if (wasExpanded) expandedHabits.add(habitId);
  });
}

/* ─────────────────────────────────────────────────────
   MONTH CALENDAR
   One calendar, two uses:
     'view' — in a habit's details, next to the 4-month grid (Month / 4 months toggle)
     'edit' — in Edit history, where tapping a day logs or marks it
   Swipe left/right (or the arrows) to change month.
   ───────────────────────────────────────────────────── */
const habitMonthOffset = {};   // habitId -> months back from this month (view mode)
let calSwipedAt = 0;           // a swipe shouldn't also count as a tap on a day

function monthCalHtml(habit, offset, mode) {
  const col = habitColor(habit);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tds = todayStr();
  const first = new Date(today.getFullYear(), today.getMonth() - offset, 1);
  const nDays = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const created = habitStart(habit);
  const freq = habit.frequency || 'daily';
  const edit = mode === 'edit';
  const fire = streakFire(habit);
  let cells = '', done = 0, counted = 0;
  for (let i = 0; i < first.getDay(); i++) cells += '<div class="mc-cell mc-pad"></div>';
  for (let d = 1; d <= nDays; d++) {
    const day = new Date(first.getFullYear(), first.getMonth(), d);
    const ds = dateStr(day);
    const future = day > today, isToday = ds === tds;
    const level = future ? 0 : habitLevel(habit, ds);
    const before = !!(created && day < created);
    const req = freq === 'weekly' && isRequiredDow(habit, day.getDay());
    if (!future && !before && (freq !== 'weekly' || req) && !(isToday && level === 0)) { counted++; if (level > 0) done++; }
    let cls = 'mc-cell', style = '';
    if (future) cls += ' future';
    else if (level > 0) {
      cls += ' on';
      style = habit.type === 'gradient'
        ? `background:color-mix(in srgb, ${col} ${Math.round(35 + level / 4 * 65)}%, var(--surface3))`
        : `background:${col}`;
    } else if (before && !edit) cls += ' before';
    else if (req) cls += ' req';
    if (isToday) cls += ' today';
    const m = habitMark(habit, ds);
    // A marked day shows its marker in place of the number, like the other grids.
    const inner = m ? `<span class="mc-mk">${markIconHtml(m)}</span>` : d;
    if (m) cls += ' marked';
    const fa = fireAttrs(fire, ds);
    cells += edit && !future
      ? `<button class="${cls}" style="${style}" ${fa} onclick="historyDotTap('${ds}')" aria-label="${LV_MON[day.getMonth()]} ${d}">${inner}</button>`
      : `<div class="${cls}" style="${style}" ${fa}>${inner}</div>`;
  }
  const label = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  const shift = edit ? 'shiftHistoryEditWindow' : `shiftMonthCal.bind(null,'${habit.id}')`;
  const dows = 'SMTWTFS'.split('').map((l, i) =>
    `<div class="mc-dow"${freq === 'weekly' && isRequiredDow(habit, i) ? ` style="color:${col}"` : ''}>${l}</div>`).join('');
  let foot = '';
  if (!edit) {
    const scope = offset === 0 ? 'this month' : 'in ' + first.toLocaleDateString('en-US', { month: 'long' });
    foot = freq === 'custom'
      ? `${done} ${done === 1 ? 'day' : 'days'} logged ${scope}`
      : `${done} of ${counted} ${freq === 'weekly' ? 'planned days' : 'days'} ${scope}`;
    foot = `<div class="mc-foot">${foot}</div>`;
  }
  return `<div class="mcal mcal-${mode}" data-habit="${habit.id}" data-mode="${mode}" style="${hexVars(col)}">
    <div class="heatmap-nav">
      <button class="heatmap-nav-btn" onclick="event.stopPropagation();(${shift})(1)" aria-label="Previous month">&#8249;</button>
      <div class="heatmap-nav-label">${label}</div>
      <button class="heatmap-nav-btn" onclick="event.stopPropagation();(${shift})(-1)" ${offset > 0 ? '' : 'disabled'} aria-label="Next month">&#8250;</button>
    </div>
    <div class="mc-grid" data-fire-grid>${dows}${cells}</div>${foot}</div>`;
}

function shiftMonthCal(habitId, dir) {
  const next = (habitMonthOffset[habitId] || 0) + dir;
  if (next < 0) return;
  habitMonthOffset[habitId] = next;
  renderStreaks();
}

function setCalView(v) {
  if (!data.prefs) data.prefs = {};
  data.prefs.calView = v;
  saveData(data);
  renderStreaks();
}

(function setupCalSwipe() {
  let cal = null, sx = 0, sy = 0;
  document.addEventListener('touchstart', e => {
    cal = (e.touches.length === 1 && e.target.closest) ? e.target.closest('.mcal') : null;
    if (cal) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!cal) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy, c = cal;
    cal = null;
    if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    calSwipedAt = performance.now();
    const dir = dx > 0 ? 1 : -1;   // swipe right = earlier month
    if (c.dataset.mode === 'edit') shiftHistoryEditWindow(dir);
    else shiftMonthCal(c.dataset.habit, dir);
  }, { passive: true });
})();

/* ─────────────────────────────────────────────────────
   HABIT HISTORY EDIT
   Behind the ⋮ menu on purpose, so a stray tap on the habit's
   own calendar can't change history.
   ───────────────────────────────────────────────────── */
let historyEditCtx = null; // { habitId, windowOffset (months back), mode }

function openHistoryEdit(habitId) {
  const habit = data.streaks.habits.find(h => h.id === habitId);
  if (!habit) return;
  historyEditCtx = { habitId, windowOffset: 0, mode: 'log' };
  sheetColor(document.getElementById('historyEditModal'), habitColor(habit));
  document.getElementById('historyEditTitle').textContent = habit.name;
  syncHistoryEditMode();
  renderHistoryEditHeatmap();
  lockScroll();
  document.getElementById('historyEditModal').classList.add('open');
  requestAnimationFrame(() => fireDecorate(document.getElementById('historyEditHeatmap')));
}

function closeHistoryEdit() {
  const m = document.getElementById('historyEditModal');
  if (!m.classList.contains('open')) return;
  m.classList.remove('open');
  closeMarkPicker();
  historyEditCtx = null;
  unlockScroll();
  renderStreaks();
}
SHEET_CLOSERS.historyEditModal = closeHistoryEdit;

function shiftHistoryEditWindow(dir) {
  if (!historyEditCtx) return;
  const next = historyEditCtx.windowOffset + dir;
  if (next < 0) return;
  historyEditCtx.windowOffset = next;
  renderHistoryEditHeatmap();
}

function toggleHistoryDot(ds) {
  if (!historyEditCtx) return;
  const habit = data.streaks.habits.find(h => h.id === historyEditCtx.habitId);
  if (!habit) return;
  if (habit.type === 'gradient') {   // 1–4 habits: each tap steps the day 0 → 1 → 2 → 3 → 4 → 0
    const idx = habit.history.findIndex(e => e.date === ds);
    const cur = idx >= 0 ? habit.history[idx].level : 0;
    if (cur >= 4) habit.history.splice(idx, 1);
    else if (idx >= 0) habit.history[idx].level = cur + 1;
    else habit.history.push({ date: ds, level: 1 });
  } else {
    const idx = habit.history.indexOf(ds);
    if (idx >= 0) habit.history.splice(idx, 1);
    else habit.history.push(ds);
  }
  saveData(data);
  renderHistoryEditHeatmap();
}

function renderHistoryEditHeatmap() {
  if (!historyEditCtx) return;
  const habit = data.streaks.habits.find(h => h.id === historyEditCtx.habitId);
  if (!habit) return;
  const box = document.getElementById('historyEditHeatmap');
  box.innerHTML = monthCalHtml(habit, historyEditCtx.windowOffset, 'edit');
  fireDecorate(box);
}

/* ─────────────────────────────────────────────────────
   DAY MARKERS
   A habit can carry one marker per day in habit.marks = { 'YYYY-MM-DD': value }.
   value is 'up' (green arrow), 'down' (red arrow) or an emoji string.
   Kept separate from history on purpose: logging or unlogging a day never
   touches its marker, and marks work on days you missed too. Placed from
   the Mark mode in Edit history. Rides along in export/import because the
   import deep-copies habits wholesale.
   ───────────────────────────────────────────────────── */
// Quick-pick emoji for the marker picker. Edit freely: one emoji per string.
// 12 fills two rows of six.
const MARK_EMOJI = ['⭐', '🔥', '💪', '🎉', '🏆', '💯', '🤒', '😴', '✈️', '🍕', '⚠️', '🌧️'];

const MARK_UP_SVG = '<svg viewBox="0 0 12 12" aria-label="Good day"><path d="M6 1 L11 6.6 H7.7 V11 H4.3 V6.6 H1 Z" fill="#34d399"/></svg>';
const MARK_DOWN_SVG = '<svg viewBox="0 0 12 12" aria-label="Rough day"><path d="M6 11 L11 5.4 H7.7 V1 H4.3 V5.4 H1 Z" fill="#f87171"/></svg>';

function habitMark(habit, ds) {
  return (habit && habit.marks && habit.marks[ds]) || null;
}

function markIconHtml(m) {
  if (m === 'up') return MARK_UP_SVG;
  if (m === 'down') return MARK_DOWN_SVG;
  return `<span class="mk-emoji">${escHtml(m)}</span>`;
}

// Wrap a dot's HTML with its marker, if it has one. where: 's' card grid,
// 'h' heatmap, 'c' compact week strip.
function markWrap(dotHtml, habit, ds, where, attrs) {
  const m = habitMark(habit, ds);
  if (!m) return attrs ? dotHtml.replace(/^<div /, `<div ${attrs} `) : dotHtml;
  return `<div class="mk-cell mk-${where}" ${attrs || ''}>${dotHtml}<span class="mk-icon">${markIconHtml(m)}</span></div>`;
}

function setHistoryEditMode(mode) {
  if (!historyEditCtx) return;
  historyEditCtx.mode = mode;
  syncHistoryEditMode();
}

function syncHistoryEditMode() {
  const mode = (historyEditCtx && historyEditCtx.mode) || 'log';
  document.querySelectorAll('#historyEditMode .seg-btn').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
  document.getElementById('historyEditHint').textContent = mode === 'mark'
    ? 'Tap any day to add or change its marker. Done or not, any day can be marked.'
    : (historyEditCtx && (data.streaks.habits.find(h => h.id === historyEditCtx.habitId) || {}).type === 'gradient')
      ? 'Tap a day to step it through 1, 2, 3, 4, then off.'
      : 'Tap any day to turn it on or off.';
}

function historyDotTap(ds) {
  if (!historyEditCtx || performance.now() - calSwipedAt < 400) return;
  if (historyEditCtx.mode === 'mark') openMarkPicker(ds);
  else toggleHistoryDot(ds);
}

let markPickerDate = null;

function openMarkPicker(ds) {
  if (!historyEditCtx) return;
  markPickerDate = ds;
  const habit = data.streaks.habits.find(h => h.id === historyEditCtx.habitId);
  sheetColor(document.getElementById('markPicker'), habit && habitColor(habit));
  renderMarkPicker();
  document.getElementById('markPicker').classList.add('open');
}

function closeMarkPicker() {
  markPickerDate = null;
  const el = document.getElementById('markPicker');
  if (el) el.classList.remove('open');
}
SHEET_CLOSERS.markPicker = closeMarkPicker;

function renderMarkPicker() {
  const habit = historyEditCtx && data.streaks.habits.find(h => h.id === historyEditCtx.habitId);
  if (!habit || !markPickerDate) return;
  const cur = habitMark(habit, markPickerDate);
  const d = new Date(markPickerDate + 'T00:00:00');
  const title = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric',
    year: d.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined });
  const done = habitLevel(habit, markPickerDate) > 0;
  const opt = (val, inner, label) =>
    `<button class="mark-opt${cur === val ? ' selected' : ''}" onclick="setDayMark(${escHtml(JSON.stringify(val))})"${label ? ` aria-label="${label}"` : ''}>${inner}</button>`;
  document.getElementById('markPickerBody').innerHTML = `
    <div class="modal-title">${title}</div>
    <div class="mark-picker-sub">${escHtml(habit.name)} · ${done ? 'done' : 'not done'}</div>
    <div class="mark-arrows">
      ${opt('up', MARK_UP_SVG + 'Good day')}
      ${opt('down', MARK_DOWN_SVG + 'Rough day')}
    </div>
    <div class="mark-emoji-grid">${MARK_EMOJI.map(e => opt(e, escHtml(e), e)).join('')}</div>
    <div class="modal-actions" style="margin-top:16px">
      ${cur ? '<button class="btn-cancel mark-remove" onclick="setDayMark(null)">Remove marker</button>' : ''}
      <button class="btn-cancel" onclick="closeMarkPicker()">Cancel</button>
    </div>
  `;
}

function setDayMark(val) {
  const habit = historyEditCtx && data.streaks.habits.find(h => h.id === historyEditCtx.habitId);
  if (!habit || !markPickerDate) return;
  if (val) {
    if (!habit.marks) habit.marks = {};
    habit.marks[markPickerDate] = val;
  } else if (habit.marks) {
    delete habit.marks[markPickerDate];
    if (!Object.keys(habit.marks).length) delete habit.marks;
  }
  saveData(data);
  closeMarkPicker();
  renderHistoryEditHeatmap();
}

/* ─────────────────────────────────────────────────────
   FOCUS BUTTON
   ───────────────────────────────────────────────────── */
let fabExpanded = false;
let fabCollapseTimer = null;

function handleFabClick() {
  const btn = document.getElementById('focusBtn');
  if (!fabExpanded) {
    // First tap: expand. Off the Goals tab it also takes you there, so
    // ending Focus mode always means looking at your goals first.
    if (currentTab !== 'goals') switchTab('goals');
    fabExpanded = true;
    btn.classList.add('expanded');
    // Auto-collapse after 3 seconds if not tapped again
    fabCollapseTimer = setTimeout(() => {
      fabExpanded = false;
      btn.classList.remove('expanded');
    }, 3000);
  } else {
    // Second tap while expanded: trigger shortcut
    clearTimeout(fabCollapseTimer);
    fabExpanded = false;
    btn.classList.remove('expanded');
    releaseFocus();
  }
}

function releaseFocus() {
  window.location.href = 'shortcuts://run-shortcut?name=End%20Focus%20Mode';
  const btn = document.getElementById('focusBtn');
  btn.classList.remove('expanded');
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
  btn.style.boxShadow = '0 6px 24px rgba(34,197,94,0.45)';
  setTimeout(() => {
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L9.5 9.5L2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z"/></svg><span class="focus-btn-label">Goals reviewed</span>`;
    btn.style.background = '';
    btn.style.boxShadow = '';
  }, 2000);
}

/* ─────────────────────────────────────────────────────
   SETTINGS / BACKUP
   ───────────────────────────────────────────────────── */
function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
SHEET_CLOSERS.settingsModal = closeSettings;

function exportData() {
  // Comprehensive backup: includes all tabs, all habits, all sections,
  // all folder customizations (color/icon), all item deadlines and checked states.
  // version 4 indicates the schema as of this build (folders w/ color+icon,
  // habits w/ frequency/requiredDays/requiredCount/type/color).
  const payload = {
    version: 4,
    exported: new Date().toISOString(),
    app: 'streaks',
    data: JSON.parse(JSON.stringify(data))
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `streaks-backup-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  closeSettings();
}

document.getElementById('importInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const incoming = parsed.data || parsed;

      let restored = null;

      // Format 1: very old (pre-tabs) — has longterm/shortterm/checklist/later/bucket arrays
      if (incoming.longterm || incoming.shortterm || incoming.later) {
        const migrated = JSON.parse(JSON.stringify(defaultData));
        if (incoming.longterm) migrated.goals.sections[0].items = incoming.longterm.map(i => ({ id: uid(), text: i.text, checked: !!i.checked }));
        if (incoming.shortterm) migrated.goals.sections[1].items = incoming.shortterm.map(i => ({ id: uid(), text: i.text, checked: !!i.checked }));
        if (incoming.checklist && Array.isArray(incoming.checklist)) migrated.checklist.sections[0].items = incoming.checklist.map(i => ({ id: uid(), text: i.text, checked: !!i.checked }));
        if (incoming.later) migrated.checklist.sections[1].items = incoming.later.map(i => ({ id: uid(), text: i.text, checked: !!i.checked, deadline: i.deadline }));
        if (incoming.bucket && Array.isArray(incoming.bucket)) migrated.bucket.sections[0].items = incoming.bucket.map(i => ({ id: uid(), text: i.text, checked: !!i.checked }));
        restored = migrated;
      }
      // Format 2: v2/v3 — has goals/checklist/bucket as objects with .sections
      else if (incoming.goals && incoming.checklist && incoming.bucket) {
        // Deep clone and preserve EVERYTHING — sections, folders (with color/icon),
        // items (with deadline/checked), habits (with all fields), and any future fields.
        restored = {
          goals: JSON.parse(JSON.stringify(incoming.goals)),
          checklist: JSON.parse(JSON.stringify(incoming.checklist)),
          bucket: JSON.parse(JSON.stringify(incoming.bucket)),
          streaks: incoming.streaks ? JSON.parse(JSON.stringify(incoming.streaks)) : { habits: [] },
          // Streaky's own state (greeting date, no-repeat bags). Falls back to the
          // current session's state so restoring an older backup doesn't make him
          // re-greet or forget which lines he's already used.
          streaky: incoming.streaky
            ? JSON.parse(JSON.stringify(incoming.streaky))
            : (data.streaky || { lastGreeted: null, lastWeekly: null, bags: {}, lastChecklistNudge: null }),
          // View preference is a property of this device, not the backup.
          prefs: data.prefs || { compactMode: false }
        };
        // Migrate any old section type names just in case
        const migrateSections = (tab) => {
          if (!tab || !tab.sections) return;
          tab.sections.forEach(s => {
            if (s.type === 'longterm') s.type = 'goals';
            else if (s.type === 'standard' || s.type === 'deadline') s.type = 'tasks';
            // Recurse into folder inner sections
            if (s.type === 'folder' && s.sections) {
              s.sections.forEach(inner => {
                if (inner.type === 'longterm') inner.type = 'goals';
                else if (inner.type === 'standard' || inner.type === 'deadline') inner.type = 'tasks';
              });
              // Ensure folder has color and icon (defaults if missing)
              if (!s.color) s.color = 'coral';
              if (!s.icon) s.icon = 'folder';
            }
          });
        };
        migrateSections(restored.goals);
        migrateSections(restored.checklist);
        migrateSections(restored.bucket);
        lvMigrate(restored);
        // Ensure habits is an array
        if (!restored.streaks.habits || !Array.isArray(restored.streaks.habits)) {
          restored.streaks.habits = [];
        }
      } else {
        closeSettings(); lvToast("That file isn't a Streaks backup"); return;
      }

      // Show what's being restored before confirming
      const habitCount = restored.streaks.habits.length;
      const sectionCount = (restored.goals.sections.length + restored.checklist.sections.length + restored.bucket.sections.length);
      let itemCount = 0;
      const countItems = (sections) => {
        sections.forEach(s => {
          if (s.type === 'folder' && s.sections) {
            s.sections.forEach(inner => { if (inner.items) itemCount += inner.items.length; });
          } else if (s.items) {
            itemCount += s.items.length;
          }
        });
      };
      countItems(restored.goals.sections);
      countItems(restored.checklist.sections);
      countItems(restored.bucket.sections);

      const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
      closeSettings();
      setTimeout(() => confirmSheet({
        title: 'Restore this backup?',
        body: `It has ${plural(habitCount, 'habit')}, ${plural(sectionCount, 'list')} and ${plural(itemCount, 'item')}. ` +
              `<b>Everything on this device will be replaced.</b>`,
        confirmLabel: 'Replace and restore',
        fn: () => {
          data = restored;
          lvOpen = null; habitPageId = null; expandedHabits.clear();
          saveData(data);
          render();
          lvToast('Backup restored');
        }
      }), 200);
    } catch (err) {
      closeSettings();
      lvToast("Couldn't read that file. Pick a Streaks backup .json");
    }
  };
  reader.readAsText(file);
  this.value = '';
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // Close only the top sheet (the marker picker sits above Edit history).
  const open = [...document.querySelectorAll('.modal-overlay.open')].reverse();
  if (open.length) { open.sort((a, b) => (+getComputedStyle(b).zIndex || 0) - (+getComputedStyle(a).zIndex || 0)); closeOverlay(open[0]); }
});

/* ─────────────────────────────────────────────────────
   HEADER SPACER — keeps flow content clear of the fixed header
   ───────────────────────────────────────────────────── */
function syncHeaderSpacer() {
  const header = document.querySelector('.header');
  const spacer = document.getElementById('headerSpacer');
  if (!header || !spacer) return;
  const h = header.getBoundingClientRect().height;
  if (h > 0) spacer.style.height = h + 'px';
}
window.addEventListener('resize', syncHeaderSpacer);
window.addEventListener('orientationchange', () => setTimeout(syncHeaderSpacer, 120));
window.addEventListener('load', syncHeaderSpacer);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeaderSpacer).catch(() => {});
if (window.ResizeObserver) {
  const hdr = document.querySelector('.header');
  if (hdr) new ResizeObserver(syncHeaderSpacer).observe(hdr);
}
