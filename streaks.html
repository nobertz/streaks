/* ─────────────────────────────────────────────────────
   STREAKY — state helpers
   ───────────────────────────────────────────────────── */
function streakyState() {
  if (!data.streaky) {
    data.streaky = {
      lastGreeted: null, lastWeekly: null, bags: {}, lastChecklistNudge: null,
      habitIdea: null, holiday: null
    };
  }
  if (!data.streaky.bags) data.streaky.bags = {};
  // habitIdea / holiday may be absent on state restored from an older
  // backup; both readers treat a missing value as "redraw for today".
  return data.streaky;
}

/* No-repeat bag: draw an index, reshuffling only when the bag empties. */
function streakyDraw(bagName, poolSize) {
  const st = streakyState();
  let bag = st.bags[bagName];
  if (!Array.isArray(bag) || bag.length === 0) {
    bag = Array.from({ length: poolSize }, (_, i) => i);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [bag[i], bag[j]] = [bag[j], bag[i]];
    }
  }
  bag = bag.filter(i => i < poolSize);
  if (bag.length === 0) bag = [0];
  const pick = bag.pop();
  st.bags[bagName] = bag;
  return pick;
}

/* Habit idea of the day. Drawn once per calendar day and pinned, so
   summoning Streaky repeatedly shows the same idea instead of burning
   through the bag. Bounds-checked in case the array shrinks. */
function streakyTodayIdea() {
  const st = streakyState();
  const today = todayStr();
  const cur = st.habitIdea;
  if (cur && cur.date === today && typeof cur.idx === 'number' &&
      cur.idx >= 0 && cur.idx < STREAKY_HABIT_IDEAS.length) {
    return STREAKY_HABIT_IDEAS[cur.idx];
  }
  const idx = streakyDraw('habitIdea', STREAKY_HABIT_IDEAS.length);
  st.habitIdea = { date: today, idx: idx };
  saveData(data);
  return STREAKY_HABIT_IDEAS[idx];
}

/* ─────────────────────────────────────────────────────
   STREAKY — special dates (major US holidays + birthday)
   ───────────────────────────────────────────────────── */
function nthWeekdayOfMonth(year, month, weekday, n) {
  const first = new Date(year, month, 1);
  const offset = (weekday - first.getDay() + 7) % 7;
  return new Date(year, month, 1 + offset + (n - 1) * 7);
}
function lastWeekdayOfMonth(year, month, weekday) {
  const last = new Date(year, month + 1, 0);
  const offset = (last.getDay() - weekday + 7) % 7;
  return new Date(year, month + 1, 0 - offset);
}

function streakySpecialDate(d) {
  const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  const is = (dt) => dt.getMonth() === m && dt.getDate() === day;

  // Birthday takes priority over everything
  if (m === 10 && day === 26) return { key: 'birthday' };

  if (m === 0 && day === 1) return { key: 'newyear' };
  if (is(nthWeekdayOfMonth(y, 0, 1, 3))) return { key: 'mlk' };
  if (m === 1 && day === 14) return { key: 'valentines' };
  if (is(nthWeekdayOfMonth(y, 1, 1, 3))) return { key: 'presidents' };
  if (m === 2 && day === 17) return { key: 'stpatricks' };
  if (is(nthWeekdayOfMonth(y, 4, 0, 2))) return { key: 'mothers' };
  if (is(lastWeekdayOfMonth(y, 4, 1))) return { key: 'memorial' };
  if (is(nthWeekdayOfMonth(y, 5, 0, 3))) return { key: 'fathers' };
  if (m === 6 && day === 4) return { key: 'july4' };
  if (is(nthWeekdayOfMonth(y, 8, 1, 1))) return { key: 'labor' };
  if (m === 9 && day === 31) return { key: 'halloween' };
  if (m === 10 && day === 11) return { key: 'veterans' };
  if (is(nthWeekdayOfMonth(y, 10, 4, 4))) return { key: 'thanksgiving' };
  if (m === 11 && day === 24) return { key: 'christmaseve' };
  if (m === 11 && day === 25) return { key: 'christmas' };
  if (m === 11 && day === 31) return { key: 'nye' };
  return null;
}

/* Holidays with more than one variant used to reroll on every summon.
   Pin the chosen variant for the day, same as the habit idea. */
function streakyHolidayLine(key) {
  const st = streakyState();
  const today = todayStr();
  const cur = st.holiday;
  if (cur && cur.date === today && cur.key === key && typeof cur.text === 'string') {
    return cur.text;
  }
  const text = streakySpecialLine(key);
  if (text) { st.holiday = { date: today, key: key, text: text }; saveData(data); }
  return text;
}

/* Birthday line pulls real stats from your data */
function streakyBirthdayLine() {
  const habits = data.streaks.habits || [];
  const year = new Date().getFullYear();
  let logged = 0, best = 0;
  const days = new Set();
  habits.forEach(h => {
    const entries = (h.history || []).map(e => (typeof e === 'string' ? e : e.date));
    entries.forEach(ds => { if (ds && ds.startsWith(year + '-')) days.add(ds); });
    const s = getCurrentStreak(h);
    if (s > best) best = s;
  });
  logged = days.size;
  if (logged === 0) {
    return "IT'S NOVEMBER 26TH. It's YOUR DAY. You've got this in the bag today. Happy birthday!";
  }
  return `IT'S THE 26TH! You've logged something on ${logged} ${logged === 1 ? 'day' : 'days'} this year and your best run right now is ${best}. I made a graph in my head and it's beautiful. Happy birthday.`;
}

/* ─────────────────────────────────────────────────────
   STREAKY — habit notes built from real data
   Every day: quip + habit idea. Notes are occasional:
     • one note on roughly 2–3 days a week (STREAKY_NOTE_* below)
     • the same note can't come back for STREAKY_NOTE_COOLDOWN days
     • milestones always show on the day they happen
     • each kind of note has several phrasings, drawn from no-repeat bags
   The day's note is pinned, so summoning him again repeats it rather
   than rolling a new one.
   TO ADD PHRASINGS: push more functions into STREAKY_NOTES below.
   ───────────────────────────────────────────────────── */
const STREAKY_NOTE_MIN_GAP = 2;     // days between note days, at least
const STREAKY_NOTE_MAX_GAP = 4;     // by this many days, a note always shows (if there is one)
const STREAKY_NOTE_CHANCE = 0.55;   // chance of a note on days in between
const STREAKY_NOTE_COOLDOWN = 7;    // days before the same note can return
// Some notes stay true for days (a weekly habit sits at "12 weeks" all week), so they wait longer.
const STREAKY_NOTE_COOLDOWN_BY_TYPE = { mile: 30, mileBig: 30, near: 10 };

/* Count how many of the last `days` days (ending yesterday) were logged.
   Today is excluded everywhere in here — at 7am it carries no information
   and including it made every stat sag each morning. */
function streakyHitCount(habit, days, endOffset) {
  const off = endOffset || 1;
  let n = 0;
  for (let i = off; i < off + days; i++) {
    if (habitLevel(habit, dateStr(addDays(new Date(), -i))) > 0) n++;
  }
  return n;
}

/* Days since this habit was last logged (0 = today, null = never). */
function streakyDaysSinceLast(habit) {
  for (let i = 0; i <= 60; i++) {
    if (habitLevel(habit, dateStr(addDays(new Date(), -i))) > 0) return i;
  }
  return null;
}

function streakyDaysBetween(a, b) {
  return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
}

  const daily = habits.filter(h => (h.frequency || 'daily') === 'daily');
  const MILES_D = [7, 14, 21, 30, 50, 75, 100, 150, 200, 365];
  const MILES_W = [4, 8, 12, 26, 52, 104];   // weekly habits count streaks in weeks
  const add = (key, type, mood, v) => out.push({ key, type, mood, v });

  habits.forEach(h => {
    const wk = (h.frequency || 'daily') !== 'daily';
    const miles = wk ? MILES_W : MILES_D, unit = wk ? 'weeks' : 'days', one = wk ? 'week' : 'day';
    const s = getCurrentStreak(h), name = escHtml(h.name);
    // 1. Just hit a milestone
    if (miles.includes(s)) add('mile_' + h.id + '_' + s, s >= 100 ? 'mileBig' : 'mile', 'pumped', { name, n: s, unit });
    // 2. One step from a milestone — forward-looking, not a warning
    const next = miles.find(m => m === s + 1);
    if (next) add('near_' + h.id + '_' + next, 'near', 'pumped', { name, s, next, unit, one });
    // 3. Gone quiet — probably worth deciding about
    const since = streakyDaysSinceLast(h);
    if (since !== null && since >= 10) add('quiet_' + h.id, 'quiet', 'normal', { name, since });
    // 4. A running streak worth a shout-out (used only when nothing else is new)
    if (s >= (wk ? 2 : 3) && !miles.includes(s) && !next) add('status_' + h.id, 'status', 'normal', { name, s, unit });
  });

  daily.forEach(h => {
    const name = escHtml(h.name);
    const recent = streakyHitCount(h, 14, 1), prior = streakyHitCount(h, 14, 15);
    // 5. Slipping against its own recent baseline
    if (prior >= 7 && recent <= prior - 4) add('slip_' + h.id, 'slip', 'uncertain', { name, recent, prior });
    // 6. Quietly improving
    if (recent >= prior + 4 && recent >= 7) add('rise_' + h.id, 'rise', 'pumped', { name, recent, prior });

    // 7. The weekday you miss most (needs real history to mean anything)
    const miss = [0,0,0,0,0,0,0], seen = [0,0,0,0,0,0,0];
    for (let i = 1; i <= 56; i++) {
      const d = addDays(new Date(), -i);
      if (h.created && dateStr(d) < h.created) break;
      seen[d.getDay()]++;
      if (habitLevel(h, dateStr(d)) === 0) miss[d.getDay()]++;
    }
    if (seen.every(x => x >= 4)) {
      let worst = 0;
      for (let i = 1; i < 7; i++) if (miss[i] > miss[worst]) worst = i;
      const total = miss.reduce((a, b) => a + b, 0);
      if (total >= 4 && miss[worst] >= 3 && miss[worst] >= total * 0.35) {
        const days = ['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
        add('dow_' + h.id + '_' + worst, 'dow', 'normal', { name, day: days[worst], m: miss[worst], t: total });
      }
    }

    const s = getCurrentStreak(h);
    // 8. Comeback after a real gap
    if (s >= 3 && s <= 6 && streakyHitCount(h, 10, s + 1) === 0) add('back_' + h.id, 'back', 'pumped', { name, s });
    // 9. A streak that recently ended
    if (s === 0 && !isHabitDoneYesterday(h)) {
      const since = streakyDaysSinceLast(h);
      if (since !== null && since >= 2 && since <= 5) add('broke_' + h.id, 'broke', 'uncertain', { name, since });
    }
  });

  // 10. Your most reliable habit
  if (daily.length >= 2) {
    const scored = daily.map(h => ({ h, n: streakyHitCount(h, 30, 1) })).sort((a, b) => b.n - a.n);
    if (scored[0].n >= 22 && scored[0].n > scored[1].n + 3) add('best_' + scored[0].h.id, 'best', 'pumped', { name: escHtml(scored[0].h.name), n: scored[0].n });
  }

  // 11. Clean sweep yesterday
  if (daily.length >= 2 && daily.every(h => isHabitDoneYesterday(h))) add('sweep_' + dateStr(addDays(new Date(), -1)), 'sweep', 'pumped', {});

  return out;
}

/* Only genuinely urgent late in the day, and once per evening. In the
   morning "today isn't logged yet" is true of every habit you own. */
function streakyEveningJeopardy() {
  if (new Date().getHours() < STREAKY_EVENING_HOUR) return null;
  const st = streakyState(), today = todayStr();
  if (st.jeopardyDate === today) return null;
  const at = (data.streaks.habits || [])
    .filter(h => (h.frequency || 'daily') === 'daily')
    .filter(h => habitLevel(h, today) === 0 && isHabitDoneYesterday(h))
    .map(h => ({ h, streak: getCurrentStreak(h) }))
    .filter(x => x.streak >= 3)
    .sort((a, b) => b.streak - a.streak);
  if (!at.length) return null;
  st.jeopardyDate = today;
  saveData(data);
  return { mood: 'uncertain', text: streakyNoteText('jeopardy', { name: escHtml(at[0].h.name), n: at[0].streak }) };
}

/* Today's note, decided once per day and pinned. Returns a line or null. */
function streakyTodayNote() {
  const st = streakyState(), today = todayStr();
  if (st.note && st.note.date === today) return st.note.line || null;
  if (!st.seenObs) st.seenObs = {};
  const seen = st.seenObs;
  const fresh = streakyObservations().filter(o => !seen[o.key] ||
    streakyDaysBetween(seen[o.key], today) >= (STREAKY_NOTE_COOLDOWN_BY_TYPE[o.type] || STREAKY_NOTE_COOLDOWN));
  const gap = st.lastNoteDay ? streakyDaysBetween(st.lastNoteDay, today) : 99;
  let pick = fresh.find(o => o.type === 'mile' || o.type === 'mileBig');   // milestones land on the day
  if (!pick && fresh.length && gap >= STREAKY_NOTE_MIN_GAP &&
      (gap >= STREAKY_NOTE_MAX_GAP || Math.random() < STREAKY_NOTE_CHANCE)) {
    // Real observations before status shout-outs, then least recently shown, then random.
    const age = o => seen[o.key] || '0';
    fresh.sort((a, b) => (a.type === 'status') - (b.type === 'status') || age(a).localeCompare(age(b)) || Math.random() - 0.5);
    pick = fresh[0];
  }
  let line = null;
  if (pick) {
    line = { text: streakyNoteText(pick.type, pick.v), mood: pick.mood };
    seen[pick.key] = today;
    st.lastNoteDay = today;
  }
  st.note = { date: today, line };
  // Forget keys we haven't used in a while so the object can't grow forever.
  const cutoff = dateStr(addDays(new Date(), -120));
  Object.keys(seen).forEach(k => { if (seen[k] < cutoff) delete seen[k]; });
  saveData(data);
  return line;
}

function streakyContextLines() {
  if (!(data.streaks.habits || []).length) {
    return [{ text: "You've got no habits set up yet. Add one and I'll have something to bug you about.", mood: 'normal' }];
  }
  const out = [];
  const j = streakyEveningJeopardy();
  if (j) out.push(j);
  const note = streakyTodayNote();
  if (note) out.push(note);
  return out;
}

/* ─────────────────────────────────────────────────────
   STREAKY — checklist and bucket surfacing
     • Urgent (overdue, or due today/tomorrow), from ANY checklist list:
       every day until done.
     • Random picks happen on "pick days", every 2–3 days, and alternate:
         checklist pick day → 3 items from the PINNED checklist only
                              (so grocery lists never come up)
         bucket pick day    → 2–3 unstarred items from any collection
       A pick day never has both. Picks are pinned for the day, so a
       summon shows the same ones. Items he just mentioned sit out for
       STREAKY_PICK_REST days before they can come up again.
   ───────────────────────────────────────────────────── */
const STREAKY_CHECK_PICKS = 3;
const STREAKY_BUCKET_PICKS = [2, 3];          // min, max
const STREAKY_PICK_GAP = [2, 3];              // days between pick days, min, max
const STREAKY_PICK_REST = { checklist: 6, bucket: 21 };
const STREAKY_SOON_DAYS = 1;   // "coming up" = due within this many days (0 = today only)

function streakyItemRank(item, today) {
  let rank = 2, days = null;
  if (item.deadline) {
    days = Math.round((new Date(item.deadline + 'T00:00:00') - today) / 86400000);
    if (days < 0) rank = 0;
    else if (days <= STREAKY_SOON_DAYS) rank = 1;
  }
  return { rank, days };
}

/* Unchecked items from the given checklist entries (all of them by default). */
function streakyChecklistPool(entries) {
  const out = [];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  (entries || (data.checklist && data.checklist.sections) || []).forEach(entry => {
    lvSecs(entry).forEach(section => (section.items || []).forEach(item => {
      if (item.checked) return;
      out.push(Object.assign({ item, section, entry }, streakyItemRank(item, today)));
    }));
  });
  return out;
}

/* Overdue / due soon from any list. */
function streakyUrgentItems() {
  return streakyChecklistPool().filter(p => p.rank < 2)
    .sort((a, b) => a.days - b.days)
    .slice(0, 6);
}

/* Random-pick candidates: the pinned checklist only (urgent ones already show). */
function streakyPinnedPool() {
  const pinned = lvPinned('checklist');
  return pinned ? streakyChecklistPool([pinned]).filter(p => p.rank === 2) : [];
}

/* Unstarred, unshelved bucket items from every collection. */
function streakyBucketPool() {
  const out = [];
  ((data.bucket && data.bucket.sections) || []).forEach(entry => lvSecs(entry).forEach(section =>
    (section.items || []).forEach(item => { if (!item.checked && !item.shelved) out.push({ item, section, entry }); })));
  return out;
}

function streakyRandInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

/* Choose ids for one kind, preferring items he hasn't mentioned lately. */
function streakyDrawPicks(kind) {
  const st = streakyState(), today = todayStr();
  const pool = kind === 'checklist' ? streakyPinnedPool() : streakyBucketPool();
  if (!pool.length) return [];
  const seen = st.mentioned || {};
  const n = kind === 'checklist' ? STREAKY_CHECK_PICKS : streakyRandInt(STREAKY_BUCKET_PICKS[0], STREAKY_BUCKET_PICKS[1]);
  const rested = p => !seen[p.item.id] || streakyDaysBetween(seen[p.item.id], today) >= STREAKY_PICK_REST[kind];
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  let picks = shuffled.filter(rested).slice(0, n);
  if (picks.length < n) {   // not enough rested items: bring back the least recently mentioned
    const rest = shuffled.filter(p => !picks.includes(p))
      .sort((a, b) => (seen[a.item.id] || '').localeCompare(seen[b.item.id] || ''));
    picks = picks.concat(rest.slice(0, n - picks.length));
  }
  return picks.map(p => p.item.id);
}

/* Today's picks: { date, kind: 'checklist' | 'bucket' | null, ids }.
   Decided on the first call of the day and pinned. */
function streakyTodayPicks() {
  const st = streakyState(), today = todayStr();
  if (st.picks && st.picks.date === today) return st.picks;
  let picks = { date: today, kind: null, ids: [] };
  if (!st.pickNext || today >= st.pickNext) {
    const order = st.lastPickKind === 'checklist' ? ['bucket', 'checklist'] : ['checklist', 'bucket'];
    for (const kind of order) {
      const ids = streakyDrawPicks(kind);
      if (ids.length) { picks = { date: today, kind, ids }; break; }
    }
    if (picks.kind) {
      st.lastPickKind = picks.kind;
      st.pickNext = dateStr(addDays(new Date(), streakyRandInt(STREAKY_PICK_GAP[0], STREAKY_PICK_GAP[1])));
      if (!st.mentioned) st.mentioned = {};
      picks.ids.forEach(id => { st.mentioned[id] = today; });
      const cutoff = dateStr(addDays(new Date(), -120));
      Object.keys(st.mentioned).forEach(k => { if (st.mentioned[k] < cutoff) delete st.mentioned[k]; });
    }
  }
  st.picks = picks;
  delete st.checkWeek;   // replaced by pick days (Oct 2026)
  saveData(data);
  return picks;
}

/* "your To-do list", but not "your Groceries List list". */
function streakyListName(entry) {
  const n = escHtml(entry ? entry.name : 'to-do');
  return /list$/i.test(entry ? entry.name : '') ? `your ${n}` : `your ${n} list`;
}

const STREAKY_CHECK_INTROS = {
  overdue: [
    n => `${n} thing${n === 1 ? '' : 's'} past due. I'm holding ${n === 1 ? 'it' : 'them'} up. LOOK AT ${n === 1 ? 'IT' : 'THEM'}.`,
    n => `Still on the list and past due. Check ${n === 1 ? 'it' : 'them'} off right here and I'll stop bringing ${n === 1 ? 'it' : 'them'} up. Promise.`,
    n => `Overdue alert. ${n === 1 ? 'This one is' : 'These are'} waiting on you. Want to knock ${n === 1 ? 'it' : 'them'} out now?`,
    n => `I'm going to keep showing you ${n === 1 ? 'this' : 'these'} until ${n === 1 ? "it's" : "they're"} done. That's not a threat. That's a service.`
  ],
  soon: [
    () => "Coming up fast. Check these off here when they're done.",
    () => "Heads up, these are due soon. Get ahead of them.",
    () => "Due today or tomorrow. Let's get them off your plate.",
    () => "Deadline radar is beeping. These are close."
  ],
  picks: [
    list => `I pulled a few things off ${list}. Any of these doable today?`,
    list => `Here's a little sample from ${list}. Check off whatever's done.`,
    list => `I grabbed a few from ${list}. Pick one and knock it out.`,
    list => `Lucky draw from ${list}! These came up. Check them off right here when they're done.`
  ],
  bucket: [
    () => "Remember these? You've wanted to do them for a while.",
    () => "Don't forget, these are still on your someday list.",
    () => "Little daydream break. Here's some stuff you've wanted to do.",
    () => "Bucket list check-in. Any of these feel a little closer than they used to?",
    () => "You told me you wanted to do these someday. Just making sure someday doesn't forget."
  ]
};
function streakyCheckIntro(kind, n) {
  const pool = STREAKY_CHECK_INTROS[kind];
  return pool[streakyDraw('check_' + kind, pool.length)](n);
}

/* The checklist and bucket lines for this visit. Urgent every time; the
   day's picks (checklist OR bucket, never both) on pick days. */
function streakyListLines() {
  const lines = [];
  const urgent = streakyUrgentItems();
  if (urgent.length) {
    const late = urgent.filter(p => p.rank === 0).length;
    lines.push({ kind: 'checklist', picks: urgent, mood: late ? 'uncertain' : 'normal',
                 text: late ? streakyCheckIntro('overdue', late) : streakyCheckIntro('soon') });
  }
  const today = streakyTodayPicks();
  if (today.kind === 'checklist') {
    const pool = streakyPinnedPool();
    const picks = today.ids.map(id => pool.find(p => p.item.id === id)).filter(Boolean);
    if (picks.length) lines.push({ kind: 'checklist', picks, mood: 'normal', text: streakyCheckIntro('picks', streakyListName(lvPinned('checklist'))) });
  } else if (today.kind === 'bucket') {
    const pool = streakyBucketPool();
    const picks = today.ids.map(id => pool.find(p => p.item.id === id)).filter(Boolean);
    if (picks.length) lines.push({ kind: 'bucket', picks, mood: 'chill', text: streakyCheckIntro('bucket') });
  }
  return lines;
}

/* ─────────────────────────────────────────────────────
   STREAKY — weekly recap
   ───────────────────────────────────────────────────── */
function weekSundayStr(d) {
  const s = addDays(d, -d.getDay());
  return dateStr(s);
}

const STREAKY_RECAPS = {
  up: [
    v => `Week's in. ${v.last} logs, up ${v.diff} from the week before. THAT'S THE TREND LINE I WANT TO SEE. Do it again.`,
    v => `Last week: ${v.last} logs. That's ${v.diff} more than the week before. Up and to the right, baby.`,
    v => `${v.last} logs last week, beating the week before by ${v.diff}. Let's make this week the new record holder.`
  ],
  even: [
    v => `Week's in. ${v.last} logs, exactly the same as the week before. Dead even. Consistency isn't flashy but it's undefeated.`,
    v => `${v.last} logs last week, same as the week before. Steady. I respect steady.`,
    v => `Two weeks in a row at ${v.last} logs. You've found your rhythm. Want to nudge it up one?`
  ],
  down: [
    v => `Week's in. ${v.last} logs, down ${v.diff} from the week before. Not a crisis. Weeks dip. Let's take this one back.`,
    v => `Last week was ${v.last} logs, ${v.diff} fewer than the week before. Some weeks are like that. New week, clean slate.`,
    v => `${v.last} logs last week. A little lighter than before. You've done more, so you know you can do it again.`
  ]
};

function streakyWeeklyRecap() {
  const habits = data.streaks.habits || [];
  if (habits.length === 0) return null;

  const today = new Date();
  const thisSunday = addDays(today, -today.getDay());
  const lastSunday = addDays(thisSunday, -7);
  const prevSunday = addDays(thisSunday, -14);

  const countRange = (start, end) => {
    let n = 0;
    for (let i = 0; i < 7; i++) {
      const ds = dateStr(addDays(start, i));
      if (addDays(start, i) >= end) break;
      habits.forEach(h => { if (habitLevel(h, ds) > 0) n++; });
    }
    return n;
  };

  const last = countRange(lastSunday, thisSunday);
  const before = countRange(prevSunday, lastSunday);
  if (last === 0 && before === 0) return null;
  const kind = last > before ? 'up' : last === before ? 'even' : 'down';
  const pool = STREAKY_RECAPS[kind];
  const text = pool[streakyDraw('recap_' + kind, pool.length)]({ last, diff: Math.abs(last - before) });
  return { mood: kind === 'up' ? 'pumped' : kind === 'even' ? 'normal' : 'uncertain', text };
}

/* ─────────────────────────────────────────────────────
   STREAKY — dialog engine
   ───────────────────────────────────────────────────── */
let streakyLines = [];
let streakyIdx = 0;
let streakyOpen = false;
let streakyBrowsing = false;   // true while paging the full habit-idea list

/* Which face each holiday wears. Anything unlisted falls back to normal. */
const STREAKY_HOLIDAY_MOOD = {
  newyear: 'pumped',      mlk: 'chill',           valentines: 'normal',
  presidents: 'normal',   stpatricks: 'normal',   mothers: 'chill',
  memorial: 'chill',      fathers: 'chill',       july4: 'unhinged',
  labor: 'chill',         halloween: 'unhinged',  veterans: 'chill',
  thanksgiving: 'chill',  christmaseve: 'unhinged', christmas: 'pumped',
  nye: 'chill'
};

/* ── Expression swapping ───────────────────────────────
   Two stacked <img> layers crossfade so the change reads as a
   shift in expression rather than a flicker. The mood class on the
   portrait drives flame speed and glow colour at the same time. */
let skMood = null;
let skFront = 'A';

function skSetMood(mood) {
  if (!STREAKY_ART[mood]) mood = 'neutral';
  if (mood === skMood) return;
  const wrap = document.getElementById('streakyPortrait');
  const a = document.getElementById('streakyPortraitImg');
  const b = document.getElementById('streakyPortraitImgB');
  if (!wrap || !a || !b) return;

  if (skMood === null) {
    // First paint of this visit. Suppress the crossfade for one frame so
    // the previous visit's expression can't ghost through underneath.
    a.style.transition = 'none';
    b.style.transition = 'none';
    a.src = STREAKY_ART[mood];
    a.style.opacity = '1';
    b.style.opacity = '0';
    skFront = 'A';
    void a.offsetWidth;                 // flush before restoring
    a.style.transition = '';
    b.style.transition = '';
  } else {
    const incoming = skFront === 'A' ? b : a;
    const outgoing = skFront === 'A' ? a : b;
    incoming.src = STREAKY_ART[mood];
    incoming.style.opacity = '1';
    outgoing.style.opacity = '0';
    skFront = skFront === 'A' ? 'B' : 'A';
  }

  wrap.classList.remove('m-chill', 'm-neutral', 'm-normal',
                        'm-pumped', 'm-uncertain', 'm-unhinged');
  wrap.classList.add('m-' + mood);
  skMood = mood;
}

function buildStreakyDialog(opts) {
  const lines = [];
  const now = new Date();
  const special = streakySpecialDate(now);

  // 1. Opening line — a special date REPLACES the quip entirely,
  //    on summons as well as on the daily greeting.
  if (special && special.key === 'birthday') {
    lines.push({ text: streakyBirthdayLine(), mood: 'pumped' });
  } else if (special) {
    const sl = streakyHolidayLine(special.key);
    if (sl) lines.push({ text: sl, mood: STREAKY_HOLIDAY_MOOD[special.key] || 'normal' });
  }
  if (!lines.length) {
    // The quip tiers ARE three of the expressions, so this maps exactly.
    const tiers = ['chill', 'normal', 'unhinged'];
    const tier = tiers[Math.floor(Math.random() * tiers.length)];
    const pool = STREAKY_QUIPS[tier];
    const i = streakyDraw('quip_' + tier, pool.length);
    lines.push({ text: pool[i], mood: tier });
  }

  // 2. Weekly recap (daily open only, once per week)
  if (opts && opts.weekly) {
    const recap = streakyWeeklyRecap();
    if (recap) lines.push({ header: 'Last week', text: recap.text, mood: recap.mood });
  }

  // 3. Habit idea of the day — pinned per day, see streakyTodayIdea()
  const idea = streakyTodayIdea();
  lines.push({ header: 'Daily habit of the day: ' + idea.law, text: idea.text, mood: 'normal' });

  // 4. A habit note on some days (pinned per day), plus the evening
  //    streak warning when it applies. See streakyTodayNote().
  streakyContextLines().forEach(o => lines.push({ text: o.text, mood: o.mood }));

  // 5. Checklist + bucket: overdue / due-soon items every day; on pick days,
  //    random picks from the pinned checklist OR the bucket list (alternating).
  streakyListLines().forEach(l => lines.push(l));

  // 6. Review offer — summoned visits only. The daily greeting stays a
  //    greeting; nobody wants a menu first thing in the morning.
  if (opts && opts.onDemand) {
    lines.push({
      kind: 'offer',
      mood: 'normal',
      text: 'Would you like to review the Atomic Habits suggestions?',
      text2: 'Would you like to review building good habits, or breaking bad ones?'
    });
  }

  return lines;
}

/* ── Typewriter reveal ──────────────────────────────────
   STREAKY_LINE_MS is the target time for a whole line to land.
   Long lines reveal more characters per tick rather than taking
   longer, so a wordy habit idea never drags compared to a short quip.
   Tweak STREAKY_LINE_MS alone to change the feel.            */
const STREAKY_LINE_MS = 1200;
const STREAKY_TICK_MS = 28;
const STREAKY_JITTER_WINDOW = 3;   // how many trailing chars vibrate

let skChars = [];
let skRevealed = 0;
let skPerTick = 1;
let skTyping = false;
let skTimer = null;

function skReduceMotion() {
  return window.matchMedia &&
         window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* Line text arrives HTML-escaped (context lines run names through
   escHtml). Decode to plain text so entities aren't split mid-token,
   then write characters with textContent — never innerHTML. */
function skDecode(html) {
  const t = document.createElement('div');
  t.innerHTML = String(html == null ? '' : html);
  return t.textContent || '';
}

function skBuildChars(el, str) {
  el.textContent = '';
  skChars = [];
  const parts = skDecode(str).split(/(\s+)/);
  parts.forEach(part => {
    if (!part) return;
    if (/^\s+$/.test(part)) {
      el.appendChild(document.createTextNode(part));
      return;
    }
    const word = document.createElement('span');
    word.className = 'sk-w';
    Array.from(part).forEach(ch => {
      const s = document.createElement('span');
      s.className = 'sk-ch';
      s.textContent = ch;
      word.appendChild(s);
      skChars.push(s);
    });
    el.appendChild(word);
  });
}

function skStopTimer() {
  if (skTimer) { clearInterval(skTimer); skTimer = null; }
}

function skFinishReveal() {
  skStopTimer();
  skChars.forEach(s => { s.classList.add('in'); s.classList.remove('jit'); });
  skRevealed = skChars.length;
  skTyping = false;
  const extraEl = document.getElementById('streakyExtra');
  const nextEl = document.getElementById('streakyNext');
  if (extraEl) extraEl.classList.remove('sk-veiled');
  if (nextEl) nextEl.classList.remove('sk-veiled');
}

function skTick() {
  const before = skRevealed;
  skRevealed = Math.min(skChars.length, skRevealed + skPerTick);
  for (let i = before; i < skRevealed; i++) skChars[i].classList.add('in');
  // Only the newest few characters keep vibrating; older ones settle.
  const from = Math.max(0, before - STREAKY_JITTER_WINDOW);
  for (let i = from; i < skRevealed; i++) {
    skChars[i].classList.toggle('jit', i >= skRevealed - STREAKY_JITTER_WINDOW);
  }
  if (skRevealed >= skChars.length) skFinishReveal();
}

function skStartReveal() {
  skStopTimer();
  skRevealed = 0;
  if (!skChars.length || skReduceMotion()) { skFinishReveal(); return; }
  const ticks = Math.max(1, Math.round(STREAKY_LINE_MS / STREAKY_TICK_MS));
  skPerTick = Math.max(1, Math.ceil(skChars.length / ticks));
  skTyping = true;
  const extraEl = document.getElementById('streakyExtra');
  const nextEl = document.getElementById('streakyNext');
  if (extraEl) extraEl.classList.add('sk-veiled');
  if (nextEl) nextEl.classList.add('sk-veiled');
  skTimer = setInterval(skTick, STREAKY_TICK_MS);
  skTick();
}

/* Streaky sits still for anything that fits his seat. A taller line
   first tucks up to STREAKY_TUCK px of him behind the box; only past
   that does he lift, and only by the amount actually needed. */
const STREAKY_TUCK = 24;

/* Streak warnings only fire from this hour onward (24h clock). Before
   it, an unlogged habit just means the day is young. */
const STREAKY_EVENING_HOUR = 18;

function skSeatPortrait() {
  const area = document.querySelector('.streaky-box-area');
  const box = document.querySelector('.streaky-box');
  const wrap = document.querySelector('.streaky-portrait-wrap');
  if (!area || !box || !wrap) return;
  const seat = area.getBoundingClientRect().height;
  const boxH = box.getBoundingClientRect().height;
  const lift = Math.max(0, Math.round(boxH - seat - STREAKY_TUCK));
  wrap.style.transform = lift ? 'translateY(-' + lift + 'px)' : '';
}

/* ── Dialog ────────────────────────────────────────────*/
function openStreaky(opts) {
  streakyBrowsing = false;
  skOfferStep = 0;
  streakyLines = buildStreakyDialog(opts || {});
  streakyIdx = 0;
  streakyOpen = true;
  const ov = document.getElementById('streakyOverlay');
  ov.classList.remove('closing');
  ov.classList.add('open');
  lockScroll();
  renderStreakyLine();
}

function streakyChecklistRows(picks) {
  return picks.map(p => {
    let tag = '';
    if (p.rank === 0) tag = `<span class="sk-tag overdue">${lvLate(Math.abs(p.days))}</span>`;
    else if (p.rank === 1) tag = `<span class="sk-tag soon">${p.days === 0 ? 'Today' : p.days === 1 ? 'Tomorrow' : 'In ' + p.days + ' days'}</span>`;
    return `
      <div class="sk-check-row${p.item.checked ? ' done' : ''}" data-item="${p.item.id}"
           onclick="event.stopPropagation();streakyToggle('${p.section.id}','${p.item.id}',this)">
        <div class="sk-check-box"><span>✓</span></div>
        <div class="sk-check-text">${escHtml(p.item.text)}</div>
        ${tag}
      </div>`;
  }).join('');
}

/* Bucket picks are just reminders: no star button, nothing to tap. */
function streakyBucketRows(picks) {
  return picks.map(p => `
    <div class="sk-bucket-row" style="--c:${folderColor(p.entry)}">
      <span class="sk-bucket-star">${LV_STAR}</span>
      <div class="sk-check-text">${escHtml(p.item.text)}<div class="sk-bucket-tag"><i></i>${escHtml(p.entry.name)}</div></div>
    </div>`).join('');
}

function renderStreakyLine() {
  const line = streakyLines[streakyIdx];
  if (!line) { closeStreaky(); return; }

  const headerEl = document.getElementById('streakyHeader');
  const textEl = document.getElementById('streakyText');
  const extraEl = document.getElementById('streakyExtra');
  const isLast = streakyIdx === streakyLines.length - 1;

  headerEl.textContent = line.header || '';
  headerEl.style.display = line.header ? 'block' : 'none';

  skSetMood(line.mood || 'neutral');

  let extraHtml = '';
  if (line.kind === 'checklist' && line.picks) {
    extraHtml += streakyChecklistRows(line.picks);
  }
  if (line.kind === 'bucket' && line.picks) {
    extraHtml += streakyBucketRows(line.picks);
  }
  if (line.kind === 'offer') {
    const nBuild = STREAKY_HABIT_IDEAS.filter(i => i.law === STREAKY_LAW_BUILD).length;
    const nBreak = STREAKY_HABIT_IDEAS.filter(i => i.law === STREAKY_LAW_BREAK).length;
    extraHtml += skOfferStep === 0
      ? `<div class="sk-choice-row">
           <div class="sk-choice" onclick="event.stopPropagation();streakyOfferYes()">Yes</div>
           <div class="sk-choice dim" onclick="event.stopPropagation();streakyOfferNo()">No</div>
         </div>`
      : `<div class="sk-choice-row col">
           <div class="sk-choice" onclick="event.stopPropagation();streakyBrowseIdeas('${STREAKY_LAW_BUILD}')">
             Building good habits<span class="sk-choice-sub">${nBuild} suggestions</span></div>
           <div class="sk-choice" onclick="event.stopPropagation();streakyBrowseIdeas('${STREAKY_LAW_BREAK}')">
             Breaking bad ones<span class="sk-choice-sub">${nBreak} suggestions</span></div>
         </div>`;
  }

  extraEl.innerHTML = extraHtml;
  extraEl.style.display = extraHtml ? 'block' : 'none';

  // A long previous line may have left the box scrolled.
  const scroller = document.querySelector('.streaky-scroll');
  if (scroller) scroller.scrollTop = 0;

  document.getElementById('streakyNext').textContent = isLast ? '✕' : '▾';

  const shown = (line.kind === 'offer' && skOfferStep === 1 && line.text2)
    ? line.text2 : line.text;
  skBuildChars(textEl, shown);

  // Must come AFTER the characters exist — every span is present from the
  // first frame, so the box is already at its final height and this reads
  // the real number instead of the previous line's.
  skSeatPortrait();

  skStartReveal();
}

/* Page one category of habit ideas in array order. */
const STREAKY_LAW_BUILD = 'Building Good Habits';
const STREAKY_LAW_BREAK = 'Breaking Bad Habits';

function streakyBrowseIdeas(law) {
  const list = law ? STREAKY_HABIT_IDEAS.filter(i => i.law === law) : STREAKY_HABIT_IDEAS;
  if (!list.length) { closeStreaky(); return; }
  streakyBrowsing = true;
  const total = list.length;
  streakyLines = list.map((idea, i) => ({
    header: 'Atomic habit ' + (i + 1) + ' of ' + total + ': ' + idea.law,
    text: idea.text,
    mood: 'normal'
  }));
  streakyIdx = 0;
  renderStreakyLine();
}

/* Two-step review offer. Step 0 is yes/no, step 1 picks the category. */
let skOfferStep = 0;

function streakyOfferYes() {
  skOfferStep = 1;
  renderStreakyLine();
}

function streakyOfferNo() {
  closeStreaky();
}

function streakyAdvance() {
  if (!streakyOpen) return;
  // First tap completes the line, second tap moves on.
  if (skTyping) { skFinishReveal(); return; }
  streakyIdx++;
  if (streakyIdx >= streakyLines.length) closeStreaky();
  else renderStreakyLine();
}

function streakyToggle(sectionId, itemId, el) {
  const found = lvFind('checklist', sectionId);
  const section = found && found.sec;
  if (!section) return;
  const item = (section.items || []).find(i => i.id === itemId);
  if (!item) return;
  item.checked = !item.checked;
  saveData(data);
  el.classList.toggle('done', item.checked);
  if (item.checked) fxFlare(el.querySelector('.sk-check-box'));
  if (currentTab === 'checklist') renderGoalTab('checklist');
}

function closeStreaky() {
  const ov = document.getElementById('streakyOverlay');
  streakyOpen = false;
  skStopTimer();
  skTyping = false;
  streakyBrowsing = false;
  skOfferStep = 0;
  skMood = null;          // next open sets its face without a crossfade
  ov.classList.add('closing');
  saveData(data);
  setTimeout(() => {
    // If he was summoned again during the close animation, leave the new
    // dialog alone — otherwise this stale timer would hide it.
    if (streakyOpen) return;
    ov.classList.remove('open', 'closing');
    unlockScroll();
  }, 320);
}

/* First open of a new day → greet. Otherwise stay out of the way. */
function maybeGreetStreaky() {
  const st = streakyState();
  const today = todayStr();
  if (st.lastGreeted === today) return;

  const thisWeek = weekSundayStr(new Date());
  const doWeekly = st.lastWeekly !== thisWeek;

  const opts = { weekly: doWeekly };

  st.lastGreeted = today;
  if (doWeekly) st.lastWeekly = thisWeek;
  saveData(data);

  setTimeout(() => openStreaky(opts), 420);
}

/* Header button — summon him any time */
function summonStreaky() {
  if (streakyOpen) return;
  openStreaky({ onDemand: true });
}


/* ─────────────────────────────────────────────────────
   INIT
   ───────────────────────────────────────────────────── */
updateDate();
render();
syncHeaderSpacer();

// Header button always wears the face that's looking at you.
document.getElementById('streakyBtnImg').src = STREAKY_IMG;

// Decode every expression up front so the first crossfade of each
// isn't a blank frame. They're inline data URIs, so this is cheap.
Object.keys(STREAKY_ART).forEach(m => { const i = new Image(); i.src = STREAKY_ART[m]; });
skSetMood('neutral');

// First open of a new day -> Streaky says hello
maybeGreetStreaky();
</script>
